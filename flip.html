<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flip Kitaplık — Wir lesen zusammen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f4efe6;--bg1:#f7f2e8;--bg2:#e7dbc4;
  --card:#fffdf7;--cardb:#e2d5bc;--gold:#b8860b;--gold-d:#8a6d3b;
  --gold1:#d4af37;--gold2:#9c7a1e;--text:#3e2723;--muted:#8a7a63;
  --panel:#fffdf7;--panelb:#e3dcd2;--shadow:rgba(62,39,35,.18);
  --pg:#ffffff;--pgs:#d8ceba;--shadl:rgba(60,50,30,.25);
}
[data-theme="dark"]{
  --bg:#0b1329;--bg1:#0d1730;--bg2:#060b18;
  --card:#131b31;--cardb:#22304a;--gold:#f6e05e;--gold-d:#d4af37;
  --gold1:#f6e05e;--gold2:#caa33c;--text:#f1f5f9;--muted:#8aa0c0;
  --panel:#131b31;--panelb:#22304a;--shadow:rgba(0,0,0,.5);
  --pg:#fdfaf2;--pgs:#cbbf9e;--shadl:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer}
#shelf{position:fixed;inset:0;display:flex;flex-direction:column;padding:16px;z-index:10;
  background:rgba(255,255,255,.6);backdrop-filter:blur(6px);overflow:auto;transition:opacity .2s}
[data-theme="dark"] #shelf{background:rgba(8,13,26,.65)}
#shelf.hidden{opacity:0;pointer-events:none}
#sh{max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#sh h1{font-size:20px;margin:0;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.lnav{display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--panelb);background:var(--card);
  color:var(--text);font-size:17px;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ib:active{transform:scale(.96)}
.ib.back{width:auto;padding:0 14px;gap:6px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#fff;border:none;font-size:14px;font-weight:600}
#hint{max-width:1000px;width:100%;margin:8px auto 0;font-size:11.5px;color:var(--muted)}
#grid{max-width:1100px;width:100%;margin:14px auto 0;display:flex;flex-direction:column;gap:18px}
.shelf-sec{margin-bottom:2px}
.shelf-h{font-size:15px;font-weight:700;color:var(--gold-d);margin:0;padding:10px 12px;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--cardb);border-radius:10px;
  box-shadow:0 2px 6px var(--shadow)}
.shelf-h .chv{margin-left:auto;transition:transform .18s;color:var(--muted);font-size:13px}
.shelf-sec.open .shelf-h .chv{transform:rotate(180deg)}
.shelf-body{display:none;padding:12px 2px 2px}
.shelf-sec.open .shelf-body{display:block}
.shelf-h .grip{cursor:grab;color:var(--muted);font-size:14px;padding:0 2px;touch-action:none}
.shelf-sec.dragging{opacity:.45}
.shelf-sec.dragover{border-top:2px solid var(--gold-d)}
.grid-row{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
.bk{background:var(--card);border:1px solid var(--cardb);border-radius:12px;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  box-shadow:0 4px 16px var(--shadow);transition:transform .15s}
.bk:hover{transform:translateY(-3px)}
.bk:active{transform:scale(.97)}
.cv{width:100%;aspect-ratio:5/7;border-radius:4px;background:linear-gradient(135deg,var(--gold1),var(--gold2));
  display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;
  box-shadow:inset -6px 0 10px rgba(0,0,0,.25),3px 4px 10px var(--shadow);position:relative;overflow:hidden}
.cv::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:3px;background:rgba(0,0,0,.2);border-radius:2px}
.cv canvas{width:100%;height:100%;object-fit:contain;border-radius:3px;position:relative;z-index:1}
.bn{font-size:11px;font-weight:600;line-height:1.25;width:100%;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-wrap:break-word}
.bm{font-size:11px;color:var(--muted)}
#reader{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);
  opacity:0;pointer-events:none;transition:opacity .2s}
#reader.on{opacity:1;pointer-events:auto}
#rtop{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--panelb);background:var(--panel)}
#rtitle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#rtitle .ps{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
#stageWrap{flex:1;position:relative;display:flex;overflow:auto;padding:8px;overscroll-behavior:contain}
#stage{position:relative;margin:auto;position:relative;perspective:2600px}
#book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.leaf{position:absolute;top:0;left:0;background:#efe8d9;overflow:visible;box-shadow:0 2px 18px var(--shadl)}
.leaf img,.leaf>canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
/* okuyucu sayfa altina kendi numarasini eklemez (eserlerin cogu kendi numarasini tasir) */
#book .leaf .pg, .turn .face .pg{display:none!important}
/* çevrilen sayfa: ön yüzü yalnız; dönünce saklanır, hedef altta görünür */
.turn{position:absolute;top:0;z-index:6;will-change:transform;
  transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
  box-shadow:0 6px 22px var(--shadl)}
.turn .face{position:absolute;inset:0;overflow:hidden;background:var(--pg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:inset 0 0 0 1px rgba(120,110,90,.05)}
.turn .face.back{transform:rotateY(180deg);background:var(--pg)}
.turn .face{position:absolute;inset:0;overflow:hidden;background:var(--pg)}
@keyframes curlSweep{0%{opacity:0;transform:translateX(-46%)}
  18%{opacity:.85}45%{opacity:.95}70%{opacity:.6}
  100%{opacity:0;transform:translateX(56%)}}
.turn::after{content:"";position:absolute;inset:-12% -20%;pointer-events:none;opacity:0;
  background:
    linear-gradient(118deg,transparent 40%,rgba(0,0,0,.10) 46%,rgba(0,0,0,.34) 52%,rgba(255,255,255,.42) 56%,rgba(0,0,0,.30) 60%,transparent 68%),
    linear-gradient(to right,rgba(0,0,0,.18),transparent 30%);
  filter:blur(2px)}
.turn.curl::after{animation:curlSweep .4s cubic-bezier(.4,.1,.35,1) forwards}
.turn img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.turn img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* okuyucu sayfa altina kendi numarasini eklemez (eserlerin cogu kendi numarasini tasir) */
.turn .face .pg{display:none!important}
.turn .face.back #book .leaf .pg, .turn .face .pg{position:absolute;transform:rotateY(180deg)}
/* --- gerçekçi kitap hissi: sayfa kalınlığı, omurga gölgesi ve dönüş gölgesi --- */
.leaf{box-shadow:0 3px 14px var(--shadl), inset 0 0 0 1px rgba(120,110,90,.08)}
/* iç (omurga) kenar koyuluğu - sol sayfa sağ içte, sağ sayfa sol içte */
.leaf.lf{box-shadow:inset -1px 0 0 rgba(60,45,20,.28), 0 3px 14px var(--shadl)}
.leaf.rt{box-shadow:inset 1px 0 0 rgba(60,45,20,.28), 0 3px 14px var(--shadl)}
/* dönen yaprağın menteşe kenarına kalınlık çizgisi */
.turn::before{content:"";position:absolute;top:-2px;bottom:-2px;width:6px;z-index:3;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.12) 40%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.38));
  opacity:.8}
.turn.hingeR::before{right:-3px}.turn.hingeL::before{left:-3px}
/* alt sayfanın üzerine düşen dönüş gölgesi (dönme boyunca açılır) */
.foldsh{position:absolute;top:0;height:100%;width:34%;pointer-events:none;z-index:4;
  background:linear-gradient(90deg,rgba(30,20,5,.0),rgba(30,20,5,.40));
  opacity:0}
.foldsh.r{right:0;background:linear-gradient(270deg,rgba(30,20,5,.0),rgba(30,20,5,.40))}
.foldsh.go{animation:foldShadow .22s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes foldShadow{0%{opacity:0}25%{opacity:.8}55%{opacity:.55}100%{opacity:0}}
/* açılışta sayfa hafif kalkar */
.turn.fl{transition:transform .34s cubic-bezier(.3,.7,.3,1)}

#rctl{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--panelb)}
  .rctl-row{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex-wrap:wrap}
  #rctl-tools .pc{margin:0}
.c{margin:0;min-width:46px;height:46px;border-radius:11px;border:1px solid var(--panelb);background:var(--card);
  color:var(--text);font-size:19px;box-shadow:0 2px 6px var(--shadow);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.c:hover{transform:translateY(-1px)}.c:active{transform:scale(.95)}
.c.g{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#fff;border:none}
.c.s{min-width:40px;height:40px;font-size:15px}
.c.on{outline:2px solid var(--gold);outline-offset:1px}
.c.tx{width:auto;padding:0 12px;font-size:13px;gap:5px}
.pc{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600}
.pc input{width:58px;height:42px;border-radius:9px;border:1px solid var(--panelb);text-align:center;font-size:14px;background:var(--card);color:var(--text)}
#strip{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:7;display:flex;gap:5px;align-items:flex-end;
  padding:8px 12px;overflow-x:auto;background:linear-gradient(0deg,var(--panel),transparent);
  opacity:0;transition:opacity .2s;pointer-events:none}
#strip.on{opacity:1;pointer-events:auto}
.th{flex:0 0 auto;height:100%;border:2px solid transparent;border-radius:4px;overflow:hidden;cursor:pointer;
  opacity:.8;position:relative;background:var(--pgs)}
.th img{height:100%;width:auto;display:block}
.th.on{border-color:var(--gold-d);opacity:1}
#load{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg)}
#load.on{display:flex}
.sp{width:46px;height:46px;border-radius:50%;border:4px solid var(--panelb);border-top-color:var(--gold);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.lt{color:var(--muted);font-size:13px}

/* RTL butonu: yazı hep görünür, kapalıyken üstte çarpı */
#rtlB{flex-direction:column;gap:1px;line-height:1.05;padding:2px 10px}
#rtlB .rtl-t{font-size:12.5px;font-weight:600}
#rtlB .rtl-x{font-size:10.5px;color:#c0392b;font-weight:800;line-height:1}

@media(max-width:520px){
  #rtop{flex-wrap:wrap;gap:5px 8px;padding:5px 8px}
  #rtop .ib,#rtop .ib.der-btn{height:auto;min-height:0;padding:3px 8px;font-size:12px;line-height:1.4}
  #rtop #rtitle{flex-basis:100%;order:-1;font-size:13px;min-width:0}
  .c{min-width:44px;height:44px}.c.tx{font-size:12px;padding:0 8px}
}

@media (orientation: landscape){#rctl{flex-direction:row;flex-wrap:wrap}#rctl .rctl-row{width:auto;flex:1 1 auto;flex-wrap:nowrap}.c{padding:0 10px}}

.sep{border:none;border-top:2px solid var(--gold1);margin:18px 6px 6px}
.der-h2{margin:8px 10px 4px;font-size:17px;color:var(--gold-d)}
#dershelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:8px 12px 20px}
.der-empty{grid-column:1/-1;color:var(--muted);font-size:13px;padding:8px}
.der{background:var(--card);border:1px solid var(--cardb);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 8px var(--shadow)}
.der .dt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.der .dm{font-size:11px;color:var(--muted)}
.der .dr{display:flex;gap:6px}
.der .db{flex:1;border:none;border-radius:7px;padding:7px;font-size:12px;cursor:pointer;font-weight:600}
.db-go{background:var(--gold1);color:#fff}
.db-del{background:#c0392b;color:#fff}
.dersel{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.derpg{border:1px solid var(--cardb);border-radius:6px;background:var(--card);cursor:pointer;padding:5px 8px;font-size:12px}

#derbox{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;flex-direction:column;visibility:visible}
#derbox.on{display:flex}
.derhd{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--panelb);background:var(--panel)}
.derhd #derT{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.derhd .dbx{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-main)}
.derbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:10px}
.derbody img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 4px 20px var(--shadl)}
.derft{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px;border-top:1px solid var(--panelb)}
.derft .c{min-width:44px}

.der-btn{width:auto!important;padding:0 14px;gap:6px;border:none!important;background:#1e8a4c!important;color:#fff!important;font-size:13px!important;font-weight:700;white-space:nowrap}
.der-btn{width:auto!important;padding:0 10px!important}
.ayCw{position:relative;display:inline-flex}
.ayCw .der-btn{padding:0 10px!important}
.ayMenu{position:absolute;top:100%;right:0;z-index:80;display:none;min-width:200px;max-height:280px;overflow:auto;
  background:#fff;border:1px solid var(--cardb);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px}
.ayMenu.open{display:block}
.ayEmpty{padding:8px 10px;color:#888;font-size:12px;text-align:center}
.ayRow{display:flex;align-items:center;gap:2px;border-bottom:1px solid #f0ece4}
.ayRow:last-child{border-bottom:none}
.ayGo{flex:1;background:none;border:none;padding:8px 8px;text-align:left;font-size:12.5px;color:#222;cursor:pointer;white-space:nowrap}
.ayGo:hover{background:#f5f1e8;border-radius:6px}
.ayN{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;background:#e23636;color:#fff;border-radius:50%;font-size:10px;font-weight:700;margin-right:6px}
.ayDel{background:none;border:none;color:#c0392b;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px}
.ayDel:hover{background:#fbe9e7}
.der-btn.on,.der-btn.on:hover{background:#c0392b!important;filter:none}
.der-btn:hover{filter:brightness(1.08)}

.leaf .rib{position:absolute;top:0;width:24px;height:32px;background:#e23636;z-index:22;box-shadow:0 2px 6px rgba(0,0,0,.35);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:0 0 5px 5px;pointer-events:none}
.leaf.rt .rib{right:5px}
.leaf.lf .rib{left:5px}
.leaf.ribbed{box-shadow:0 0 0 3px #e23636 inset!important}
/* per-sayfa secim butonu + ayrac kalp ikonu */
.leaf .selb{position:absolute;top:-26px;left:50%;transform:translateX(-50%);z-index:23;border:none;border-radius:14px;padding:4px 9px;font-size:9.5px;font-weight:700;line-height:1.2;white-space:nowrap;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35);background:#1e8a4c;color:#fff;max-width:96%;overflow:hidden}
.leaf .selb.seld{background:#c0392b}
.leaf .bmh{position:absolute;top:-2px;width:20px;height:60px;z-index:24;display:none;pointer-events:none;background:linear-gradient(180deg,#e23636 0%,#b02525 78%,#8c1b1b 100%);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,50% 100%,0 70%);box-shadow:2px 3px 6px rgba(0,0,0,.25)}
.leaf.lf .bmh{left:-4px;transform:none;border-radius:0 6px 0 0}
.leaf.rt .bmh{right:-4px;left:auto;border-radius:6px 0 0 0}
.leaf.lf .bmh::after{content:'';position:absolute;bottom:0;left:0;width:0;height:0;border:9px solid #8c1b1b;border-top-color:transparent;border-left-color:transparent}
.leaf.rt .bmh::after{content:'';position:absolute;bottom:0;right:0;width:0;height:0;border:9px solid #8c1b1b;border-top-color:transparent;border-right-color:transparent}
/* yazdirma: gizli alan + yazdirirken sadece onu goster (popup yerine ayni sayfadan) */
#printArea{display:none}
#busy{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(244,239,230,.88)}
#busy.on{display:flex}
[data-theme="dark"] #busy{background:rgba(11,19,41,.88)}
/* Kâbe tavaf göstergesi: kare Kâbe + etrafında kare yol izleyen 4 sarı 4 siyah nokta */
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:120;max-width:80%;
  background:rgba(20,20,20,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;
  text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
.kwrap{position:relative;width:120px;height:120px;display:inline-block}
.kaaba{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;background:#191919;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.kaaba::before{content:'';position:absolute;left:0;right:0;top:9px;height:4px;background:#c9a24b}
.tawaf{position:absolute;left:50%;top:50%;width:0;height:0}
.tdot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#2a2a2a;animation:kwalk 2.6s linear infinite}
.tdot.y{background:#e0a92c}
.tdot.w{background:#ffffff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.tdot.d1{animation-delay:0s}.tdot.d2{animation-delay:-.2167s}
.tdot.d3{animation-delay:-.4333s}.tdot.d4{animation-delay:-.65s}
.tdot.d5{animation-delay:-.8667s}.tdot.d6{animation-delay:-1.0833s}
.tdot.d7{animation-delay:-1.3s}.tdot.d8{animation-delay:-1.5167s}
.tdot.d9{animation-delay:-1.7333s}.tdot.d10{animation-delay:-1.95s}
.tdot.d11{animation-delay:-2.1667s}.tdot.d12{animation-delay:-2.3833s}
@keyframes kwalk{
  0%,100%{transform:translate(-38px,-38px)}
  25%{transform:translate(38px,-38px)}
  50%{transform:translate(38px,38px)}
  75%{transform:translate(-38px,38px)}
}
@media print{
  body.printing #shelf,body.printing #reader,body.printing #derbox,body.printing #load,body.printing #busy{display:none!important}
  body.printing{margin:0}
  body.printing #printArea{display:block}
  @page{size:A4;margin:0}
  #printArea .pp{width:210mm;height:297mm;page-break-after:always;page-break-inside:avoid;display:flex;align-items:center;justify-content:center;margin:0;padding:0}
  #printArea .pp:last-child{page-break-after:auto}
  #printArea img{max-width:210mm;max-height:297mm;object-fit:contain;margin:0}
}

/* ===== Kutuphane Yardim (? butonu -> popup) ===== */
.khelp-btn{
  width:30px;height:30px;border-radius:50%;padding:0;overflow:hidden;
  border:2px solid var(--gold1);background:var(--card);color:var(--gold-d);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  box-shadow:0 2px 8px var(--shadow);
}
.khelp-btn svg{display:block;width:30px;height:30px}
.khelp-btn:active{transform:scale(.96)}
.khelp-pop{display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.45);
  align-items:center;justify-content:center;padding:16px}
.khelp-pop.on{display:flex}
.khelp-box{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:84vh;
  overflow-y:auto;border-radius:14px;border:2px solid var(--gold1);box-shadow:0 10px 40px var(--shadow)}
.khelp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--panelb);

<script>
/* pdf/ klasöründeki kitaplar — A.pdf boş olduğu için listede yok */
/* pdf/ klasöründeki kitaplar — her açılışta GitHub API'den otomatik listelenir */
const FALLBACK_BOOKS=[
  {f:"pdf/Ashabı Bedr ve Şühedayı Uhud.pdf", i:"🕌"},
  {f:"pdf/Bir Kırık Dilekçe Ar.pdf", i:"🤲"},
  {f:"pdf/Bir Kırık Dilekçe Tr.pdf", i:"🤲"},
  {f:"pdf/Büyük Cevşen.pdf", i:"📿"},
  {f:"pdf/Celcelutiye.pdf", i:"🕋"},
  {f:"pdf/Cevşen.pdf", i:"📿"},
  {f:"pdf/Dalail ul khairat_text.pdf", i:"🌸"},
  {f:"pdf/Dua Mecmuasi Mealli.pdf", i:"🕋"},
  {f:"pdf/Kuran-ı Kerim.pdf", i:"📗"},
  {f:"pdf/Tevhidname Mealli.pdf", i:"📔"},
];
const classify=nm=>{nm=(nm||'').toLowerCase();
  if(nm.includes('kuran'))return '📗';
  if(nm.includes('cevşen'))return '📿';
  if(/cevşen|celcel/.test(nm))return '🕋';
  if(nm.includes('bedr')||nm.includes('şüheda'))return '🕌';
  if(/dalail/.test(nm))return '🌸';
  if(/dua/.test(nm))return '🕋';
  if(nm.includes('dilekçe'))return '🤲';
  if(nm.includes('tevhid'))return '📔';
  return '📖';};
let BOOKS=FALLBACK_BOOKS.slice();
const bname=f=>f.split('/').pop().replace(/\.pdf$/i,'');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
const $=id=>document.getElementById(id);
let pdf=null,total=0,cur=1,spread=true,zoom=1,anim=false,cache={};
let rtl=false;

/* --- tema --- */
let theme=localStorage.getItem('flipTheme')||'light';
const applyT=t=>{document.documentElement.dataset.theme=t;$('themeB').textContent=t==='light'?'🌙':'☀️';};
applyT(theme);
const setT=()=>{theme=theme==='light'?'dark':'light';applyT(theme);localStorage.setItem('flipTheme',theme);};

/* --- ses: GitHub Sound klasöründeki page-flip.mp3 --- */
let snd=null,muted=(localStorage.getItem('flipSnd')==='0');
try{snd=new Audio('sound/page-flip.mp3');snd.preload='auto';}catch(e){}
function setMute(m){muted=!!m;localStorage.setItem('flipSnd',muted?'0':'1');paintSnd();}
function paintSnd(){const g=muted?'🔇':'🔊';const a=$('sndB'),b2=$('sndB2');if(a)a.textContent=g;if(b2)b2.textContent=g;}
paintSnd();
function playSound(){if(muted||!snd)return;
  try{snd.pause();snd.currentTime=0;const pr=snd.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}}

/* --- pdf render --- */
function pg(n){if(n<1||n>total)return Promise.reject('range');
  if(cache[n])return Promise.resolve(cache[n]);
  return pdf.getPage(n).then(p=>{let sc=1.35;
    const pw=p.view[2]-p.view[0];if(pw>1500)sc=Math.min(sc,1300/pw);if(sc<0.7)sc=0.7;
    const vp=p.getViewport({scale:sc});const c=document.createElement('canvas');
    c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    return p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(()=>(cache[n]=c)).catch(()=>{
      const vp2=p.getViewport({scale:0.85});c.width=Math.ceil(vp2.width);c.height=Math.ceil(vp2.height);
      return p.render({canvasContext:c.getContext('2d'),viewport:vp2}).promise.then(()=>(cache[n]=c));
    });});}
function addPageImg(el,n){if(n<1||n>total)return;
  pg(n).then(c=>{if(!el.isConnected)return;const im=document.createElement('img');
    im.src=c.toDataURL('image/jpeg',.9);el.appendChild(im);}).catch(()=>{});}

/* --- boyut --- */
let pw=1,ph=1;
function baseP(){return pdf.getPage(1).then(p=>{const vp=p.getViewport({scale:1});pw=vp.width;ph=vp.height;});}
let lw=0,lh=0,gap=0;
function layout(){const w=$('stageWrap');const aw=w.clientWidth-20,ah=w.clientHeight-16;
  const ratio=ph/pw,per=spread?2:1;gap=spread?Math.max(0,Math.min(3,aw*.004)):0;
  let wd=(aw-gap)/per,ht=wd*ratio;if(ht>ah){ht=ah;wd=ht/ratio;}wd*=zoom;ht*=zoom;lw=wd;lh=ht;
  $('stage').style.width=((per*wd)+gap)+'px';$('stage').style.height=ht+'px';}
const clearB=()=>{const b=$('book');while(b.firstChild)b.removeChild(b.firstChild);};

/* --- görünen pencere (sayfa numaraları) --- */
function step(){return spread?2:1;}
function canFwd(){return cur+step()<=total;}
function canPrev(){return cur>1;}
function fwdTarget(){const t=cur+step();return t>total?total:t;}
function prevTarget(){return Math.max(1,cur-step());}
/* yayılmada hangi sayfa hangi tarafta:  LTR -> cur solda, cur+1 sağda ;
   RTL -> cur (öndeki) sağda, cur+1 solda (sağdan sola okuma) */
function sidePages(){
  if(!spread)return {l:0,r:cur,c:cur};
  if(rtl){const l=cur+1<=total?cur+1:0;return {l:l,r:cur,c:0};}
  const r=cur+1<=total?cur+1:0;return {l:cur,r:r,c:0};
}

/* statik sayfa elemanı */
function pageEl(n,isRight){const d=document.createElement('div');d.className='leaf '+(isRight?'rt':'lf');d.setAttribute('data-pg',n);
  d.style.width=lw+'px';d.style.height=lh+'px';
  d.style.left=isRight?(lw+gap)+'px':'0px';
  if(n>=1&&n<=total){
    const m=document.createElement('div');m.className='pg';m.textContent=n;d.appendChild(m);
    /* derlemeye ekle secim butonu (sayfa ust-ortasi) */
    const sel=document.createElement('button');sel.type='button';sel.className='selb';
    sel.setAttribute('data-selpg',n);
    const on=curRib.has(ribKeyFor(n));
    sel.textContent=on?'Seçildi ✓':'+ Derlemeye Ekle';
    sel.classList.toggle('seld',on);
    d.appendChild(sel);
    /* ayraç kurdela (ust kenardan sarkan) */
    const heart=document.createElement('div');heart.className='bmh';
    heart.style.display=ayHas(n)?'block':'none';
    d.appendChild(heart);
  }
  addPageImg(d,n);return d;}
function paint(){const w=$('stageWrap');if(w)w.scrollTop=0;const b=$('book');clearB();const sp=sidePages();
  if(!spread){b.appendChild(pageEl(cur,false));}
  else{b.appendChild(pageEl(sp.l,false));if(sp.r>=1&&sp.r<=total)b.appendChild(pageEl(sp.r,true));}}

/* --- çevirme: üstte dönen tek sayfa; hedef pencere altta hazır --- */
function turnEl(n,isRight,origin,rotDeg,reveal){
  const t=document.createElement('div');t.className='turn';
  t.style.width=lw+'px';t.style.height=lh+'px';
  t.style.left=isRight?(lw+gap)+'px':'0px';
  t.classList.add(origin.indexOf('left')===0?'hingeL':'hingeR');
  const fold=document.createElement('div');fold.className='foldsh'+(rotDeg<0?' r':'');
  t.appendChild(fold);
  const front=document.createElement('div');front.className='face front';
  if(n>=1&&n<=total){const m=document.createElement('div');m.className='pg';m.textContent=n;front.appendChild(m);}
  addPageImg(front,n);
  const back=document.createElement('div');back.className='face back';
  if(reveal>=1&&reveal<=total){const m2=document.createElement('div');m2.className='pg';m2.textContent=reveal;back.appendChild(m2);}
  addPageImg(back,reveal);
  t.appendChild(front);t.appendChild(back);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fold.classList.add('go');
    t.style.transition='transform .22s cubic-bezier(.28,.06,.3,1)';
    t.style.transformOrigin=origin;
    t.style.transform='perspective(1300px) rotateY('+rotDeg+'deg)';
  }));
  t._flipMs=240;
  return t;}

function doFlip(fwd){
  return new Promise(done=>{
    const b=$('book');clearB();
    const tgt=fwd?fwdTarget():prevTarget();
    /* hedef pencereyi alta yerleştir (sadece geçici cur) */
    const save=cur;cur=tgt;
    const sp=sidePages();
    if(!spread){b.appendChild(pageEl(sp.c,false));}
    else{b.appendChild(pageEl(sp.l,false));if(sp.r>=1&&sp.r<=total)b.appendChild(pageEl(sp.r,true));}
    cur=save;
    /* dönen sayfa */
    if(spread){
      if(fwd){
        if(rtl) b.appendChild(turnEl(cur+1,false,'right center',150,sp.r));  // RTL: sol sayfa içe döner
        else    b.appendChild(turnEl(cur+1,true ,'left center',-150,sp.l));  // LTR: sağ sayfa döner
      }else{
        if(rtl) b.appendChild(turnEl(cur,true ,'left center',-150,sp.l));    // RTL: sağ sayfa geri döner
        else    b.appendChild(turnEl(cur,false,'right center',150,sp.r));    // LTR: sol sayfa geri döner
      }
    }else{
      if(fwd) b.appendChild(turnEl(cur,false, rtl?'right center':'left center', rtl?150:-150, sp.c));
      else    b.appendChild(turnEl(cur,false, rtl?'left center':'right center', rtl?-150:150, sp.c));
    }
    setTimeout(done,240);
  });
}

/* --- kontroller --- */
function updateUI(){$('pageIn').value=cur;$('tot').textContent=total;
  $('viewB').textContent=spread?'Çift':'Tek';
  $('viewB').classList.toggle('on',spread);
  $('rtlB').innerHTML=rtl?'<span class="rtl-t">العربية</span>':'<span class="rtl-x">✕</span><span class="rtl-t">العربية</span>';
  $('rtlB').classList.toggle('on',rtl);
  const sp=sidePages();const ps=$('rtitle').querySelector('.ps');
  if(spread){ps.textContent=(rtl?'RTL · ':'')+'Sayfa '+cur+'–'+(cur+1<=total?cur+1:cur)+' / '+total;}
  else ps.textContent=(rtl?'RTL · ':'')+'Sayfa '+cur+' / '+total;
  buildStrip();ayBState();}
async function nav(fwd){if(anim||!pdf)return;
  const ok=fwd?canFwd():canPrev();if(!ok)return;
  anim=true;playSound();try{await doFlip(fwd);}catch(e){}cur=fwd?fwdTarget():prevTarget();paint();anim=false;updateUI();markCurrentRib();}
const next=()=>nav(true),prev=()=>nav(false);
function first(){if(anim)return;cur=1;paint();updateUI();markCurrentRib();}
function last(){if(anim)return;
  cur = spread ? (total%2===1? total : Math.max(1,total-1)) : total;
  paint();updateUI();}
function setZoom(d){zoom=Math.max(.45,Math.min(10,zoom+d));if(pdf){layout();paint();}}
function toggleView(){if(anim||!pdf)return;spread=!spread;cur=Math.min(cur,total);layout();paint();updateUI();}
function toggleRtl(){if(anim||!pdf)return;rtl=!rtl;paint();updateUI();}

/* --- şerit --- */
function buildStrip(){const st=$('strip');st.innerHTML='';
  const s=step();
  for(let i=1;i<=total;i+=s){const th=document.createElement('div');
    th.className='th'+(i===cur?' on':'');th.title='Sayfa '+i;
    th.onclick=()=>{if(!anim&&i!==cur){cur=i;paint();updateUI();}};
    addPageImg(th,i);st.appendChild(th);} }
const toggleStrip=()=>$('strip').classList.toggle('on');

/* --- ana sayfaya dön --- */
function goHome(){location.href='index.html';}

/* --- kitap aç --- */
async function openBook(k){const bk=BOOKS[k];curFile=bk.f;
  $('load').classList.add('on');$('shelf').classList.add('hidden');
  pdf=null;cache={};total=0;cur=1;anim=false;rtl=false;curRib=new Set();curAy=[];loadAy();
    ayBState();try{
    pdf=await pdfjsLib.getDocument(bk.f).promise;total=pdf.numPages;await baseP();
    spread=total>1;
    var st=ayForFile();if(st&&st<=total){cur=st;}
    $('rtitle').innerHTML=bk.i+' '+bname(bk.f)+'<span class="ps"></span>';
    $('reader').classList.add('on');layout();paint();updateUI();markCurrentRib();
  }catch(e){console.error(e);alert('PDF açılamadı: '+bname(bk.f));$('shelf').classList.remove('hidden');}
  finally{$('load').classList.remove('on');} }

/* pdf/ i\u00e7eri\u011fini GitHub API ile \u00e7ek \u2014 k\u00f6k dosyalar en \u00fcstte, alt klas\u00f6rler kendi raflar\u0131nda.
   Sonradan eklenen klas\u00f6r/dosyalar otomatik gelir. */
function pdfName(n){return n.replace(/\.pdf$/i,'');}
function loadPdfList(){
  /* Tum dosya yollarini TEK istekle cek (git/trees recursive) */
  var api='https://api.github.com/repos/mckurdi27/Wir-lesen-zusammen-/git/trees/main?recursive=1';
  fetch(api)
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(tr){
      var list=[];
      (tr.tree||[]).forEach(function(it){
        if(it.type!=='blob')return;
        var path=it.path||'';
        if(path.indexOf('pdf/')!==0)return;
        var name=path.slice(4);
        var fn=name.split('/').pop();
        if(!/\.pdf$/i.test(fn)||/^A\.pdf$/i.test(fn))return;
        var cat='';var slash=name.indexOf('/');
        if(slash>=0)cat=name.slice(0,slash);
        list.push({f:path,i:classify(fn),cat:cat});
      });
      if(list.length){
        list.sort(function(a,b){
          var ao=(a.cat===''?0:1),bo=(b.cat===''?0:1);
          if(ao!==bo)return ao-bo;
          if(a.cat!==b.cat)return (a.cat||'').localeCompare(b.cat||'','tr');
          return a.f.localeCompare(b.f,'tr');
        });
        BOOKS=list;
      }
      buildShelf();
    })
    .catch(function(e){buildShelf();});
}

function shelfKey(b){return b.cat||'\u0000';}
function shelfCatName(c){return c==='\u0000'?'\ud83d\udcd6 G\u00fcnl\u00fck Takip':('\ud83d\udcd6 '+c);}
function loadOrder(){try{var o=JSON.parse(localStorage.getItem('flipShelfOrder')||'null');return Array.isArray(o)?o:null;}catch(e){return null;}}
function saveOrder(list){try{localStorage.setItem('flipShelfOrder',JSON.stringify(list));}catch(e){}}
function persistOrderFromDom(g){var order=[];var all=g.querySelectorAll('.shelf-sec');all.forEach(function(s){var c=s.getAttribute('data-cat');if(c&&c!=='\u0000')order.push(c);});saveOrder(order);}
function buildShelf(){var g=$('grid');g.innerHTML='';
  var groups=[],last=null;
  BOOKS.forEach(function(bk,gi){var key=shelfKey(bk);
    if(key!==last){groups.push({cat:key,books:[]});last=key;}
    groups[groups.length-1].books.push(gi);});
  var rootGr=null,catGr=[];
  groups.forEach(function(gr){ if(gr.cat==='\u0000')rootGr=gr; else catGr.push(gr); });
  catGr.sort(function(a,b){return a.cat.localeCompare(b.cat,'tr');});
  var order=loadOrder();
  if(order&&catGr.length){var map={};catGr.forEach(function(g2){map[g2.cat]=g2;});var re=[],seen={};
    order.forEach(function(c){if(map[c]&&!seen[c]){re.push(map[c]);seen[c]=1;}});
    catGr.forEach(function(g2){if(!seen[g2.cat]){re.push(g2);seen[g2.cat]=1;}});
    catGr=re;}
  var ordered=[]; if(rootGr)ordered.push(rootGr); ordered=ordered.concat(catGr);
  var secs=[];
  ordered.forEach(function(gr,si){
    var sec=document.createElement('div');sec.className='shelf-sec';sec.setAttribute('data-cat',gr.cat);
    var hd=document.createElement('div');hd.className='shelf-h';
    if(gr.cat!=='\u0000'){var grip=document.createElement('span');grip.className='grip';grip.textContent='\u2261';hd.appendChild(grip);}

    sec.appendChild(hd);sec.appendChild(body);g.appendChild(sec);secs.push(sec);
  });
  /* alt klasor raflari arasi surukle-birak (kok 'Gunluk Takip' sabit) */
  var drag=null;
  g.querySelectorAll('.shelf-sec').forEach(function(sec){
    if(sec.getAttribute('data-cat')==='\u0000')return;
    sec.draggable=true;
    sec.addEventListener('dragstart',function(e){drag=sec;sec.classList.add('dragging');try{e.dataTransfer.setData('text/plain',sec.getAttribute('data-cat'));}catch(err){}});
    sec.addEventListener('dragend',function(){drag=null;sec.classList.remove('dragging');g.querySelectorAll('.shelf-sec').forEach(function(s){s.classList.remove('dragover');});persistOrderFromDom(g);});
    sec.addEventListener('dragover',function(e){e.preventDefault();if(!drag||drag===sec)return;sec.classList.add('dragover');});
    sec.addEventListener('dragleave',function(){sec.classList.remove('dragover');});
    sec.addEventListener('drop',function(e){e.preventDefault();g.querySelectorAll('.shelf-sec').forEach(function(s){s.classList.remove('dragover');});if(!drag||drag===sec)return;var after=sec.nextSibling;g.insertBefore(drag,after);persistOrderFromDom(g);});
  });
}
function bkCard(bk,gi){var c=document.createElement('div');c.className='bk';
  var cv=document.createElement('div');cv.className='cv';var canvas=document.createElement('canvas');cv.appendChild(canvas);
  var bn=document.createElement('div');bn.className='bn';bn.textContent=pdfName(bk.f.split('/').pop());
  var bm=document.createElement('div');bm.className='bm';bm.textContent='\u2026';
  c.appendChild(cv);c.appendChild(bn);c.appendChild(bm);c.onclick=function(){openBook(gi);};
  scheduleCover(canvas,bm,bk);  /* kapak render islemci tarafindan gorununce, sinirli eszamanlilikla yapilir */
  return c;}
/* Kapak render: tum PDF'leri ayni anda acmak tarayiciyi cokertip "Hay aksi" cakilmasina yol aciyordu.
   - sadece kart ekrana girdiginde (grup acilinca) render et
   - es zamanli is 3 ile sinirli
   - ilk sayfa alininca PDF'i destroy et (bellek bosalir) */
var _covQ=[],_covBusy=0,_covLim=3,_covIO=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting){_covIO.unobserve(e.target);var d=e.target._cov;if(d){e.target._cov=null;_covQ.push(d);pumpCovers();}}});
},{rootMargin:'300px 0px'}):null;
function scheduleCover(canvas,bm,bk){var job={canvas:canvas,bm:bm,bk:bk};
  if(_covIO){canvas._cov=job;_covIO.observe(canvas);}
  else{_covQ.push(job);pumpCovers();}}
function pumpCovers(){if(!_covQ.length)return;
  while(_covBusy<_covLim&&_covQ.length){_covBusy++;var j=_covQ.shift();renderCover(j);}}
function renderCover(j){
  pdfjsLib.getDocument(j.bk.f).promise.then(function(pd){
    if(j.bm.isConnected)j.bm.textContent=pd.numPages+' sayfa';
    return pd.getPage(1).then(function(page){
      var vp=page.getViewport({scale:.5});j.canvas.width=vp.width;j.canvas.height=vp.height;
      return page.render({canvasContext:j.canvas.getContext('2d'),viewport:vp}).promise;
    }).then(function(){try{pd.destroy();}catch(e){}});
  }).catch(function(){if(j.bm.isConnected)j.bm.textContent='\u2014';})
    .then(function(){_covBusy--;pumpCovers();});}

  curRib.forEach(function(k){if(k.indexOf(sep)===0){var pg=parseInt(k.slice(sep.length),10);if(pg>=1&&pg<=total&&picked.indexOf(pg)<0)picked.push(pg);}});
  if(!picked.length){showToast2('Sayfaları kurdela ile işaretle (sayfaya tıkla), sonra Derle de.');return;}
  picked.sort(function(a,b){return a-b;});
  var d=loadDers();var mine=Object.keys(d).filter(function(n){return d[n].f===curFile;});
  var nm=null;
  if(!mine.length){nm=(prompt('Yeni derleme adı (boş = Derleme):')||'').trim();if(!nm)nm='Derleme';if(d[nm]){showToast2('Bu ad zaten var.');return}d[nm]={f:curFile,p:picked.slice()};}
  else{
    var pr=(prompt(picked.length+' sayfa eklenecek derleme? (boş = yeni)\n\nMevcut: '+mine.join(', '))||'').trim();
    if(!pr){nm=(prompt('Yeni derleme adı:')||'').trim();if(!nm)nm='Derleme';if(d[nm]){showToast2('Zaten var.');return}d[nm]={f:curFile,p:picked.slice()};}
    else{nm=pr;if(!d[nm]){showToast2('Derleme bulunamadı.');return}
      if(d[nm].f!==curFile){showToast2('Bu derleme başka esere ait.');return}

function derReloadPage(){if(!derDoc||!derPages||_busy)return;var n=derPages[derIdx];delete derCache[n];delete derCache['__c'];busyOn('Sayfa yenileniyor…');renderDerPage();setTimeout(busyOff,450);}
function pgCached(n){if(derCache[n])return Promise.resolve(derCache[n]);if(!derDoc)return Promise.reject();
  return derDoc.getPage(n).then(function(pp){var sc=1.35,pw=pp.view[2]-pp.view[0];if(pw>1500)sc=Math.min(sc,1300/pw);if(sc<0.7)sc=0.7;

    return pp.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){derCache[n]=c;return c;});});}
function showImg(can){var img=$('derImg'),L=$('derLoad'),St=$('derStage');if(!img)return;
  img.src=can.toDataURL('image/jpeg',0.9);img.style.display='inline-block';if(L)L.style.display='none';if(St){St.style.display='flex';}
  img.onerror=function(){img.onerror=null;if(L)L.style.display='block';};}
function renderDerPage(){
  var img=$('derImg'),L=$('derLoad'),St=$('derStage'),n=derPages[derIdx];
  if(img)img.removeAttribute('src');if(L)L.style.display='block';if(St)St.style.display='none';

  if(derMode===2&&derIdx+1<derPages.length){
    Promise.all([pgCached(n),pgCached(derPages[derIdx+1])]).then(function(cc){
      var a=cc[0],b=cc[1],h=Math.max(a.height,b.height),gap=Math.max(4,Math.round(h*0.02));
      var W=a.width+b.width+gap,H=h,r=1,mw=1600;if(W>mw)r=mw/W;
      var c=document.createElement('canvas');c.width=Math.round(W*r);c.height=Math.round(H*r);
      var x=c.getContext('2d');x.fillStyle='#efe8d9';x.fillRect(0,0,c.width,c.height);
      var aw=Math.round(a.width*r),ah=Math.round(a.height*r),bw=Math.round(b.width*r),bh=Math.round(b.height*r),ga=Math.round(gap*r);
      x.drawImage(a,0,Math.round((c.height-ah)/2),aw,ah);x.drawImage(b,aw+ga,Math.round((c.height-bh)/2),bw,bh);
      derCache['__c']=c;showImg(c);

let _busy=false;
function busyOn(msg){if(_busy)return false;_busy=true;
  var t=$('busyTxt');if(t)t.textContent=msg||'İşleniyor…';
  var b=$('busy');if(b)b.classList.add('on');return true;}
function busyOff(){$('busy').classList.remove('on');_busy=false;}

/* Ayni sayfa icinde gizli alana sayfalari cizip window.print() ile yazdir.
   Popup kullanmaz -> tam ekran/PWA'da da calisir, bos ekran/karakter sorunu olmaz. */
async function printPages(f,pages,title){
  if(_busy)return;busyOn(pages.length+' sayfa hazırlanıyor…');
  try{
    var area=document.getElementById('printArea');
    area.innerHTML='';
    var doc=await pdfjsLib.getDocument(f).promise;
    var imgs=[];
    for(var n of pages){
      try{
        var p=await doc.getPage(n);
        var vp=p.getViewport({scale:2});
        if(vp.width>1600||vp.height>1600){var sc=Math.min(1600/vp.width,1600/vp.height);vp=p.getViewport({scale:2*sc});}
        var c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
        await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        var img=document.createElement('img');img.src=c.toDataURL('image/jpeg',.92);
        var w=document.createElement('div');w.className='pp';w.appendChild(img);
        area.appendChild(w);imgs.push(img);
      }catch(e){}
    }
    if(!imgs.length){return;}
    /* tum gorseller yuklenene kadar bekle, sonra yazdir */
    await Promise.all(imgs.map(function(im){
      if(im.complete&&im.naturalWidth>0)return Promise.resolve();
      return new Promise(function(res){im.onload=im.onerror=function(){res();};});
    }));
    document.body.classList.add('printing');
    await new Promise(function(r){setTimeout(r,100);});
    window.print();
  }catch(e){console.error(e);}
  finally{setTimeout(function(){var a=document.getElementById('printArea');if(a)a.innerHTML='';document.body.classList.remove('printing');busyOff();},700);}
}

<script>

  '<h4>K\u00fct\u00fcphane nedir?</h4><ul>'
+ '<li>pdf/ klas\u00f6r\u00fcndeki t\u00fcm eserleri raflar halinde g\u00f6sterir.</li>'

+ '<h4>Nas\u0131l kullan\u0131l\u0131r?</h4><ul>'
+ '<li>Raftaki kitaba dokun \u2014 okuyucu a\u00e7\u0131l\u0131r.</li>'
+ '<li>Alt sat\u0131rdaki oklarla sayfa \u00e7evir, ortadaki kutudan sayfa numaras\u0131na git.</li>'
+ '<li><b>&#8635;</b> sayfa gelmediyse yeniler; <b>&#8801;</b> sayfa \u015feridini a\u00e7ar.</li>'
+ '<li><b>&#10133; Derle</b> sayfay\u0131 derlemene ekler; <b>Ayra\u00e7</b> kald\u0131\u011f\u0131n sayfay\u0131 i\u015faretler.</li></ul>'
+ '<h4>Di\u011fer d\u00fc\u011fmeler</h4><ul>'
+ '<li><b>&#128266;</b> sayfa sesi, <b>&#127769;</b> tema, <b>&#9974;</b> tam ekran.</li>'

function khelpAc(){
  var b=document.getElementById('khelp-pop'); if(!b) return;
  b.querySelector('.khelp-body').innerHTML = KUTUPHANE_YARDIM;
  b.classList.add('on');
}
function khelpKapat(){ var b=document.getElementById('khelp-pop'); if(b) b.classList.remove('on'); }
document.addEventListener('click', function(e){
  var t=e.target;
  if(!t) return;
  if(t.id==='khelpB' || (t.closest && t.closest('#khelpB'))){ khelpAc(); return; }
  if(t.id==='khelp-pop' || (t.classList && t.classList.contains('khelp-x'))) khelpKapat();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') khelpKapat(); });
</script>
