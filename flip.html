<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flip Kitaplık — Wir lesen zusammen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f4efe6;--bg1:#f7f2e8;--bg2:#e7dbc4;
  --card:#fffdf7;--cardb:#e2d5bc;--gold:#b8860b;--gold-d:#8a6d3b;
  --gold1:#d4af37;--gold2:#9c7a1e;--text:#3e2723;--muted:#8a7a63;
  --panel:#fffdf7;--panelb:#e3dcd2;--shadow:rgba(62,39,35,.18);
  --pg:#ffffff;--pgs:#d8ceba;--shadl:rgba(60,50,30,.25);
}
[data-theme="dark"]{
  --bg:#0b1329;--bg1:#0d1730;--bg2:#060b18;
  --card:#131b31;--cardb:#22304a;--gold:#f6e05e;--gold-d:#d4af37;
  --gold1:#f6e05e;--gold2:#caa33c;--text:#f1f5f9;--muted:#8aa0c0;
  --panel:#131b31;--panelb:#22304a;--shadow:rgba(0,0,0,.5);
  --pg:#fdfaf2;--pgs:#cbbf9e;--shadl:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer}
#shelf{position:fixed;inset:0;display:flex;flex-direction:column;padding:16px;z-index:10;
  background:rgba(255,255,255,.6);backdrop-filter:blur(6px);overflow:auto;transition:opacity .2s}
[data-theme="dark"] #shelf{background:rgba(8,13,26,.65)}
#shelf.hidden{opacity:0;pointer-events:none}
#sh{max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#sh h1{font-size:20px;margin:0;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.lnav{display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--panelb);background:var(--card);
  color:var(--text);font-size:17px;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ib:active{transform:scale(.96)}
.ib.back{width:auto;padding:0 14px;gap:6px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#fff;border:none;font-size:14px;font-weight:600}
#hint{max-width:1000px;width:100%;margin:8px auto 0;font-size:11.5px;color:var(--muted)}
#grid{max-width:1000px;width:100%;margin:14px auto 0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bk{background:var(--card);border:1px solid var(--cardb);border-radius:14px;padding:14px 10px;
  display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
  box-shadow:0 4px 16px var(--shadow);transition:transform .15s}
.bk:hover{transform:translateY(-3px)}
.bk:active{transform:scale(.97)}
.cv{width:72px;height:100px;border-radius:5px;background:linear-gradient(135deg,var(--gold1),var(--gold2));
  display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;
  box-shadow:inset -6px 0 10px rgba(0,0,0,.25),3px 4px 10px var(--shadow);position:relative}
.cv::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:3px;background:rgba(0,0,0,.2);border-radius:2px}
.bn{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm{font-size:11px;color:var(--muted)}
#reader{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);
  opacity:0;pointer-events:none;transition:opacity .2s}
#reader.on{opacity:1;pointer-events:auto}
#rtop{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--panelb);background:var(--panel)}
#rtitle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#rtitle .ps{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
#stageWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#stage{position:relative;perspective:2600px}
#book{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.leaf{position:absolute;top:0;background:var(--pg);overflow:hidden;box-shadow:0 2px 18px var(--shadl)}
.leaf img,.leaf>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pg{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;color:#9a8c76;pointer-events:none;z-index:2;font-weight:600}
/* çevrilen sayfa: ön yüzü yalnız; dönünce saklanır, hedef altta görünür */
.turn{position:absolute;top:0;z-index:6;background:var(--pg);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform;
  box-shadow:0 6px 34px var(--shadl)}
@keyframes curlSweep{0%{opacity:0;transform:translateX(-46%)}
  18%{opacity:.85}45%{opacity:.95}70%{opacity:.6}
  100%{opacity:0;transform:translateX(56%)}}
.turn::after{content:"";position:absolute;inset:-12% -20%;pointer-events:none;opacity:0;
  background:
    linear-gradient(118deg,transparent 40%,rgba(0,0,0,.10) 46%,rgba(0,0,0,.34) 52%,rgba(255,255,255,.42) 56%,rgba(0,0,0,.30) 60%,transparent 68%),
    linear-gradient(to right,rgba(0,0,0,.18),transparent 30%);
  filter:blur(2px)}
.turn.curl::after{animation:curlSweep .4s cubic-bezier(.4,.1,.35,1) forwards}
.turn img,.turn>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.turn img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.turn .pg{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:11px;color:#9a8c76;pointer-events:none;z-index:2;font-weight:600}
#rctl{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;flex-wrap:wrap;
  background:var(--panel);border-top:1px solid var(--panelb)}
.c{margin:0;min-width:46px;height:46px;border-radius:11px;border:1px solid var(--panelb);background:var(--card);
  color:var(--text);font-size:19px;box-shadow:0 2px 6px var(--shadow);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.c:hover{transform:translateY(-1px)}.c:active{transform:scale(.95)}
.c.g{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#fff;border:none}
.c.s{min-width:40px;height:40px;font-size:15px}
.c.on{outline:2px solid var(--gold);outline-offset:1px}
.c.tx{width:auto;padding:0 12px;font-size:13px;gap:5px}
.pc{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600}
.pc input{width:58px;height:42px;border-radius:9px;border:1px solid var(--panelb);text-align:center;font-size:14px;background:var(--card);color:var(--text)}
#strip{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:7;display:flex;gap:5px;align-items:flex-end;
  padding:8px 12px;overflow-x:auto;background:linear-gradient(0deg,var(--panel),transparent);
  opacity:0;transition:opacity .2s;pointer-events:none}
#strip.on{opacity:1;pointer-events:auto}
.th{flex:0 0 auto;height:100%;border:2px solid transparent;border-radius:4px;overflow:hidden;cursor:pointer;
  opacity:.8;position:relative;background:var(--pgs)}
.th img{height:100%;width:auto;display:block}
.th.on{border-color:var(--gold-d);opacity:1}
#load{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg)}
#load.on{display:flex}
.sp{width:46px;height:46px;border-radius:50%;border:4px solid var(--panelb);border-top-color:var(--gold);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.lt{color:var(--muted);font-size:13px}

/* RTL butonu: yazı hep görünür, kapalıyken üstte çarpı */
#rtlB{flex-direction:column;gap:1px;line-height:1.05;padding:2px 10px}
#rtlB .rtl-t{font-size:12.5px;font-weight:600}
#rtlB .rtl-x{font-size:10.5px;color:#c0392b;font-weight:800;line-height:1}

@media(max-width:520px){.c{min-width:44px;height:44px}.c.tx{font-size:12px;padding:0 8px}}
</style>
</head>
<body>
<div id="load"><div class="sp"></div><div class="lt">Kitap açılıyor…</div></div>

<div id="shelf">
  <div id="sh">
    <div class="lnav">
      <h1><span>📖</span>Flip Kitaplık</h1>
    </div>
    <div class="acts">
      <button class="ib" id="sndB" title="Sayfa sesi aç/kapat">🔊</button>
      <button class="ib" id="themeB" title="Tema değiştir">🌙</button>
      <button class="ib" id="fullB" title="Tam ekran">⛶</button>
      <button class="ib back" id="homeB" title="Ana sayfaya dön (index.html)">Anasayfa</button>
    </div>
  </div>
  <div id="hint">pdf/ klasöründeki eserler listelenir. Kitaba dokunup açın.</div>
  <div id="grid"></div>
</div>

<div id="reader">
  <div id="rtop">
    <button class="ib" id="backB" title="Kitaplığa dön">‹</button>
    <div id="rtitle"></div>
    <button class="ib" id="sndB2" title="Sayfa sesi aç/kapat">🔊</button>
    <button class="ib c s" id="stripB" title="Sayfa şeridi">☰</button>
    <button class="ib back" id="homeB2" title="Ana sayfaya dön (index.html)">Anasayfa</button>
  </div>
  <div id="stageWrap">
    <div id="strip"></div>
    <div id="stage"><div id="book"></div></div>
  </div>
  <div id="rctl">
    <button class="c g" id="firstB" title="İlk">«</button>
    <button class="c g" id="prevB" title="Önceki">‹</button>
    <div class="pc"><input id="pageIn" inputmode="numeric"><span>/</span><span id="tot">…</span></div>
    <button class="c g" id="nextB" title="Sonraki">›</button>
    <button class="c g" id="lastB" title="Son">»</button>
    <div style="flex:1"></div>
    <button class="c s tx" id="viewB" title="Tek sayfa / çift sayfa">Çift</button>
    <button class="c s tx" id="rtlB" title="Okuma yönü: soldan sağa / sağdan sola"><span class="rtl-t">العربية</span></button>
    <button class="c s" id="zinB" title="Yakınlaştır">+</button>
    <button class="c s" id="zoutB" title="Uzaklaştır">−</button>
  </div>
</div>

<script>
/* pdf/ klasöründeki kitaplar — A.pdf boş olduğu için listede yok */
/* pdf/ klasöründeki kitaplar — her açılışta GitHub API'den otomatik listelenir */
const FALLBACK_BOOKS=[
  {f:"pdf/Ashabı Bedr ve Şühedayı Uhud.pdf", i:"🕌"},
  {f:"pdf/Bir Kırık Dilekçe Ar.pdf", i:"🤲"},
  {f:"pdf/Bir Kırık Dilekçe Tr.pdf", i:"🤲"},
  {f:"pdf/Büyük Cevşen.pdf", i:"📿"},
  {f:"pdf/Celcelutiye.pdf", i:"🕋"},
  {f:"pdf/Cevşen.pdf", i:"📿"},
  {f:"pdf/Dalail ul khairat_text.pdf", i:"🌸"},
  {f:"pdf/Dua Mecmuasi Mealli.pdf", i:"🕋"},
  {f:"pdf/Kuran-ı Kerim.pdf", i:"📗"},
  {f:"pdf/Tevhidname Mealli.pdf", i:"📔"},
];
const classify=nm=>{nm=(nm||'').toLowerCase();
  if(nm.includes('kuran'))return '📗';
  if(nm.includes('cevşen'))return '📿';
  if(/cevşen|celcel/.test(nm))return '🕋';
  if(nm.includes('bedr')||nm.includes('şüheda'))return '🕌';
  if(/dalail/.test(nm))return '🌸';
  if(/dua/.test(nm))return '🕋';
  if(nm.includes('dilekçe'))return '🤲';
  if(nm.includes('tevhid'))return '📔';
  return '📖';};
let BOOKS=FALLBACK_BOOKS.slice();
const bname=f=>f.split('/').pop().replace(/\.pdf$/i,'');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
const $=id=>document.getElementById(id);
let pdf=null,total=0,cur=1,spread=true,zoom=1,anim=false,cache={};
let rtl=false;

/* --- tema --- */
let theme=localStorage.getItem('flipTheme')||'light';
const applyT=t=>{document.documentElement.dataset.theme=t;$('themeB').textContent=t==='light'?'🌙':'☀️';};
applyT(theme);
const setT=()=>{theme=theme==='light'?'dark':'light';applyT(theme);localStorage.setItem('flipTheme',theme);};

/* --- ses: GitHub Sound klasöründeki page-flip.mp3 --- */
let snd=null,muted=(localStorage.getItem('flipSnd')==='0');
try{snd=new Audio('sound/page-flip.mp3');snd.preload='auto';}catch(e){}
function setMute(m){muted=!!m;localStorage.setItem('flipSnd',muted?'0':'1');paintSnd();}
function paintSnd(){const g=muted?'🔇':'🔊';const a=$('sndB'),b2=$('sndB2');if(a)a.textContent=g;if(b2)b2.textContent=g;}
paintSnd();
function playSound(){if(muted||!snd)return;
  try{snd.pause();snd.currentTime=0;const pr=snd.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}}

/* --- pdf render --- */
function pg(n){if(n<1||n>total)return Promise.reject('range');
  if(cache[n])return Promise.resolve(cache[n]);
  return pdf.getPage(n).then(p=>{const vp=p.getViewport({scale:1.7});const c=document.createElement('canvas');
    c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    return p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(()=>(cache[n]=c));});}
function addPageImg(el,n){if(n<1||n>total)return;
  pg(n).then(c=>{if(!el.isConnected)return;const im=document.createElement('img');
    im.src=c.toDataURL('image/jpeg',.9);el.appendChild(im);}).catch(()=>{});}

/* --- boyut --- */
let pw=1,ph=1;
function baseP(){return pdf.getPage(1).then(p=>{const vp=p.getViewport({scale:1});pw=vp.width;ph=vp.height;});}
let lw=0,lh=0,gap=0;
function layout(){const w=$('stageWrap');const aw=w.clientWidth-20,ah=w.clientHeight-16;
  const ratio=ph/pw,per=spread?2:1;gap=spread?Math.max(6,Math.min(22,aw*.05)):0;
  let wd=(aw-gap)/per,ht=wd*ratio;if(ht>ah){ht=ah;wd=ht/ratio;}wd*=zoom;ht*=zoom;lw=wd;lh=ht;
  $('stage').style.width=((per*wd)+gap)+'px';$('stage').style.height=ht+'px';}
const clearB=()=>{const b=$('book');while(b.firstChild)b.removeChild(b.firstChild);};

/* --- görünen pencere (sayfa numaraları) --- */
function step(){return spread?2:1;}
function canFwd(){return cur+step()<=total;}
function canPrev(){return cur>1;}
function fwdTarget(){const t=cur+step();return t>total?total:t;}
function prevTarget(){return Math.max(1,cur-step());}
/* yayılmada hangi sayfa hangi tarafta:  LTR -> cur solda, cur+1 sağda ;
   RTL -> cur (öndeki) sağda, cur+1 solda (sağdan sola okuma) */
function sidePages(){
  if(!spread)return {l:0,r:cur,c:cur};
  if(rtl){const l=cur+1<=total?cur+1:0;return {l:l,r:cur,c:0};}
  const r=cur+1<=total?cur+1:0;return {l:cur,r:r,c:0};
}

/* statik sayfa elemanı */
function pageEl(n,isRight){const d=document.createElement('div');d.className='leaf';
  d.style.width=lw+'px';d.style.height=lh+'px';
  d.style.left=isRight?(lw+gap)+'px':'0px';
  if(n>=1&&n<=total){const m=document.createElement('div');m.className='pg';m.textContent=n;d.appendChild(m);}
  addPageImg(d,n);return d;}
function paint(){const b=$('book');clearB();const sp=sidePages();
  if(!spread){b.appendChild(pageEl(cur,false));}
  else{b.appendChild(pageEl(sp.l,false));if(sp.r>=1&&sp.r<=total)b.appendChild(pageEl(sp.r,true));}}

/* --- çevirme: üstte dönen tek sayfa; hedef pencere altta hazır --- */
function turnEl(n,isRight,origin,rotDeg){
  const t=document.createElement('div');t.className='turn';
  t.style.width=lw+'px';t.style.height=lh+'px';
  t.style.left=isRight?(lw+gap)+'px':'0px';
  if(n>=1&&n<=total){const m=document.createElement('div');m.className='pg';m.textContent=n;t.appendChild(m);}
  addPageImg(t,n);
  const mid=rotDeg*.55;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    t.style.transition='transform .16s cubic-bezier(.42,.1,.6,.95)';
    t.style.transformOrigin=origin;
    t.style.transform='perspective(1100px) rotateX('+(rotDeg>0?-8:8)+'deg) rotateY('+mid+'deg) skewY('+(rotDeg>0?-2.5:2.5)+'deg)';
    t.classList.add('curl');
    requestAnimationFrame(()=>{
      t.style.transition='transform .3s cubic-bezier(.34,.05,.4,1)';
      t.style.transform='perspective(1300px) rotateX(0deg) rotateY('+rotDeg+'deg) skewY(0deg)';
    });
  }));
  return t;}

function doFlip(fwd){
  return new Promise(done=>{
    const b=$('book');clearB();
    const tgt=fwd?fwdTarget():prevTarget();
    /* hedef pencereyi alta yerleştir (sadece geçici cur) */
    const save=cur;cur=tgt;
    const sp=sidePages();
    if(!spread){b.appendChild(pageEl(sp.c,false));}
    else{b.appendChild(pageEl(sp.l,false));if(sp.r>=1&&sp.r<=total)b.appendChild(pageEl(sp.r,true));}
    cur=save;
    /* dönen sayfa */
    if(spread){
      if(fwd){
        if(rtl) b.appendChild(turnEl(cur,'R','right center',150));   // RTL: sağ sayfa sağ kenarından döner
        else    b.appendChild(turnEl(cur+1,'R','left center',-150));
      }else{
        if(rtl) b.appendChild(turnEl(cur,'L','left center',-150));
        else    b.appendChild(turnEl(cur,'L','right center',150));
      }
    }else{
      if(fwd) b.appendChild(turnEl(cur,false, rtl?'right center':'left center', rtl?150:-150));
      else    b.appendChild(turnEl(cur,false, rtl?'left center':'right center', rtl?-150:150));
    }
    setTimeout(done,460);
  });
}

/* --- kontroller --- */
function updateUI(){$('pageIn').value=cur;$('tot').textContent=total;
  $('viewB').textContent=spread?'Çift':'Tek';
  $('viewB').classList.toggle('on',spread);
  $('rtlB').innerHTML=rtl?'<span class="rtl-t">العربية</span>':'<span class="rtl-x">✕</span><span class="rtl-t">العربية</span>';
  $('rtlB').classList.toggle('on',rtl);
  const sp=sidePages();const ps=$('rtitle').querySelector('.ps');
  if(spread){ps.textContent=(rtl?'RTL · ':'')+'Sayfa '+cur+'–'+(cur+1<=total?cur+1:cur)+' / '+total;}
  else ps.textContent=(rtl?'RTL · ':'')+'Sayfa '+cur+' / '+total;
  buildStrip();}
async function nav(fwd){if(anim||!pdf)return;
  const ok=fwd?canFwd():canPrev();if(!ok)return;
  anim=true;playSound();try{await doFlip(fwd);}catch(e){}cur=fwd?fwdTarget():prevTarget();paint();anim=false;updateUI();}
const next=()=>nav(true),prev=()=>nav(false);
function first(){if(anim)return;cur=1;paint();updateUI();}
function last(){if(anim)return;
  cur = spread ? (total%2===1? total : Math.max(1,total-1)) : total;
  paint();updateUI();}
function setZoom(d){zoom=Math.max(.45,Math.min(2.5,zoom+d));if(pdf){layout();paint();}}
function toggleView(){if(anim||!pdf)return;spread=!spread;cur=Math.min(cur,total);layout();paint();updateUI();}
function toggleRtl(){if(anim||!pdf)return;rtl=!rtl;paint();updateUI();}

/* --- şerit --- */
function buildStrip(){const st=$('strip');st.innerHTML='';
  const s=step();
  for(let i=1;i<=total;i+=s){const th=document.createElement('div');
    th.className='th'+(i===cur?' on':'');th.title='Sayfa '+i;
    th.onclick=()=>{if(!anim&&i!==cur){cur=i;paint();updateUI();}};
    addPageImg(th,i);st.appendChild(th);} }
const toggleStrip=()=>$('strip').classList.toggle('on');

/* --- ana sayfaya dön --- */
function goHome(){location.href='index.html';}

/* --- kitap aç --- */
async function openBook(k){const bk=BOOKS[k];
  $('load').classList.add('on');$('shelf').classList.add('hidden');
  pdf=null;cache={};total=0;cur=1;anim=false;rtl=false;try{
    pdf=await pdfjsLib.getDocument(bk.f).promise;total=pdf.numPages;await baseP();
    spread=total>1;
    $('rtitle').innerHTML=bk.i+' '+bname(bk.f)+'<span class="ps"></span>';
    $('reader').classList.add('on');layout();paint();updateUI();
  }catch(e){console.error(e);alert('PDF açılamadı: '+bname(bk.f));$('shelf').classList.remove('hidden');}
  finally{$('load').classList.remove('on');} }


/* pdf/ içeriğini GitHub API ile çek — sonradan eklenen eserler otomatik gelir */
function loadPdfList(){
  fetch('https://api.github.com/repos/mckurdi27/Wir-lesen-zusammen-/contents/pdf/')
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(js=>{
      if(!Array.isArray(js))return;
      const list=js.filter(x=>x.type==='file'&&/\.pdf$/i.test(x.name)&&!/^A\.pdf$/i.test(x.name))
        .map(x=>({f:'pdf/'+x.name,i:classify(x.name)}));
      if(list.length)BOOKS=list;
      buildShelf();
    })
    .catch(()=>buildShelf());
}

function buildShelf(){const g=$('grid');g.innerHTML='';
  BOOKS.forEach((bk,i)=>{const c=document.createElement('div');c.className='bk';
    const cv=document.createElement('div');cv.className='cv';cv.textContent=bk.i;
    const bn=document.createElement('div');bn.className='bn';bn.textContent=bname(bk.f);
    const bm=document.createElement('div');bm.className='bm';bm.textContent='…';
    c.appendChild(cv);c.appendChild(bn);c.appendChild(bm);c.onclick=()=>openBook(i);g.appendChild(c);
    pdfjsLib.getDocument(bk.f).promise.then(p=>{if(bm.isConnected)bm.textContent=p.numPages+' sayfa';})
      .catch(()=>{if(bm.isConnected)bm.textContent='—';});
  });}

$('nextB').onclick=next;$('prevB').onclick=prev;$('firstB').onclick=first;$('lastB').onclick=last;
$('backB').onclick=()=>{$('reader').classList.remove('on');$('shelf').classList.remove('hidden');};
$('homeB').onclick=goHome;$('homeB2').onclick=goHome;
$('sndB').onclick=()=>setMute(!muted);$('sndB2').onclick=()=>setMute(!muted);
$('themeB').onclick=setT;$('viewB').onclick=toggleView;$('rtlB').onclick=toggleRtl;
$('zinB').onclick=()=>setZoom(.2);$('zoutB').onclick=()=>setZoom(-.2);$('stripB').onclick=toggleStrip;
$('pageIn').addEventListener('change',()=>{let v=parseInt($('pageIn').value,10);if(!isNaN(v)&&!anim){
  cur=Math.max(1,Math.min(v,total));paint();updateUI();}});
$('pageIn').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
$('fullB').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();
  else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});};
window.addEventListener('resize',()=>{if(pdf&&!anim){layout();paint();}});
document.addEventListener('keydown',e=>{if(!$('reader').classList.contains('on'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')first();else if(e.key==='End')last();});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(!$('reader').classList.contains('on'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){
    /* RTL açıkken ileri gitmek soldan sağa kaydırmaktır (Arapça kitap sağdan okunur) */
    const fwd = rtl ? dx>0 : dx<0;
    fwd?next():prev();
  }},{passive:true});

loadPdfList();
</script>
</body>
