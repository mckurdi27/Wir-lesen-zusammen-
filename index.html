        <script>
        async function fetchPrayerTimes() {
            const city = document.getElementById('citySelect').value;
            const resultDiv = document.getElementById('prayerTimesResult');
            resultDiv.innerHTML = "Vakitler yükleniyor...";
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=&method=13`);
                const data = await response.json();
                if(data && data.data && data.data.timings) {
                    const t = data.data.timings;
                    resultDiv.innerHTML = `
                        İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}
                    `;
                } else {
                    resultDiv.innerHTML = "Vakitler alınamadı.";
                }
            } catch (error) {
                resultDiv.innerHTML = "Bağlantı hatası.";
            }
        }

        async function fetchPrayerTimesByGPS() {
            const resultDiv = document.getElementById('prayerTimesResult');
            if (!navigator.geolocation) {
                resultDiv.innerHTML = "Tarayıcınız konum desteklemiyor.";
                return;
            }
            resultDiv.innerHTML = "Konum alınıyor...";
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=13`);
                    const data = await response.json();
                    if(data && data.data && data.data.timings) {
                        const t = data.data.timings;
                        resultDiv.innerHTML = `
                            İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}
                        `;
                    } else {
                        resultDiv.innerHTML = "Konuma göre vakitler alınamadı.";
                    }
                } catch (error) {
                    resultDiv.innerHTML = "Bağlantı hatası.";
                }
            }, (error) => {
                resultDiv.innerHTML = "Konum izni reddedildi.";
            });
        }

        document.addEventListener("DOMContentLoaded", fetchPrayerTimes);
        </script>

            function bugunkuHicriTarihiAl() {
                const ayAdlari = {
                    "01": "Muharrem", "02": "Sefer", "03": "Rebiülevvel", "04": "Rebiülahir",
                    "05": "Cemaziyelevvel", "06": "Cemaziyelahir", "07": "Recep", "08": "Şaban",
                    "09": "Ramazan", "10": "Şevval", "11": "Zilkade", "12": "Zilhicce"
                };
                try {
                    const formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' });
                    const parts = formatter.formatToParts(new Date());
                    let gun = "1", ay = "3", yil = "1448";
                    for (const part of parts) {
                        if (part.type === 'day') gun = part.value;
                        if (part.type === 'month') ay = part.value;
                        if (part.type === 'year') yil = part.value.replace(/[^0-9]/g, '');
                    }
                    let ayKoduStr = String(ay).padStart(2, '0');
                    let ayAdi = ayAdlari[ayKoduStr] || "Rebiülevvel";
                    return { ayKodu: ayKoduStr, gunNumarasi: parseInt(gun, 10), fullStr: `${gun} ${ayAdi} ${yil}` };
                } catch (hata) {
                    return { ayKodu: "03", gunNumarasi: 1, fullStr: "1 Rebiülevvel 1448" };
                }
            }

            async function fetchHijriMonthData(ayKodu) {
                if (monthlyInspirationCache[ayKodu]) return monthlyInspirationCache[ayKodu];
                const fileMap = {
                    "01": "js/01-muharrem.js", "02": "js/02-sefer.js", "03": "js/03-rebiülevvel.js",
                    "04": "js/04-rebiülahir.js", "05": "js/05-cemaziyelevvel.js", "06": "js/06-cemaziyelahir.js",
                    "07": "js/07-recep.js", "08": "js/08-saban.js", "09": "js/09-ramazan.js",
                    "10": "js/10-sevval.js", "11": "js/11-zilkade.js", "12": "js/12-zilhicce.js"
                };
                let filePath = fileMap[ayKodu] || "js/03-rebiulevvel.js";
                try {
                    let mod = await import(`./${filePath}`);
                    let data = mod.default || mod.data || mod;
                    monthlyInspirationCache[ayKodu] = data;
                    return data;
                } catch (e) {
                    return null;
                }
            }

            async function getHijriInspiration() {
                const todayMiladiStr = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const hicriInfo = bugunkuHicriTarihiAl();
                let hDay = hicriInfo.gunNumarasi;
                let hMonth = hicriInfo.ayKodu;
                let todayHijriStr = hicriInfo.fullStr;
                let jsonData = await fetchHijriMonthData(hMonth);
                let item = null;
                if (jsonData) {
                    if (Array.isArray(jsonData)) {
                        item = jsonData[hDay - 1] || jsonData[hDay];
                    } else if (typeof jsonData === 'object') {
                        item = jsonData[hDay] || jsonData[String(hDay)] || jsonData[String(hDay).padStart(2, '0')] || jsonData[String(parseInt(hDay, 10))];
                    }
                }
                let verseText = "Bu güne ait ayet verisi bulunamadı.";
                let hadishText = "Bu güne ait hadis verisi bulunamadı.";
                let proverbText = "Bu güne ait atasözü verisi bulunamadı.";
                let quoteText = "Bu güne ait özlü söz verisi bulunamadı.";
                let germanQuote = "Verfügbar nicht.";
                let germanTrans = "Çeviri bulunamadı.";
                if (item) {
                    if (item.ayet) {
                        let meal = typeof item.ayet === 'object' ? (item.ayet.meal || item.ayet.text || "") : String(item.ayet);
                        let kaynak = typeof item.ayet === 'object' ? (item.ayet.kaynak || item.ayet.source || "") : "";
                        verseText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let h = item.hadis || item.hadish;
                    if (h) {
                        let meal = typeof h === 'object' ? (h.meal || h.text || "") : String(h);
                        let kaynak = typeof h === 'object' ? (h.kaynak || h.source || "") : "";
                        hadishText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let a = item.atasozu || item.atasözü;
                    if (a) {
                        let text = typeof a === 'object' ? (a.text || a.meal || "") : String(a);
                        let kaynak = typeof a === 'object' ? (a.kaynak || a.source || "") : "";
                        proverbText = kaynak ? `${text} (${kaynak})` : text;
                    }
                    let o = item.ozlu_soz || item.ozluSoz || item.soz;
                    if (o) {
                        let text = typeof o === 'object' ? (o.text || o.meal || "") : String(o);
                        let kaynak = typeof o === 'object' ? (o.kaynak || o.source || "") : "";
                        quoteText = kaynak ? `${text} (${kaynak})` : text;
                    }
                    if (item.german) {
                        germanQuote = item.german.quote || germanQuote;
                        germanTrans = item.german.translation || germanTrans;
                    }
                }
                return { fullDateStr: todayHijriStr, miladiDateStr: todayMiladiStr, verse: verseText, hadish: hadishText, proverb: proverbText, quote: quoteText, german: { quote: germanQuote, translation: germanTrans } };
            }

                { id: "ashabi_bedr", name: "6. Ashâb-ı Bedr ve Şühedâ-yı Uhud", totalUnits: 32, type: "page", defaultMode: "on_sayfa" },

                { id: "dilekce_ar", name: "10. Bir Kırık Dilekçe (Arapça)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" }
            ];

            const bookModesDefs = {};
            defaultBooksTemplate.forEach(b => {
                bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
            });

            function rebuildBookModesDefs() {
                if (appData && appData.books) {
                    appData.books.forEach(b => {
                        bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
                    });
                }
            }

            function getAllGroupKeys() {
                let keys = [];
                let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    if (key && key.startsWith("hatim_group_")) {
                        let gName = key.replace("hatim_group_", "");
                        let d = localStorage.getItem(key);
                        let isProtected = false;
                        if (d) {
                            try {
                                let parsed = JSON.parse(d);
                                if (parsed.password && parsed.password.trim() !== "") isProtected = true;
                            } catch(e){}
                        }
                        if (!isProtected || unlockedProtected.includes(gName) || gName === currentGroup) {
                            keys.push(gName);
                        }
                    }
                }
                if (keys.length === 0) keys.push("grup_1");
                else keys.sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
                return keys;
            }

            async function loadGroupData() {
                removeStuckPanel();
                const savedData = localStorage.getItem(`hatim_group_${currentGroup}`);
                appData = savedData ? JSON.parse(savedData) : { members: currentGroup === "grup_1" ? ["Ahmet", "Mehmet", "Ayşe"] : [], password: "" };

                if (appData.password && !isAdmin) {
                    let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                    if (!unlockedProtected.includes(currentGroup)) {
                        let enteredPwd = prompt(`"${currentGroup.replace(/_/g, ' ').toUpperCase()}" grubu şifrelidir. Lütfen şifreyi girin:`);
                        if (enteredPwd === appData.password) {
                            unlockedProtected.push(currentGroup);
                            localStorage.setItem("unlocked_protected_groups", JSON.stringify(unlockedProtected));
                        } else {
                            alert("Hatalı veya boş şifre!");
                            let allGroups = getAllGroupKeys();
                            let fallback = allGroups.find(g => {
                                let d = localStorage.getItem(`hatim_group_${g}`);
                                if (!d) return true;
                                let parsed = JSON.parse(d);
                                return !parsed.password;
                            }) || "grup_1";
                            currentGroup = fallback;
                            const savedDataFallback = localStorage.getItem(`hatim_group_${currentGroup}`);
                            appData = savedDataFallback ? JSON.parse(savedDataFallback) : { members: currentGroup === "grup_1" ? ["Ahmet", "Mehmet", "Ayşe"] : [], password: "" };
                        }
                    }
                }

                if (!appData.members) appData.members = [];
                if (appData.password === undefined) appData.password = "";
                if (!appData.readingLogs) appData.readingLogs = [];

                const savedSession = localStorage.getItem(`hatim_session_${currentGroup}`);
                loggedInMember = (savedSession && appData.members.includes(savedSession)) ? savedSession : "";

                if (!appData.bookPages) appData.bookPages = {};
                if (!appData.bookHatims) appData.bookHatims = {};
                if (!appData.bookHistory) appData.bookHistory = {};

                const todayStr = new Date().toLocaleDateString("tr-TR");
                defaultBooksTemplate.forEach(defBook => {
                    if (!appData.bookPages[defBook.id]) appData.bookPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    if (!appData.bookHatims[defBook.id]) appData.bookHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[defBook.id]) appData.bookHistory[defBook.id] = [];
                });

                if (!appData.books) {
                    appData.books = JSON.parse(JSON.stringify(defaultBooksTemplate));
                } else {
                    defaultBooksTemplate.forEach(defBook => {
                        let existing = appData.books.find(b => b.id === defBook.id);
                        if (!existing) appData.books.push(JSON.parse(JSON.stringify(defBook)));
                        else {
                            if (!existing.currentMode) existing.currentMode = defBook.defaultMode;
                            if (!existing.totalUnits) existing.totalUnits = defBook.totalUnits;
                        }
                    });
                }

                appData.books.forEach(b => {
                    if (!appData.bookPages[b.id]) {
                        appData.bookPages[b.id] = Array(b.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    } else if (appData.bookPages[b.id].length !== b.totalUnits) {
                        if (appData.bookPages[b.id].length < b.totalUnits) {
                            while (appData.bookPages[b.id].length < b.totalUnits) {
                                appData.bookPages[b.id].push({ owner: "", isRead: false });
                            }
                        } else {
                            appData.bookPages[b.id] = appData.bookPages[b.id].slice(0, b.totalUnits);
                        }
                    }
                    if (!appData.bookHatims[b.id]) appData.bookHatims[b.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[b.id]) appData.bookHistory[b.id] = [];
                });

                rebuildBookModesDefs();
                saveGroupData();
                await renderDailyInspiration();
                renderUserControls();
                renderBooks();
                renderAnalysisSection();
                renderAdminSectionAtBottom();
            }

            function saveGroupData() {
                localStorage.setItem(`hatim_group_${currentGroup}`, JSON.stringify(appData));
            }

                        if (!gInput) {
                            alert("Lütfen grup adını yazın.");
                            return;
                        }
                        let targetKey = `hatim_group_${gInput}`;
                        let targetDataRaw = localStorage.getItem(targetKey);
                        if (!targetDataRaw) {
                            alert("Bu isimde kayıtlı bir grup bulunamadı!");
                            return;
                        }
                        try {
                            let parsed = JSON.parse(targetDataRaw);
                            if (parsed.password && parsed.password === pInput) {
                                let unlocked = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                                if (!unlocked.includes(gInput)) {
                                    unlocked.push(gInput);

                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; margin-bottom: 4px; border-radius: 4px; font-size: 13px; border: 1px solid var(--border-color);">
                        <span>📖 <strong>${b.name}</strong> (${b.totalUnits} ${b.type === 'bab' ? 'Bab' : 'Sayfa'})</span>
                        <div style="display: flex; gap: 4px;">
                            <button class="admin-edit-book" data-id="${b.id}" style="background: #f39c12; color: #fff; border: none; padding: 3px 6px; border-radius: 3px; font-size: 11px; cursor: pointer;">Düzenle</button>
                            <button class="admin-remove-book" data-id="${b.id}" style="background: #e74c3c; color: #fff; border: none; padding: 3px 6px; border-radius: 3px; font-size: 11px; cursor: pointer;">Sil</button>
                        </div>
                    </div>
                `).join('');

                let adminPanelHtml = "";
                if (isAdmin) {
                    let hasPassword = appData.password ? true : false;
                    adminPanelHtml = `
                        <div id="admin-panel-section" style="background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold-primary); padding: 16px; border-radius: 8px; margin-bottom: 20px;">
                            <h3 style="color: var(--gold-dark); font-size: 15px; margin-bottom: 10px;">🛠️ Yönetici Kontrol Paneli</h3>
                            <div style="margin-bottom: 12px;">
                                <button id="admin-open-analysis-page" style="width: 100%; padding: 10px; background: #8e44ad; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">📊 Detaylı 5 Sekmeli Analiz ve Rapor Paneli</button>
                            </div>
                            
                            <!-- TOPLU ATAMA VE SİLME BÖLÜMÜ -->
                            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-bottom: 12px;">
                                <div style="font-weight: bold; font-size: 13px; margin-bottom: 8px;">📚 Kitaplarda Toplu Atama ve Silme Bölümü:</div>
                                <div style="display: flex; flex-direction: column; gap: 8px; background: var(--card-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                                    <div>
                                        <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">Eser Seçimi:</label>
                                        <select id="admin-bulk-book-select" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                                            ${appData.books.map(b => `<option value="${b.id}">${b.name} (${b.totalUnits} ${b.type === 'bab' ? 'Bab' : 'Sayfa'})</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">Grup / Kişi Seçimi (Hiyerarşik):</label>
                                        <select id="admin-bulk-target-select" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                                            <!-- JavaScript ile doldurulacak -->
                                        </select>
                                    </div>
                                    <div style="display: flex; gap: 8px; margin-top: 4px;">
                                        <button id="admin-bulk-assign-btn" style="flex: 1; padding: 8px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">📥 Toplu Atama Yap</button>
                                        <button id="admin-bulk-delete-btn" style="flex: 1; padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;">🗑️ Toplu Sil / Boşalt</button>
                                    </div>
                                </div>
                            </div>

                            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px;">
                                <label style="font-weight: bold; font-size: 13px;">Grup:</label>
                                <select id="admin-group-select" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); flex: 1;">${groupsHtml}</select>
                                <button id="admin-add-group" style="background: #27ae60; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">+ Ekle</button>
                                <button id="admin-edit-group" style="background: #f39c12; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Düzenle</button>
                                <button id="admin-delete-group" style="background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Sil</button>
                            </div>
                            <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--card-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);">
                                <span style="font-size: 13px; font-weight: bold;">Grup Şifre Durumu: <span style="color: ${hasPassword ? '#27ae60' : '#e67e22'};">${hasPassword ? '🔒 Şifreli' : '🔓 Şifresiz'}</span></span>
                                <button id="admin-set-password" style="background: #8e44ad; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">🔑 Şifre Belirle / Kaldır</button>
                            </div>
                            
                            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-bottom: 12px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <span style="font-weight: bold; font-size: 13px;">📚 Eserler ve Sayfa/Birim Yönetimi:</span>
                                    <button id="admin-add-book-btn" style="background: #27ae60; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">+ Yeni Eser Ekle</button>
                                </div>
                                <div style="max-height: 140px; overflow-y: auto; border: 1px solid var(--border-color); padding: 5px; border-radius: 4px; background: var(--card-bg);">
                                    ${booksEditHtml}
                                </div>
                            </div>

                            <div style="border-top: 1px solid var(--border-color); padding-top: 10px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <span style="font-weight: bold; font-size: 13px;">Gruptaki Üyeler:</span>
                                    <button id="admin-add-member" style="background: #2980b9; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;">+ Üye Ekle</button>
                                </div>
                                <div style="max-height: 120px; overflow-y: auto; border: 1px solid var(--border-color); padding: 5px; border-radius: 4px;">
                                    ${appData.members.length > 0 ? membersHtml : '<div style="font-size: 12px; text-align: center; padding: 5px;">Kayıtlı üye yok.</div>'}
                                </div>
                            </div>
                        </div>
                    `;
                }

                bottomContainer.innerHTML = `
                    ${adminPanelHtml}
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
                        <h3 style="font-size: 15px; margin: 0;">📢 Yöneticiye Mesaj Gönder</h3>
                        <button id="admin-toggle-btn-custom" style="padding: 6px 12px; background: ${isAdmin ? '#c0392b' : '#f39c12'}; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">${isAdmin ? '🔓 Yönetici Modu: AÇIK' : '🔐 Yönetici Modu: Kapalı'}</button>
                    </div>
                    <textarea id="admin-msg-input" placeholder="Mesajınızı buraya yazın..." style="width: 100%; height: 60px; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); border-radius: 4px; margin-bottom: 10px;"></textarea>
                    <button id="send-admin-msg-btn" style="background: #25D366; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">💬 WhatsApp ile Gönder</button>
                `;

                if (isAdmin) {
                    let targetSelect = bottomContainer.querySelector("#admin-bulk-target-select");
                    if (targetSelect) {
                        let allGroupKeys = getAllGroupKeys();
                        let optionsHtml = '<option value="">-- Grup veya Kişi Seçin --</option>';
                        allGroupKeys.forEach(gKey => {
                            let dRaw = localStorage.getItem(`hatim_group_${gKey}`);
                            let gNameFormatted = gKey.replace(/_/g, ' ').toUpperCase();
                            if (dRaw) {
                                try {
                                    let parsed = JSON.parse(dRaw);
                                    if (parsed.members && parsed.members.length > 0) {
                                        optionsHtml += `<optgroup label="📁 ${gNameFormatted} Grubu">`;
                                        optionsHtml += `<option value="group:${gKey}">[Grup Tamamı - Üyelere Dağıt] ${gNameFormatted}</option>`;
                                        parsed.members.forEach(m => {
                                            optionsHtml += `<option value="member:${gKey}:${m}">👤 ${m} (${gNameFormatted})</option>`;
                                        });
                                        optionsHtml += `</optgroup>`;
                                    } else {
                                        optionsHtml += `<optgroup label="📁 ${gNameFormatted} Grubu (Üye Yok)">`;
                                        optionsHtml += `<option value="group:${gKey}">[Grup Tamamı] ${gNameFormatted}</option>`;
                                        optionsHtml += `</optgroup>`;
                                    }
                                } catch(e){}
                            }
                        });
                        targetSelect.innerHTML = optionsHtml;
                    }

                    const bulkAssignBtn = bottomContainer.querySelector("#admin-bulk-assign-btn");
                    if (bulkAssignBtn) {
                        bulkAssignBtn.addEventListener("click", () => {
                            let selectedBookId = bottomContainer.querySelector("#admin-bulk-book-select").value;
                            let selectedTarget = bottomContainer.querySelector("#admin-bulk-target-select").value;
                            if (!selectedTarget) {
                                alert("Lütfen atama yapılacak bir grup veya kişi seçin.");
                                return;
                            }

                            let [type, gKey, mName] = selectedTarget.split(":");
                            let targetDataRaw = localStorage.getItem(`hatim_group_${gKey}`);
                            if (!targetDataRaw) {
                                alert("Grup verisi bulunamadı.");
                                return;
                            }
                            let targetGroupData = JSON.parse(targetDataRaw);
                            if (!targetGroupData.bookPages[selectedBookId]) {
                                alert("Seçilen esere ait sayfa/birim verisi bulunamadı.");
                                return;
                            }

                            if (type === "member") {
                                targetGroupData.bookPages[selectedBookId].forEach(p => {
                                    if (!p.owner) {
                                        p.owner = mName;
                                    }
                                });
                                localStorage.setItem(`hatim_group_${gKey}`, JSON.stringify(targetGroupData));
                                alert(`"${selectedBookId}" eserinin boş birimleri sırayla "${mName}" adlı üyeye atandı.`);
                            } else if (type === "group") {
                                let members = targetGroupData.members;
                                if (!members || members.length === 0) {
                                    alert("Bu grupta kayıtlı üye bulunmuyor!");
                                    return;
                                }
                                let idx = 0;
                                targetGroupData.bookPages[selectedBookId].forEach(p => {
                                    if (!p.owner) {
                                        p.owner = members[idx % members.length];
                                        idx++;
                                    }
                                });
                                localStorage.setItem(`hatim_group_${gKey}`, JSON.stringify(targetGroupData));
                                alert(`"${selectedBookId}" eserinin boş birimleri "${gKey.toUpperCase()}" grubundaki üyeler arasında paylaştırıldı.`);
                            }
                            loadGroupData();
                        });
                    }

                    const bulkDeleteBtn = bottomContainer.querySelector("#admin-bulk-delete-btn");
                    if (bulkDeleteBtn) {
                        bulkDeleteBtn.addEventListener("click", () => {
                            let selectedBookId = bottomContainer.querySelector("#admin-bulk-book-select").value;
                            let selectedTarget = bottomContainer.querySelector("#admin-bulk-target-select").value;
                            if (!selectedTarget) {
                                alert("Lütfen işlem yapılacak grup veya kişiyi seçin.");
                                return;
                            }

                            let [type, gKey, mName] = selectedTarget.split(":");
                            let targetDataRaw = localStorage.getItem(`hatim_group_${gKey}`);
                            if (!targetDataRaw) return;
                            let targetGroupData = JSON.parse(targetDataRaw);

                            if (confirm(`Seçilen eserdeki hisseleri silmek/boşaltmak istediğinize emin misiniz?`)) {
                                if (type === "member") {
                                    targetGroupData.bookPages[selectedBookId].forEach(p => {
                                        if (p.owner === mName) {
                                            p.owner = "";
                                            p.isRead = false;
                                        }
                                    });
                                } else if (type === "group") {
                                    targetGroupData.bookPages[selectedBookId].forEach(p => {
                                        p.owner = "";
                                        p.isRead = false;
                                    });
                                }
                                localStorage.setItem(`hatim_group_${gKey}`, JSON.stringify(targetGroupData));
                                alert("Toplu silme/boşaltma işlemi başarıyla tamamlandı.");
                                loadGroupData();
                            }
                        });
                    }
                }

                document.getElementById("admin-toggle-btn-custom").addEventListener("click", () => triggerAdminToggle());

                if (isAdmin) {
                    const analysisBtn = document.getElementById("admin-open-analysis-page");
                    if (analysisBtn) {
                        analysisBtn.addEventListener("click", () => {
                            openDetailedAnalysisModal();
                        });
                    }

                    const addBookBtn = document.getElementById("admin-add-book-btn");
                    if (addBookBtn) {
                        addBookBtn.addEventListener("click", () => {
                            let bName = prompt("Eser adını girin:");
                            if (!bName || !bName.trim()) return;
        
                            let bUnitsStr = prompt("Toplam sayfa/birim sayısını girin (Örn: 100):", "100");
                            let bUnits = parseInt(bUnitsStr, 10);
                            if (isNaN(bUnits) || bUnits <= 0) {
                                alert("Geçersiz birim sayısı!");
                                return;
                            }
        
                            let bTypeInput = prompt("Birim türü nedir? ('sayfa' veya 'bab' yazın)", "sayfa");
                            let bType = (bTypeInput && bTypeInput.trim().toLowerCase() === "bab") ? "bab" : "page";
        
                            let bPdf = prompt("PDF dosya yolunu veya linkini girin (Boş bırakabilirsiniz):", "") || "";
                            let bId = "book_" + Date.now();

                            appData.books.push({
                                id: bId,
                                name: bName.trim(),
                                totalUnits: bUnits,
                                type: bType,
                                defaultMode: bType === "bab" ? "on_bab" : "yirmi_sayfa",
                                currentMode: bType === "bab" ? "on_bab" : "yirmi_sayfa",
                                pdf: bPdf.trim()
                            });

                            appData.bookPages[bId] = Array(bUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                            appData.bookHatims[bId] = { hatimNo: 1, startDate: new Date().toLocaleDateString("tr-TR"), prayerDone: false };
                            appData.bookHistory[bId] = [];

                            saveGroupData();
                            loadGroupData();
                        });
                    }
                    
                    document.querySelectorAll(".admin-edit-book").forEach(btn => {
                        btn.addEventListener("click", (e) => {
                            let bId = e.target.getAttribute("data-id");
                            let bookObj = appData.books.find(b => b.id === bId);
                            if (!bookObj) return;

                            let newName = prompt("Eserin yeni adı:", bookObj.name);
                            if (newName === null) return;
                            let newUnitsStr = prompt("Toplam birim/sayfa sayısı:", bookObj.totalUnits);
                            if (newUnitsStr === null) return;
                            let newUnits = parseInt(newUnitsStr, 10);

                            if (newName.trim()) bookObj.name = newName.trim();
                            if (!isNaN(newUnits) && newUnits > 0) {
                                bookObj.totalUnits = newUnits;
                                if (!appData.bookPages[bId]) {
                                    appData.bookPages[bId] = Array(newUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                                } else if (appData.bookPages[bId].length < newUnits) {
                                    while (appData.bookPages[bId].length < newUnits) {
                                        appData.bookPages[bId].push({ owner: "", isRead: false });
                                    }
                                } else {
                                    appData.bookPages[bId] = appData.bookPages[bId].slice(0, newUnits);
                                }
                            }

                            saveGroupData();
                            loadGroupData();
                        });
                    });

                    document.querySelectorAll(".admin-remove-book").forEach(btn => {
                        btn.addEventListener("click", (e) => {
                            let bId = e.target.getAttribute("data-id");
                            let bookObj = appData.books.find(b => b.id === bId);
                            if (!bookObj) return;

                            if (confirm(`"${bookObj.name}" eserini silmek istiyor musunuz?`)) {
                                appData.books = appData.books.filter(b => b.id !== bId);
                                delete appData.bookPages[bId];
                                delete appData.bookHatims[bId];
                                delete appData.bookHistory[bId];
                                saveGroupData();
                                loadGroupData();
                            }
                        });
                    });

                    document.getElementById("admin-group-select").addEventListener("change", async (e) => {
                        currentGroup = e.target.value;
                        await loadGroupData();
                    });

                    document.getElementById("admin-add-group").addEventListener("click", async () => {
                        let newG = prompt("Yeni grup adı:");
                        if (newG && newG.trim()) {
                            let groupKey = newG.trim().toLowerCase().replace(/\s+/g, '_');
                            let groupPwd = prompt("Bu gruba şifre koymak ister misiniz?:") || "";
                            currentGroup = groupKey;
                            const todayStr = new Date().toLocaleDateString("tr-TR");
                            let freshBooks = JSON.parse(JSON.stringify(defaultBooksTemplate));
                            let freshPages = {};
                            let freshHatims = {};
                            let freshHistory = {};
                            freshBooks.forEach(defBook => {
                                freshPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                                freshHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                                freshHistory[defBook.id] = [];
                            });
                            appData = {
                                members: [],
                                password: groupPwd.trim(),
                                books: freshBooks,
                                bookPages: freshPages,
                                bookHatims: freshHatims,
                                bookHistory: freshHistory,
                                readingLogs: []
                            };
                            saveGroupData();
                            await loadGroupData();
                        }
                    });

                    document.getElementById("admin-edit-group").addEventListener("click", async () => {
                        let newName = prompt("Grubun yeni adı:", currentGroup.replace(/_/g, ' '));
                        if (newName && newName.trim()) {
                            let newKey = newName.trim().toLowerCase().replace(/\s+/g, '_');
                            if (newKey !== currentGroup) {
                                localStorage.setItem(`hatim_group_${newKey}`, JSON.stringify(appData));
                                localStorage.removeItem(`hatim_group_${currentGroup}`);
                                currentGroup = newKey;
                                await loadGroupData();
                            }
                        }
                    });

                    document.getElementById("admin-delete-group").addEventListener("click", async () => {
                        if (confirm(`"${currentGroup}" grubunu silmek istiyor musunuz?`)) {
                            localStorage.removeItem(`hatim_group_${currentGroup}`);
                            let keys = getAllGroupKeys();
                            currentGroup = keys[0];
                            await loadGroupData();
                        }
                    });

                    const setPwdBtn = document.getElementById("admin-set-password");
                    if (setPwdBtn) {
                        setPwdBtn.addEventListener("click", () => {
                            let currentPwd = appData.password || "";
                            let newPwd = prompt("Gruba yeni şifre belirleyin (Kaldırmak için boş bırakın):", currentPwd);
                            if (newPwd !== null) {
                                appData.password = newPwd.trim();
                                saveGroupData();
                                if (appData.password) {
                                    alert("Grup şifresi başarıyla tanımlandı.");
                                } else {
                                    alert("Grup şifresi kaldırıldı.");
                                }
                                loadGroupData();
                            }
                        });
                    }

                    document.getElementById("admin-add-member").addEventListener("click", async () => {
                        let mName = prompt("Eklenecek üye adı:");
                        if (mName && mName.trim()) {
                            let clean = mName.trim();
                            if (!appData.members.includes(clean)) {
                                appData.members.push(clean);
                                saveGroupData();
                                await loadGroupData();
                            }
                        }
                    });

                    document.querySelectorAll(".admin-remove-member").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            let nameToRemove = e.target.getAttribute("data-name");
                            if (confirm(`"${nameToRemove}" adlı üyeyi çıkartmak istiyor musunuz?`)) {
                                appData.members = appData.members.filter(m => m !== nameToRemove);
                                saveGroupData();
                                await loadGroupData();
                            }
                        });
                    });

                    document.querySelectorAll(".admin-edit-member").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            let oldName = e.target.getAttribute("data-name");
                            let editedName = prompt("Yeni ad:", oldName);
                            if (editedName && editedName.trim() && editedName.trim() !== oldName) {
                                let cleanNew = editedName.trim();
                                let idx = appData.members.indexOf(oldName);
                                if (idx !== -1) {
                                    appData.members[idx] = cleanNew;
                                    Object.keys(appData.bookPages).forEach(bId => {
                                        appData.bookPages[bId].forEach(p => {
                                            if (p.owner === oldName) p.owner = cleanNew;
                                        });
                                    });
                                    if (appData.readingLogs) {
                                        appData.readingLogs.forEach(l => {
                                            if (l.member === oldName) l.member = cleanNew;
                                        });
                                    }
                                    saveGroupData();
                                    await loadGroupData();
                                }
                            }
                        });
                    });
                }

                document.getElementById("send-admin-msg-btn").addEventListener("click", () => {
                    let text = document.getElementById("admin-msg-input").value.trim();
                    if (!text) return;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
                });
            }

            async function triggerAdminToggle() {
                if (isAdmin) {
                    isAdmin = false;
                } else {
                    const enteredPassword = prompt("Yönetici şifresi:");
                    if (enteredPassword === ADMIN_PASSWORD) {
                        isAdmin = true;
                    } else {
                        alert("Hatalı yönetici şifresi!");
                    }
                }
                renderBooks();
                renderAdminSectionAtBottom();
            }
        </script>
    </body>
</html>
