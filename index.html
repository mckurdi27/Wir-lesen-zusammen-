<html lang="tr">
<head>
    <!-- ================================================================= -->
    <!-- HEAD BÖLÜMÜ VE META AYARLARI -->

    <!-- ================================================================= -->

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            
            /* ========================================================= */
            /* DOM ELEMANLARINI KONTROL ET VE OLUŞTUR                      */
            /* ========================================================= */
            let container = document.querySelector(".container");
            if (!container) {
                container = document.createElement("div");
                container.className = "container";
                document.body.appendChild(container);
            }

            let booksGrid = document.getElementById("books-grid");
            if (!booksGrid) {
                booksGrid = document.createElement("div");
                booksGrid.id = "books-grid";
                container.appendChild(booksGrid);
            }

            /* ========================================================= */
            /* ESKİ VEYA HATALI PANELLERİ TEMİZLEME FONKSİYONU             */
            /* ========================================================= */
            function removeStuckPanel() {
                document.querySelectorAll('div').forEach(div => {
                    if (div && div.textContent && div.textContent.includes("Ortak Hatim ve Dua Takip Sistemi") && !div.id.includes("main-title-ornate-section") && (div.querySelector('select') || div.innerHTML.includes("Yönetici Modu"))) {
                        div.remove();
                    }
                });
            }
            removeStuckPanel();
            setTimeout(removeStuckPanel, 100);

            /* ========================================================= */
            /* ORYANTAL MOTİFLER VE GENEL STİLLERİN ENJEKTE EDİLMESİ      */
            /* ========================================================= */
            function injectOrientalStyles() {
                if (document.getElementById("oriental-motif-styles")) return;
                const styleEl = document.createElement("style");
                styleEl.id = "oriental-motif-styles";
                styleEl.innerHTML = `
                    :root {
                        --bg-primary: #fdfbf7;
                        --card-bg: #ffffff;
                        --gold-primary: #d4af37;
                        --gold-dark: #8a6d3b;
                        --text-main: #3e2723;
                        --border-color: #e3dcd2;
                    }
                    body {
                        background-color: var(--bg-primary);
                        color: var(--text-main);
                        font-family: 'Georgia', serif;
                        margin: 0;
                        padding: 10px;
                    }
                    .container {
                        max-width: 800px;
                        margin: 0 auto;
                    }
                    @media (prefers-color-scheme: dark) {
                        :root {
                            --bg-primary: #0b1329;
                            --card-bg: #131b31;
                            --gold-primary: #f6e05e;
                            --gold-dark: #d4af37;
                            --text-main: #f1f5f9;
                            --border-color: #22304a;
                        }
                        body {
                            background-color: #0b1329 !important;
                            color: #f1f5f9 !important;
                        }
                    }
                    .book-card {
                        border: 2px solid var(--gold-primary) !important;
                        border-radius: 12px !important;
                        overflow: hidden;
                        margin-bottom: 15px;
                        background: var(--card-bg);
                    }
                    .book-header {
                        border-bottom: 2px solid var(--gold-primary);
                        background: linear-gradient(to right, rgba(212,175,55,0.1), transparent);
                    }

                document.head.appendChild(styleEl);
            }
            injectOrientalStyles();

            /* ========================================================= */
            /* GLOBAL UYGULAMA DEĞİŞKENLERİ VE YAPILANDIRMA              */
            /* ========================================================= */
            let currentGroup = "grup_1";
            let isAdmin = false;
            let appData = null;
            let loggedInMember = "";
            let monthlyInspirationCache = {};
            const ADMIN_PASSWORD = "1234";

            /* ========================================================= */
            /* ESERLER İÇİN PDF DOSYA YOLLARI EŞLEŞTİRMESİ               */

            const bookPdfMap = {

                "celcelutiye": "pdf/Celcelutiye.pdf",

                "ashabi_bedr": "pdf/Ashabı Bedr ve Şühedayı Uhud.pdf",
                "dalail": "pdf/Dalail ul khairat_text.pdf",
                "dua_mecmuasi": "pdf/Dua Mecmuasi Mealli.pdf",
                "dilekce_tr": "pdf/Bir Kırık Dilekçe Tr.pdf",
                "dilekce_ar": "pdf/Bir Kırık Dilekçe Ar.pdf"
            };

            /* ========================================================= */
            /* GÖMÜLÜ PDF OKUYUCU MODÜLÜ                                  */
            /* ========================================================= */
            function openEmbeddedPdfReader(pdfUrl, bookTitle) {
                let existingModal = document.getElementById("embedded-pdf-modal");

                modal.id = "embedded-pdf-modal";

                    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
                `;
                modal.innerHTML = `
                    <div style="width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px 15px; border-radius: 8px 8px 0 0; color: #fff;">
                        <span style="font-weight: bold; font-size: 14px;">📄 ${bookTitle} (Gömülü Okuyucu)</span>
                        <button id="close-pdf-modal" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">✕ Kapat</button>
                    </div>
                    <div style="width: 100%; max-width: 900px; height: 80vh; background: #fff; border-radius: 0 0 8px 8px; overflow: hidden;">
                        <iframe src="${pdfUrl}" style="width: 100%; height: 100%; border: none;"></iframe>
                    </div>
                `;
                document.body.appendChild(modal);

                modal.querySelector("#close-pdf-modal").addEventListener("click", () => modal.remove());
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) modal.remove();
                });
            }

                        <div style="width: 100%; height: 110px; background: linear-gradient(135deg, #111, #2c3e50); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #f1c40f; font-size: 12px; font-style: italic; border: 1px solid var(--gold-primary);">
                            <div style="text-align: center; padding: 10px;">
                                <span style="font-size: 28px; display: block; margin-bottom: 4px;">🕌</span>
                                <span>"Kalpler ancak Zikrullah ile mutmain olur."</span>
                            </div>
                        </div>
                    </div>

                    <!-- Namaz Vakitleri ve Şehir Ayar Paneli -->
                    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-size: 13px; font-weight: bold; color: var(--gold-dark);">⏰ Namaz Vakitleri (${savedCity})</span>
                                <button id="change-city-btn" style="background: #2980b9; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">Şehir Seç</button>
                            </div>
                            <div id="prayer-times-list" style="font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; opacity: 0.9;">
                                <div>İmsak: Yükleniyor...</div>
                                <div>Güneş: Yükleniyor...</div>
                                <div>Öğle: Yükleniyor...</div>
                                <div>İkindi: Yükleniyor...</div>
                                <div>Akşam: Yükleniyor...</div>
                                <div>Yatsı: Yükleniyor...</div>
                            </div>
                        </div>
                    </div>
                `;

                widgetContainer.querySelector("#change-city-btn").addEventListener("click", () => {
                    let newCity = prompt("Namaz vakitleri için şehir adı girin (Örn: Ankara, Bursa, Berlin):", savedCity);
                    if (newCity && newCity.trim()) {
                        localStorage.setItem("prayer_city", newCity.trim());
                        renderVisualAndPrayerWidget();

                });

                // Örnek vakit simülasyonu / API simülasyonu
                setTimeout(() => {
                    const timesEl = widgetContainer.querySelector("#prayer-times-list");
                    if (timesEl) {
                        timesEl.innerHTML = `
                            <div>İmsak: 04:32</div>
                            <div>Güneş: 06:01</div>
                            <div>Öğle: 13:12</div>
                            <div>İkindi: 16:55</div>
                            <div>Akşam: 20:10</div>
                            <div>Yatsı: 21:38</div>
                        `;
                    }

            }

            /* ========================================================= */
            /* BUGÜNKÜ HİCRİ TARİHİ HESAPLAMA FONKSİYONU                  */
            /* ========================================================= */
            function bugunkuHicriTarihiAl() {
                const ayAdlari = {
                    "01": "Muharrem", "02": "Sefer", "03": "Rebiülevvel", "04": "Rebiülahir",
                    "05": "Cemaziyelevvel", "06": "Cemaziyelahir", "07": "Recep", "08": "Şaban",
                    "09": "Ramazan", "10": "Şevval", "11": "Zilkade", "12": "Zilhicce"
                };
                try {
                    const formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' });
                    const parts = formatter.formatToParts(new Date());
                    let gun = "1", ay = "3", yil = "1448";
                    for (const part of parts) {
                        if (part.type === 'day') gun = part.value;
                        if (part.type === 'month') ay = part.value;
                        if (part.type === 'year') yil = part.value.replace(/[^0-9]/g, '');
                    }
                    let ayKoduStr = String(ay).padStart(2, '0');
                    let ayAdi = ayAdlari[ayKoduStr] || "Rebiülevvel";
                    return { ayKodu: ayKoduStr, gunNumarasi: parseInt(gun, 10), fullStr: `${gun} ${ayAdi} ${yil}` };
                } catch (hata) {
                    return { ayKodu: "03", gunNumarasi: 1, fullStr: "1 Rebiülevvel 1448" };
                }
            }

            /* ========================================================= */
            /* HİCRİ AY VERİLERİNİ ASENKRON OLARAK ÇEKME FONKSİYONU      */
            /* ========================================================= */
            async function fetchHijriMonthData(ayKodu) {
                if (monthlyInspirationCache[ayKodu]) return monthlyInspirationCache[ayKodu];
                const fileMap = {
                    "01": "js/01-muharrem.js", "02": "js/02-sefer.js", "03": "js/03-rebiülevvel.js",
                    "04": "js/04-rebiülahir.js", "05": "js/05-cemaziyelevvel.js", "06": "js/06-cemaziyelahir.js",
                    "07": "js/07-recep.js", "08": "js/08-saban.js", "09": "js/09-ramazan.js",
                    "10": "js/10-sevval.js", "11": "js/11-zilkade.js", "12": "js/12-zilhicce.js"
                };
                let filePath = fileMap[ayKodu] || "js/03-rebiulevvel.js";
                try {
                    let mod = await import(`./${filePath}`);
                    let data = mod.default || mod.data || mod;
                    monthlyInspirationCache[ayKodu] = data;
                    return data;
                } catch (e) {
                    return null;
                }
            }

            /* ========================================================= */
            /* MANEVİ VE DİL İLHAMI VERİLERİNİ HAZIRLAMA                 */
            /* ========================================================= */
            async function getHijriInspiration() {
                const todayMiladiStr = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const hicriInfo = bugunkuHicriTarihiAl();
                let hDay = hicriInfo.gunNumarasi;
                let hMonth = hicriInfo.ayKodu;
                let todayHijriStr = hicriInfo.fullStr;
                let jsonData = await fetchHijriMonthData(hMonth);
                let item = null;
                if (jsonData) {
                    if (Array.isArray(jsonData)) {
                        item = jsonData[hDay - 1] || jsonData[hDay];
                    } else if (typeof jsonData === 'object') {
                        item = jsonData[hDay] || jsonData[String(hDay)] || jsonData[String(hDay).padStart(2, '0')] || jsonData[String(parseInt(hDay, 10))];
                    }
                }
                let verseText = "Bu güne ait ayet verisi bulunamadı.";
                let hadishText = "Bu güne ait hadis verisi bulunamadı.";
                let proverbText = "Bu güne ait atasözü verisi bulunamadı.";
                let quoteText = "Bu güne ait özlü söz verisi bulunamadı.";
                let germanQuote = "Verfügbar nicht.";
                let germanTrans = "Çeviri bulunamadı.";
                if (item) {
                    if (item.ayet) {
                        let meal = typeof item.ayet === 'object' ? (item.ayet.meal || item.ayet.text || "") : String(item.ayet);
                        let kaynak = typeof item.ayet === 'object' ? (item.ayet.kaynak || item.ayet.source || "") : "";
                        verseText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let h = item.hadis || item.hadish;
                    if (h) {
                        let meal = typeof h === 'object' ? (h.meal || h.text || "") : String(h);
                        let kaynak = typeof h === 'object' ? (h.kaynak || h.source || "") : "";
                        hadishText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let a = item.atasozu || item.atasözü;
                    if (a) {
                        let text = typeof a === 'object' ? (a.text || a.meal || "") : String(a);
                        let kaynak = typeof a === 'object' ? (a.kaynak || a.source || "") : "";
                        proverbText = kaynak ? `${text} (${kaynak})` : text;
                    }
                    let o = item.ozlu_soz || item.ozluSoz || item.soz;
                    if (o) {
                        let text = typeof o === 'object' ? (o.text || o.meal || "") : String(o);
                        let kaynak = typeof o === 'object' ? (o.kaynak || o.source || "") : "";
                        quoteText = kaynak ? `${text} (${kaynak})` : text;
                    }
                    if (item.german) {
                        germanQuote = item.german.quote || germanQuote;
                        germanTrans = item.german.translation || germanTrans;
                    }
                }
                return { fullDateStr: todayHijriStr, miladiDateStr: todayMiladiStr, verse: verseText, hadish: hadishText, proverb: proverbText, quote: quoteText, german: { quote: germanQuote, translation: germanTrans } };
            }

            /* ========================================================= */
            /* ANA BAŞLIK BÖLÜMÜNÜ OLUŞTURMA VE RENDER ETME              */

            /* ========================================================= */
            /* GÜNLÜK İLHAM KÖŞESİNİ RENDER ETME FONKSİYONU              */
            /* ========================================================= */
            async function renderDailyInspiration() {
                const inspirationData = await getHijriInspiration();
                let inspirationContainer = document.getElementById("daily-inspiration-section");

                    inspirationContainer = document.createElement("div");

                    } else {
                        container.appendChild(inspirationContainer);
                    }
                }
                inspirationContainer.style.cssText = `

                    border: 1px solid #e3dcd2;
                    border-left: 4px solid #27ae60;
                    border-radius: 8px;
                    background: var(--card-bg);
                `;
                inspirationContainer.innerHTML = `
                    <div style="text-align: center; font-weight: bold; font-size: 14px; border-bottom: 1px dashed rgba(150,150,150,0.3); padding-bottom: 8px; margin-bottom: 10px;">
                        🌙 Manevi ve Dil İlhamı Köşesi
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                        <span style="font-size: 12px; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2);">📅 Miladi: ${inspirationData.miladiDateStr}</span>
                        <span style="font-size: 12px; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2);">🌙 Hicri: ${inspirationData.fullDateStr}</span>
                    </div>
                    <div style="font-size: 13px; line-height: 1.6;">
                        <p style="margin-bottom: 6px;">📖 <strong>Ayet:</strong> ${inspirationData.verse}</p>
                        <p style="margin-bottom: 6px;">📜 <strong>Hadis:</strong> ${inspirationData.hadish}</p>
                        <p style="margin-bottom: 6px;">💬 <strong>Atasözü:</strong> ${inspirationData.proverb}</p>
                        <p style="margin-bottom: 6px;">✨ <strong>Özlü Sözü:</strong> ${inspirationData.quote}</p>
                        <p style="margin-bottom: 2px;">🇩🇪 <strong>Tägliche Weisheit:</strong> <em>"${inspirationData.german.quote}"</em> <span style="opacity: 0.8;">(${inspirationData.german.translation})</span></p>
                    </div>
                `;
            }

            /* ========================================================= */
            /* SAYFA MODLARI OLUŞTURUCU                                  */
            /* ========================================================= */
            function createPageModes(totalPages) {
                return {
                    yirmi_sayfa: { name: "20 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 20); for (let i = 0; i < count; i++) { let start = i * 20, end = Math.min((i + 1) * 20, totalPages); items.push({ id: i + 1, name: `${i + 1}. Cüz / Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    on_sayfa: { name: "10 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 10); for (let i = 0; i < count; i++) { let start = i * 10, end = Math.min((i + 1) * 10, totalPages); items.push({ id: i + 1, name: `Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    bes_sayfa: { name: "5 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 5); for (let i = 0; i < count; i++) { let start = i * 5, end = Math.min((i + 1) * 5, totalPages); items.push({ id: i + 1, name: `Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    bir_sayfa: { name: "1 Sayfa", getItems: () => { let items = []; for (let i = 0; i < totalPages; i++) items.push({ id: i + 1, name: `${i + 1}. Sayfa`, start: i, end: i + 1 }); return items; }}
                };
            }

            /* ========================================================= */
            /* BAB MODLARI OLUŞTURUCU                                    */
            /* ========================================================= */
            function createBabModes(totalBabs) {
                return {
                    on_bab: { name: "10 Bab", getItems: () => { let items = [], count = Math.ceil(totalBabs / 10); for (let i = 0; i < count; i++) { let start = i * 10, end = Math.min((i + 1) * 10, totalBabs); items.push({ id: i + 1, name: `${start + 1}-${end}. Bablar`, start, end }); } return items; }},
                    bes_bab: { name: "5 Bab", getItems: () => { let items = [], count = Math.ceil(totalBabs / 5); for (let i = 0; i < count; i++) { let start = i * 5, end = Math.min((i + 1) * 5, totalBabs); items.push({ id: i + 1, name: `${start + 1}-${end}. Bablar`, start, end }); } return items; }},
                    bab: { name: "1 Bab", getItems: () => { let items = []; for (let i = 0; i < totalBabs; i++) items.push({ id: i + 1, name: `${i + 1}. Bab`, start: i, end: i + 1 }); return items; }}
                };
            }

            /* ========================================================= */

                { id: "cevsen", name: "2. Cevşen", totalUnits: 100, type: "bab", defaultMode: "on_bab" },
                { id: "tevhidname", name: "3. Tevhidnâme", totalUnits: 20, type: "bab", defaultMode: "on_bab" },
                { id: "celcelutiye", name: "4. Celcelûtiye", totalUnits: 30, type: "bab", defaultMode: "on_bab" },
                { id: "buyuk_cevsen", name: "5. Büyük Cevşen", totalUnits: 250, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "ashabi_bedr", name: "6. Ashâb-ı Bedr ve Şühedâ-yı Uhud", totalUnits: 32, type: "page", defaultMode: "on_sayfa" },
                { id: "dalail", name: "7. Delâilü'l-Hayrât", totalUnits: 160, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "dua_mecmuasi", name: "8. Dua Mecmuası Mealli", totalUnits: 200, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "dilekce_tr", name: "9. Bir Kırık Dilekçe (Türkçe)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" },
                { id: "dilekce_ar", name: "10. Bir Kırık Dilekçe (Arapça)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" }
            ];

            const bookModesDefs = {};
            defaultBooksTemplate.forEach(b => {
                bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
            });

            function rebuildBookModesDefs() {
                if (appData && appData.books) {
                    appData.books.forEach(b => {
                        bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
                    });
                }
            }

            /* ========================================================= */
            /* TÜM GRUP ANAHTARLARINI LİSTELEME                          */
            /* ========================================================= */
            function getAllGroupKeys() {
                let keys = [];
                let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    if (key && key.startsWith("hatim_group_")) {
                        let gName = key.replace("hatim_group_", "");
                        let d = localStorage.getItem(key);
                        let isProtected = false;
                        if (d) {
                            try {
                                let parsed = JSON.parse(d);
                                if (parsed.password && parsed.password.trim() !== "") isProtected = true;
                            } catch(e){}
                        }
                        if (!isProtected || unlockedProtected.includes(gName) || gName === currentGroup) {
                            keys.push(gName);
                        }
                    }
                }
                if (keys.length === 0) keys.push("grup_1");
                else keys.sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
                return keys;
            }

            /* ========================================================= */
            /* GRUP VERİLERİNİ YÜKLEME VE DOĞRULAMA                      */
            /* ========================================================= */
            async function loadGroupData() {
                removeStuckPanel();
                const savedData = localStorage.getItem(`hatim_group_${currentGroup}`);
                appData = savedData ? JSON.parse(savedData) : { members: currentGroup === "grup_1" ? ["Ahmet", "Mehmet", "Ayşe"] : [], password: "" };

                if (appData.password && !isAdmin) {
                    let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                    if (!unlockedProtected.includes(currentGroup)) {
                        let enteredPwd = prompt(`"${currentGroup.replace(/_/g, ' ').toUpperCase()}" grubu şifrelidir. Lütfen şifreyi girin:`);
                        if (enteredPwd === appData.password) {
                            unlockedProtected.push(currentGroup);
                            localStorage.setItem("unlocked_protected_groups", JSON.stringify(unlockedProtected));
                        } else {
                            alert("Hatalı veya boş şifre! Bu gruba erişilemiyor.");
                            let allGroups = getAllGroupKeys();
                            let fallback = allGroups.find(g => {
                                let d = localStorage.getItem(`hatim_group_${g}`);
                                if (!d) return true;
                                let parsed = JSON.parse(d);
                                return !parsed.password;
                            }) || "grup_1";
                            currentGroup = fallback;
                            const savedDataFallback = localStorage.getItem(`hatim_group_${currentGroup}`);
                            appData = savedDataFallback ? JSON.parse(savedDataFallback) : { members: currentGroup === "grup_1" ? ["Ahmet", "Mehmet", "Ayşe"] : [], password: "" };
                        }
                    }
                }

                if (!appData.members) appData.members = [];
                if (appData.password === undefined) appData.password = "";
                if (!appData.readingLogs) appData.readingLogs = [];

                const savedSession = localStorage.getItem(`hatim_session_${currentGroup}`);
                loggedInMember = (savedSession && appData.members.includes(savedSession)) ? savedSession : "";

                if (!appData.bookPages) appData.bookPages = {};
                if (!appData.bookHatims) appData.bookHatims = {};
                if (!appData.bookHistory) appData.bookHistory = {};

                const todayStr = new Date().toLocaleDateString("tr-TR");
                defaultBooksTemplate.forEach(defBook => {
                    if (!appData.bookPages[defBook.id]) appData.bookPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    if (!appData.bookHatims[defBook.id]) appData.bookHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[defBook.id]) appData.bookHistory[defBook.id] = [];
                });

                if (!appData.books) {
                    appData.books = JSON.parse(JSON.stringify(defaultBooksTemplate));
                } else {
                    defaultBooksTemplate.forEach(defBook => {
                        let existing = appData.books.find(b => b.id === defBook.id);
                        if (!existing) appData.books.push(JSON.parse(JSON.stringify(defBook)));
                        else {
                            if (!existing.currentMode) existing.currentMode = defBook.defaultMode;
                            if (!existing.totalUnits) existing.totalUnits = defBook.totalUnits;
                        }
                    });
                }

                appData.books.forEach(b => {
                    if (!appData.bookPages[b.id]) {
                        appData.bookPages[b.id] = Array(b.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    } else if (appData.bookPages[b.id].length !== b.totalUnits) {
                        if (appData.bookPages[b.id].length < b.totalUnits) {
                            while (appData.bookPages[b.id].length < b.totalUnits) {
                                appData.bookPages[b.id].push({ owner: "", isRead: false });
                            }
                        } else {
                            appData.bookPages[b.id] = appData.bookPages[b.id].slice(0, b.totalUnits);
                        }
                    }
                    if (!appData.bookHatims[b.id]) appData.bookHatims[b.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[b.id]) appData.bookHistory[b.id] = [];
                });

                rebuildBookModesDefs();
                saveGroupData();
                renderMainTitleHeader();
                renderVisualAndPrayerWidget();
                await renderDailyInspiration();
                renderUserControls();
                renderBooks();
                renderAnalysisSection();
                renderAdminSectionAtBottom();
            }

            function saveGroupData() {
                localStorage.setItem(`hatim_group_${currentGroup}`, JSON.stringify(appData));
            }

                    </div>
                `;

                document.getElementById("user-group-select").addEventListener("change", async (e) => {
                    currentGroup = e.target.value;
                    await loadGroupData();
                });

                const joinBtn = document.getElementById("join-locked-group-btn");
                if (joinBtn) {
                    joinBtn.addEventListener("click", async () => {
                        let gInput = document.getElementById("locked-group-name").value.trim().toLowerCase().replace(/\s+/g, '_');
                        let pInput = document.getElementById("locked-group-pwd").value;
                        if (!gInput) {
                            alert("Lütfen grup adını yazın.");
                            return;
                        }
                        let targetKey = `hatim_group_${gInput}`;
                        let targetDataRaw = localStorage.getItem(targetKey);
                        if (!targetDataRaw) {
                            alert("Bu isimde kayıtlı grup bulunamadı!");
                            return;
                        }
                        try {
                            let parsed = JSON.parse(targetDataRaw);
                            if (parsed.password && parsed.password === pInput) {
                                let unlocked = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                                if (!unlocked.includes(gInput)) {
                                    unlocked.push(gInput);
                                    localStorage.setItem("unlocked_protected_groups", JSON.stringify(unlocked));
                                }
                                currentGroup = gInput;
                                alert("Şifre doğru! Gruba giriş yapıldı.");
                                await loadGroupData();
                            } else {
                                alert("Hatalı şifre veya grup adı!");
                            }
                        } catch(e) {
                            alert("Grup verisi okunamadı.");
                        }
                    });
                }

                document.getElementById("user-new-group-btn").addEventListener("click", async () => {
                    let newG = prompt("Yeni grup adını girin:");
                    if (newG && newG.trim()) {
                        let groupKey = newG.trim().toLowerCase().replace(/\s+/g, '_');
                        let groupPwd = prompt("Bu gruba şifre koymak ister misiniz? (İstemiyorsanız boş bırakın):") || "";
                        currentGroup = groupKey;
                        const todayStr = new Date().toLocaleDateString("tr-TR");
                        let freshBooks = JSON.parse(JSON.stringify(defaultBooksTemplate));
                        let freshPages = {}, freshHatims = {}, freshHistory = {};
                        freshBooks.forEach(defBook => {
                            freshPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));

                            freshHistory[defBook.id] = [];
                        });
                        appData = {
                            members: [], password: groupPwd.trim(), books: freshBooks,
                            bookPages: freshPages, bookHatims: freshHatims, bookHistory: freshHistory, readingLogs: []
                        };
                        saveGroupData();
                        await loadGroupData();

                        localStorage.setItem(`hatim_session_${currentGroup}`, loggedInMember);
                    } else {
                        localStorage.removeItem(`hatim_session_${currentGroup}`);
                    }
                    renderUserControls();
                    renderBooks();
                });

                document.getElementById("user-add-member-btn").addEventListener("click", async () => {
                    let mName = prompt("Eklenecek üye adı:");
                    if (mName && mName.trim()) {
                        let clean = mName.trim();
                        if (!appData.members.includes(clean)) {
                            appData.members.push(clean);
                            loggedInMember = clean;
                            saveGroupData();
                            localStorage.setItem(`hatim_session_${currentGroup}`, loggedInMember);
                            renderUserControls();
                            renderBooks();
                            renderAdminSectionAtBottom();
                        } else {

                            return;

                        let summary = [];
                        appData.books.forEach(book => {
                            let baseArray = appData.bookPages[book.id];
                            let defModes = bookModesDefs[book.id];

                            let taken = [];
                            defModes[primaryKey].getItems().forEach(pi => {
                                let st = getRangeStatus(baseArray, pi.start, pi.end);
                                if (st.owner === loggedInMember) taken.push(pi.name);
                            });
                            if (taken.length > 0) summary.push(`• ${book.name}: *${taken.join(", ")}*`);
                        });

                        let msg = `*[${currentGroup.replace(/_/g, ' ').toUpperCase()}] ${loggedInMember} Hisseleri*\n\n` + summary.join("\n");

                    });
                }

            /* ========================================================= */

            /* ========================================================= */
            /* HİSSE ARALIĞI DURUMUNU SORGULAMA                          */
            /* ========================================================= */
            function getRangeStatus(baseArray, start, end) {
                let subset = baseArray.slice(start, end);
                let allFree = subset.every(p => !p.owner);
                let firstOwner = subset[0].owner;
                let firstIsRead = subset[0].isRead;
                let allSame = subset.every(p => p.owner === firstOwner && p.isRead === firstIsRead && p.owner !== "");

                if (allFree) return { owner: "", isRead: false, statusType: "free" };
                else if (allSame) return { owner: firstOwner, isRead: firstIsRead, statusType: firstIsRead ? "read" : "taken" };
                else {
                    let owners = [...new Set(subset.map(p => p.owner).filter(Boolean))];
                    return { owner: owners.join(", "), isRead: false, statusType: "mixed" };
                }
            }

            /* ========================================================= */
            /* ESERLERİ VE LİSTELERİ RENDER ETME                         */
            /* ========================================================= */
            function renderBooks() {
                const openBookIds = Array.from(document.querySelectorAll(".book-card.open")).map(el => el.getAttribute("data-book-id"));
                booksGrid.innerHTML = "";

                appData.books.forEach((book, bookIndex) => {
                    let baseArray = appData.bookPages[book.id];
                    let defModes = bookModesDefs[book.id] || createPageModes(book.totalUnits || 100);
                    let modeKeys = Object.keys(defModes);
                    if (!modeKeys.includes(book.currentMode)) book.currentMode = modeKeys[0];
                    let items = defModes[book.currentMode].getItems();

                    let takenCount = 0;
                    let primaryKey = book.type === "bab" ? "on_bab" : "yirmi_sayfa";
                    if (!defModes[primaryKey]) primaryKey = modeKeys[0];
                    let primaryItems = defModes[primaryKey].getItems();
                    primaryItems.forEach(pi => {
                        let st = getRangeStatus(baseArray, pi.start, pi.end);
                        if (st.statusType === "taken" || st.statusType === "read") takenCount++;
                    });
                    const totalCount = primaryItems.length;

                    const currentHatimInfo = appData.bookHatims[book.id];
                    const historyList = appData.bookHistory[book.id] || [];

                    const cardEl = document.createElement("div");
                    cardEl.className = `book-card ${openBookIds.includes(book.id) ? "open" : ""}`;
                    cardEl.setAttribute("data-book-id", book.id);

                    let modesHtml = `<div class="sub-modes" style="position: sticky; top: 0; z-index: 5; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);">`;
                    modeKeys.forEach(mKey => {

                        const activeClass = mKey === book.currentMode ? "active" : "";
                        modesHtml += `<button class="sub-btn ${activeClass}" data-book="${bookIndex}" data-mode="${mKey}" style="padding: 4px 8px; margin-right: 4px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border-color); background: ${activeClass ? 'var(--gold-primary)' : 'var(--card-bg)'}; color: ${activeClass ? '#000' : 'var(--text-main)'};">${mObj.name}</button>`;
                    });
                    modesHtml += `</div>`;

                    let adminHeaderControls = "";
                    if (isAdmin) {
                        adminHeaderControls = `
                            <div style="margin-top: 10px; padding: 10px; border: 1px solid var(--gold-primary); border-radius: 6px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                                <span style="font-size: 12px; font-weight: bold;">🛠️ Yönetici (${currentHatimInfo.hatimNo}. Hatim)</span>
                                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                    <button class="toggle-prayer-btn" data-bookid="${book.id}" style="padding: 4px 8px; font-size: 11px; cursor: pointer; background: #f39c12; color: #fff; border: none; border-radius: 3px;">Dua: ${currentHatimInfo.prayerDone ? "✓ Yapıldı" : "Yapılacak"}</button>
                                    <button class="finish-hatim-btn" data-bookid="${book.id}" style="padding: 4px 8px; font-size: 11px; background: #27ae60; color: #fff; border: none; border-radius: 3px; font-weight: bold; cursor: pointer;">🏁 Hatmi Bitir</button>
                                    <button class="cancel-hatim-btn" data-bookid="${book.id}" style="padding: 4px 8px; font-size: 11px; background: #e74c3c; color: #fff; border: none; border-radius: 3px; font-weight: bold; cursor: pointer;">❌ Sıfırla</button>
                                </div>
                            </div>
                        `;
                    }

                    let historyHtml = `
                        <div style="margin-top: 15px; padding: 14px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; background: rgba(0,0,0,0.02);">
                            <div style="font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px;">
                                <span>📚 Mevcut Döngü: <strong style="color: #27ae60;">${currentHatimInfo.hatimNo}. Hatim</strong></span>
                                <span style="font-size: 11px; opacity: 0.8; font-weight: normal;">Başlangıç: ${currentHatimInfo.startDate}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                                <span>Dua Durumu: <strong style="color: ${currentHatimInfo.prayerDone ? '#27ae60' : '#e67e22'};">${currentHatimInfo.prayerDone ? "✓ Yapıldı" : "Yapılacak"}</strong></span>
                            </div>
                            ${historyList.length > 0 ? `
                                <div style="margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 6px;">
                                    <div style="font-weight: bold; font-size: 11px; opacity: 0.7; margin-bottom: 3px;">TAMAMLANAN GEÇMİŞ:</div>
                                    ${historyList.map(h => `<div style="font-size: 11px; opacity: 0.8;">• ${h.hatimNo}. Hatim (${h.startDate} - ${h.endDate})</div>`).join('')}
                                </div>
                            ` : ""}
                        </div>
                    `;

                    cardEl.innerHTML = `
                        <div class="book-header" style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                            <div class="book-title-area">
                                <span class="book-name" style="font-weight: bold; font-size: 15px;">${book.name} <span style="color: #27ae60; font-size: 12px;">(${currentHatimInfo.hatimNo}. Hatim)</span></span>
                                <span class="book-stats" style="font-size: 12px; opacity: 0.8; display: block; margin-top: 2px;">Alınan: ${takenCount} / ${totalCount}</span>
                            </div>
                            <div class="book-actions" style="display: flex; align-items: center; gap: 14px;">
                                <button class="book-pdf-btn" data-bookid="${book.id}" data-bookname="${book.name}" title="PDF Görüntüle" style="padding: 6px 10px; font-size: 12px; cursor: pointer; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); border-radius: 6px; font-weight: bold;">📄 PDF</button>
                                <button class="book-whatsapp-btn" data-whatsapp="${bookIndex}" style="padding: 6px 10px; font-size: 12px; cursor: pointer; background: #25D366; color: #fff; border: none; border-radius: 6px; font-weight: bold;">💬 Paylaş</button>
                                <span class="toggle-icon" style="font-size: 14px; padding: 4px 6px; font-weight: bold; opacity: 0.8;">▼</span>
                            </div>

                        <div class="book-body" style="padding: 14px; display: none;">

                            <div class="items-list" id="list-${bookIndex}" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 10px; padding-right: 4px;"></div>
                            ${historyHtml}

                    booksGrid.appendChild(cardEl);

                    if (cardEl.classList.contains("open")) {
                        cardEl.querySelector(".book-body").style.display = "block";
                    }

                    cardEl.querySelector(".book-header").addEventListener("click", (e) => {
                        if (e.target.closest(".book-whatsapp-btn") || e.target.closest(".book-pdf-btn")) return;

                    cardEl.querySelector(".book-pdf-btn").addEventListener("click", (e) => {

                    cardEl.querySelectorAll(".finish-hatim-btn").forEach(btn => {

                                hatimNo: currentHatimInfo.hatimNo,
                                startDate: currentHatimInfo.startDate,
                                endDate: endDateStr,
                                prayerDone: currentHatimInfo.prayerDone
                            });
                            appData.bookHatims[bId] = { hatimNo: currentHatimInfo.hatimNo + 1, startDate: endDateStr, prayerDone: false };
                            appData.bookPages[bId] = Array(book.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                            saveGroupData();
                            renderAnalysisSection();
                            renderBooks();
                        });
                    });

                    cardEl.querySelectorAll(".cancel-hatim-btn").forEach(btn => {
                        btn.addEventListener("click", (e) => {
                            e.stopPropagation();
                            const bId = e.target.getAttribute("data-bookid");
                            if (!confirm("Hatim seçimlerini sıfırlamak istiyor musunuz?")) return;
                            appData.bookPages[bId] = Array(book.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                            saveGroupData();
                            renderAnalysisSection();
                            renderBooks();
                        });
                    });

                    cardEl.querySelectorAll(".toggle-prayer-btn").forEach(btn => {
                        btn.addEventListener("click", (e) => {
                            e.stopPropagation();
                            appData.bookHatims[e.target.getAttribute("data-bookid")].prayerDone = !appData.bookHatims[e.target.getAttribute("data-bookid")].prayerDone;
                            saveGroupData();
                            renderBooks();
                        });
                    });

                    const listContainer = cardEl.querySelector(`#list-${bookIndex}`);
                    items.forEach((item, itemIndex) => {
                        const row = document.createElement("div");
                        let statusClass = "", statusText = "Boş", actionText = "Al";
                        let st = getRangeStatus(baseArray, item.start, item.end);

                        if (st.statusType === "read") {
                            statusClass = "read";
                            statusText = `✓ Okundu: ${st.owner}`;
                            actionText = "Okundu";
                        } else if (st.statusType === "taken") {
                            statusClass = "taken";
                            statusText = `Alındı: ${st.owner}`;
                            actionText = "Oku";
                        } else if (st.statusType === "mixed") {
                            statusClass = "mixed";
                            statusText = `Karışık: ${st.owner}`;
                            actionText = "Detay";
                        }

                        row.className = `item-row ${statusClass}`;
                        row.style.cssText = `display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border-color); font-size: 13px; background: ${st.statusType === 'read' ? 'rgba(39, 174, 96, 0.1)' : st.statusType === 'taken' ? 'rgba(241, 196, 15, 0.1)' : 'transparent'};`;
                        row.innerHTML = `
                            <div>
                                <strong>${item.name}</strong>
                                <div style="font-size: 11px; opacity: 0.8; margin-top: 2px;">${statusText}</div>

                            </div>
                        `;

                        row.querySelector(".action-btn").addEventListener("click", () => {
                            if (!loggedInMember) {
                                alert("Lütfen önce isminizi seçin.");
                                return;
                            }
                            let subset = baseArray.slice(item.start, item.end);
                            let currentSt = getRangeStatus(baseArray, item.start, item.end);

                            if (currentSt.statusType === "free") {
                                subset.forEach(p => { p.owner = loggedInMember; p.isRead = false; });
                                if (!appData.readingLogs) appData.readingLogs = [];
                                appData.readingLogs.push({
                                    timestamp: Date.now(),
                                    date: new Date().toLocaleDateString("tr-TR"),
                                    member: loggedInMember,
                                    bookName: book.name,
                                    count: (item.end - item.start),
                                    range: item.name
                                });
                            } else if (currentSt.statusType === "taken" && currentSt.owner === loggedInMember) {
                                subset.forEach(p => { p.isRead = true; });
                            } else if (currentSt.statusType === "read" && currentSt.owner === loggedInMember) {
                                subset.forEach(p => { p.isRead = false; });
                            } else {
                                alert(`Bu hisse ${currentSt.owner} adına kayıtlı.`);
                                return;
                            }

                            saveGroupData();
                            renderBooks();
                            renderAnalysisSection();
                        });

                        listContainer.appendChild(row);
                    });

                    cardEl.querySelectorAll(".sub-btn").forEach(btn => {
                        btn.addEventListener("click", (e) => {
                            e.stopPropagation();
                            let bIdx = parseInt(e.target.getAttribute("data-book"), 10);
                            let mKey = e.target.getAttribute("data-mode");
                            appData.books[bIdx].currentMode = mKey;
                            saveGroupData();
                            renderBooks();
                        });
                    });
                });
            }

            // İlk Çalıştırma ve Başlatma
            await loadGroupData();
        });
    </script>
</body>
</html>
