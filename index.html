        <script>
        async function fetchPrayerTimes() {
            const city = document.getElementById('citySelect').value;
            const resultDiv = document.getElementById('prayerTimesResult');
            resultDiv.innerHTML = "Vakitler yükleniyor...";
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=&method=13`);
                const data = await response.json();
                if(data && data.data && data.data.timings) {
                    const t = data.data.timings;
                    resultDiv.innerHTML = `İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}`;
                } else {
                    resultDiv.innerHTML = "Vakitler alınamadı.";
                }
            } catch (error) {
                resultDiv.innerHTML = "Bağlantı hatası.";
            }
        }
        async function fetchPrayerTimesByGPS() {
            const resultDiv = document.getElementById('prayerTimesResult');
            if (!navigator.geolocation) { resultDiv.innerHTML = "Tarayıcınız konum desteklemiyor."; return; }
            resultDiv.innerHTML = "Konum alınıyor...";
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=13`);
                    const data = await response.json();
                    if(data && data.data && data.data.timings) {
                        const t = data.data.timings;
                        resultDiv.innerHTML = `İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}`;
                    } else {
                        resultDiv.innerHTML = "Konuma göre vakitler alınamadı.";
                    }
                } catch (error) {
                    resultDiv.innerHTML = "Bağlantı hatası.";
                }
            }, (error) => {
                resultDiv.innerHTML = "Konum izni reddedildi.";
            });
        }
        document.addEventListener("DOMContentLoaded", fetchPrayerTimes);
        </script>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            let container = document.querySelector(".container");
            if (!container) {

            }

            let booksGrid = document.getElementById("books-grid");

                container.appendChild(booksGrid);
            }

            function injectOrientalStyles() {
                if (document.getElementById("oriental-motif-styles")) return;
                const styleEl = document.createElement("style");
                styleEl.id = "oriental-motif-styles";
                styleEl.innerHTML = `

                        --bg-primary: #fdfbf7;
                        --card-bg: #ffffff;
                        --gold-primary: #d4af37;
                        --gold-dark: #8a6d3b;
                        --text-main: #3e2723;
                        --border-color: #e3dcd2;
                    }
                    body {
                        background-color: var(--bg-primary);
                        color: var(--text-main);
                        font-family: 'Georgia', serif;
                        margin: 0;
                        padding: 10px;
                        font-size: 16px;
                    }
                    .container {
                        max-width: 800px;
                        margin: 0 auto;
                    }
                    .book-card {
                        border: 2px solid var(--gold-primary) !important;
                        border-radius: 12px !important;
                        overflow: hidden;
                        margin-bottom: 15px;
                        background: var(--card-bg);
                    }
                    .book-header {
                        border-bottom: 2px solid var(--gold-primary);
                        background: linear-gradient(to right, rgba(212,175,55,0.1), transparent);
                    }
                    @media (prefers-color-scheme: dark) {
                        :root {
                            --bg-primary: #0b1329;
                            --card-bg: #131b31;
                            --gold-primary: #f6e05e;
                            --gold-dark: #d4af37;
                            --text-main: #f1f5f9;
                            --border-color: #22304a;
                        }
                        body {
                            background-color: #0b1329 !important;
                            color: #f1f5f9 !important;
                        }
                    }
                `;
                document.head.appendChild(styleEl);
            }
            injectOrientalStyles();

            let currentGroup = "grup_1";
            let isAdmin = false;
            let appData = null;
            let loggedInMember = "";
            let monthlyInspirationCache = {};
            const ADMIN_PASSWORD = "1234";

            const bookPdfMap = {
                "kuran": "pdf/Kuran-ı Kerim.pdf",
                "cevsen": "pdf/Cevşen.pdf",
                "tevhidname": "pdf/Tevhidname Mealli.pdf",
                "celcelutiye": "pdf/Celcelutiye.pdf",
                "buyuk_cevsen": "pdf/Büyük Cevşen.pdf",
                "ashabi_bedr": "pdf/Ashabı Bedr ve Şühedayı Uhud.pdf",
                "dalail": "pdf/Dalail ul khairat_text.pdf",
                "dua_mecmuasi": "pdf/Dua Mecmuasi Mealli.pdf",
                "dilekce_tr": "pdf/Bir Kırık Dilekçe Tr.pdf",
                "dilekce_ar": "pdf/Bir Kırık Dilekçe Ar.pdf"
            };

            function openPdfInNewTab(bookId, bookName) {
                let pdfPath = bookPdfMap[bookId] || appData.books.find(b => b.id === bookId)?.pdf || "pdf/Kuran-ı Kerim.pdf";
                window.open(pdfPath, '_blank');
            }

            function bugunkuHicriTarihiAl() {
                const ayAdlari = {
                    "01": "Muharrem", "02": "Sefer", "03": "Rebiülevvel", "04": "Rebiülahir",
                    "05": "Cemaziyelevvel", "06": "Cemaziyelahir", "07": "Recep", "08": "Şaban",
                    "09": "Ramazan", "10": "Şevval", "11": "Zilkade", "12": "Zilhicce"
                };
                try {
                    const formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' });
                    const parts = formatter.formatToParts(new Date());
                    let gun = "1", ay = "3", yil = "1448";
                    for (const part of parts) {
                        if (part.type === 'day') gun = part.value;
                        if (part.type === 'month') ay = part.value;
                        if (part.type === 'year') yil = part.value.replace(/[^0-9]/g, '');
                    }
                    let ayKoduStr = String(ay).padStart(2, '0');
                    let ayAdi = ayAdlari[ayKoduStr] || "Rebiülevvel";
                    return { ayKodu: ayKoduStr, gunNumarasi: parseInt(gun, 10), fullStr: `${gun} ${ayAdi} ${yil}` };
                } catch (hata) {
                    return { ayKodu: "03", gunNumarasi: 1, fullStr: "1 Rebiülevvel 1448" };
                }
            }

            async function fetchHijriMonthData(ayKodu) {
                if (monthlyInspirationCache[ayKodu]) return monthlyInspirationCache[ayKodu];
                const fileMap = {
                    "01": "json/01-muharrem.json", "02": "json/02-sefer.json", "03": "json/03-rebiulevvel.json",
                    "04": "json/04-rebiulahir.json", "05": "json/05-cemaziyelevvel.json", "06": "json/06-cemaziyelahir.json",
                    "07": "json/07-recep.json", "08": "json/08-saban.json", "09": "json/09-ramazan.json",
                    "10": "json/10-sevval.json", "11": "json/11-zilkade.json", "12": "json/12-zilhicce.json"
                };
                let filePath = fileMap[ayKodu] || "json/03-rebiulevvel.json";
                try {
                    const response = await fetch(filePath);
                    if (!response.ok) throw new Error('Dosya bulunamadı');
                    const data = await response.json();
                    monthlyInspirationCache[ayKodu] = data;
                    return data;
                } catch (e) {
                    console.error('JSON yüklenemedi:', e);
                    return null;
                }
            }

            async function getHijriInspiration() {
                const now = new Date();
                const gun = now.getDate();
                const ayAdlari = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
                const ayAdi = ayAdlari[now.getMonth()];
                const yil = now.getFullYear();
                const todayMiladiStr = `${gun} ${ayAdi} ${yil}`;
                const hicriInfo = bugunkuHicriTarihiAl();
                let hDay = hicriInfo.gunNumarasi;
                let hMonth = hicriInfo.ayKodu;
                let todayHijriStr = hicriInfo.fullStr;
                let jsonData = await fetchHijriMonthData(hMonth);
                let item = null;
                if (jsonData) {
                    if (Array.isArray(jsonData)) {
                        item = jsonData[hDay - 1] || jsonData[hDay];
                    } else if (typeof jsonData === 'object') {
                        item = jsonData[hDay] || jsonData[String(hDay)] || jsonData[String(hDay).padStart(2, '0')] || jsonData[String(parseInt(hDay, 10))];
                    }
                }
                let verseText = "Bu güne ait ayet verisi bulunamadı.";
                let hadishText = "Bu güne ait hadis verisi bulunamadı.";
                if (item) {
                    if (item.ayet) {
                        let meal = typeof item.ayet === 'object' ? (item.ayet.meal || item.ayet.text || "") : String(item.ayet);
                        let kaynak = typeof item.ayet === 'object' ? (item.ayet.kaynak || item.ayet.source || "") : "";
                        verseText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let h = item.hadis || item.hadish;
                    if (h) {
                        let meal = typeof h === 'object' ? (h.meal || h.text || "") : String(h);
                        let kaynak = typeof h === 'object' ? (h.kaynak || h.source || "") : "";
                        hadishText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                }
                return { fullDateStr: todayHijriStr, miladiDateStr: todayMiladiStr, verse: verseText, hadish: hadishText };
            }

            async function renderDailyInspiration() {
                const inspirationData = await getHijriInspiration();
                let inspirationContainer = document.getElementById("daily-inspiration-section");
                if (!inspirationContainer) {
                    inspirationContainer = document.createElement("div");
                    inspirationContainer.id = "daily-inspiration-section";
                    const mainTitleSec = document.getElementById("main-title-ornate-section");
                    if (mainTitleSec && mainTitleSec.nextSibling) {
                        container.insertBefore(inspirationContainer, mainTitleSec.nextSibling);
                    } else {
                        container.appendChild(inspirationContainer);
                    }
                }
                inspirationContainer.style.cssText = `
                    margin-bottom: 20px;
                    padding: 16px;
                    border: 1px solid #e3dcd2;
                    border-left: 4px solid #27ae60;
                    border-radius: 8px;
                    background: var(--card-bg);
                `;
                inspirationContainer.innerHTML = `
                   <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; width: 100%;">
                       <div style="flex: 1; text-align: left;">
                           <span style="font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2); display: inline-block;">📅 ${inspirationData.miladiDateStr}</span>
                       </div>
                       <div style="flex: 1; text-align: center;">
                           <span style="font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2); display: inline-block;">⭐ Manevi ve Dil İlhamı Köşesi ⭐</span>
                       </div>
                       <div style="flex: 1; text-align: right;">
                           <span style="font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2); display: inline-block;">🌙 ${inspirationData.fullDateStr}</span>
                       </div>
                   </div>
                   <div style="font-size: 13px; line-height: 1.6;">
                       <p style="margin-bottom: 6px;">📖 <strong>Ayet:</strong> ${inspirationData.verse}</p>
                       <p style="margin-bottom: 6px;">📜 <strong>Hadis:</strong> ${inspirationData.hadish}</p>
                   </div>
                `;
            }

            function createPageModes(totalPages) {
                return {
                    yirmi_sayfa: { name: "20 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 20); for (let i = 0; i < count; i++) { let start = i * 20, end = Math.min((i + 1) * 20, totalPages); items.push({ id: i + 1, name: `${i + 1}. Cüz / Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    on_sayfa: { name: "10 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 10); for (let i = 0; i < count; i++) { let start = i * 10, end = Math.min((i + 1) * 10, totalPages); items.push({ id: i + 1, name: `Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    bes_sayfa: { name: "5 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 5); for (let i = 0; i < count; i++) { let start = i * 5, end = Math.min((i + 1) * 5, totalPages); items.push({ id: i + 1, name: `Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    bir_sayfa: { name: "1 Sayfa", getItems: () => { let items = []; for (let i = 0; i < totalPages; i++) items.push({ id: i + 1, name: `${i + 1}. Sayfa`, start: i, end: i + 1 }); return items; }}
                };
            }

            function createBabModes(totalBabs) {
                return {
                    on_bab: { name: "10 Bab", getItems: () => { let items = [], count = Math.ceil(totalBabs / 10); for (let i = 0; i < count; i++) { let start = i * 10, end = Math.min((i + 1) * 10, totalBabs); items.push({ id: i + 1, name: `${start + 1}-${end}. Bablar`, start, end }); } return items; }},
                    bes_bab: { name: "5 Bab", getItems: () => { let items = [], count = Math.ceil(totalBabs / 5); for (let i = 0; i < count; i++) { let start = i * 5, end = Math.min((i + 1) * 5, totalBabs); items.push({ id: i + 1, name: `${start + 1}-${end}. Bablar`, start, end }); } return items; }},
                    bab: { name: "1 Bab", getItems: () => { let items = []; for (let i = 0; i < totalBabs; i++) items.push({ id: i + 1, name: `${i + 1}. Bab`, start: i, end: i + 1 }); return items; }}
                };
            }

            const defaultBooksTemplate = [
                { id: "kuran", name: "1. Kur'ân-ı Kerîm", totalUnits: 604, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "cevsen", name: "2. Cevşen", totalUnits: 100, type: "bab", defaultMode: "on_bab" },
                { id: "tevhidname", name: "3. Tevhidnâme", totalUnits: 20, type: "bab", defaultMode: "on_bab" },
                { id: "celcelutiye", name: "4. Celcelûtiye", totalUnits: 30, type: "bab", defaultMode: "on_bab" },
                { id: "buyuk_cevsen", name: "5. Büyük Cevşen", totalUnits: 250, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "ashabi_bedr", name: "6. Ashâb-ı Bedr ve Şühedâ-yı Uhud", totalUnits: 32, type: "page", defaultMode: "on_sayfa" },
                { id: "dalail", name: "7. Delâilü'l-Hayrât", totalUnits: 160, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "dua_mecmuasi", name: "8. Dua Mecmuası Mealli", totalUnits: 200, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "dilekce_tr", name: "9. Bir Kırık Dilekçe (Türkçe)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" },
                { id: "dilekce_ar", name: "10. Bir Kırık Dilekçe (Arapça)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" }
            ];

            const bookModesDefs = {};
            defaultBooksTemplate.forEach(b => {
                bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
            });

            function rebuildBookModesDefs() {
                if (appData && appData.books) {
                    appData.books.forEach(b => {
                        bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
                    });
                }
            }

            function getAllGroupKeys() {
                let keys = [];
                let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    if (key && key.startsWith("hatim_group_")) {
                        let gName = key.replace("hatim_group_", "");
                        let d = localStorage.getItem(key);
                        let isProtected = false;
                        if (d) {
                            try {
                                let parsed = JSON.parse(d);
                                if (parsed.password && parsed.password.trim() !== "") isProtected = true;
                            } catch(e){}
                        }
                        if (!isProtected || unlockedProtected.includes(gName) || gName === currentGroup) {
                            keys.push(gName);
                        }
                    }
                }
                if (keys.length === 0) keys.push("grup_1");
                else keys.sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
                return keys;
            }

            function updateAutocompleteLists() {
                const allMembers = new Set();
                const allGroups = getAllGroupKeys();
                allGroups.forEach(gKey => {
                    const data = localStorage.getItem(`hatim_group_${gKey}`);
                    if (data) {
                        try {
                            const parsed = JSON.parse(data);
                            if (parsed.members) {
                                parsed.members.forEach(m => allMembers.add(m));
                            }
                        } catch(e) {}
                    }
                });
                const nameList = document.getElementById('user-name-list');
                if (nameList) {
                    nameList.innerHTML = Array.from(allMembers).map(m => `<option value="${m}">`).join('');
                }
                const groupList = document.getElementById('group-name-list');
                if (groupList) {
                    const freeGroups = [];
                    allGroups.forEach(gKey => {
                        const data = localStorage.getItem(`hatim_group_${gKey}`);
                        if (data) {
                            try {
                                const parsed = JSON.parse(data);
                                if (!parsed.password || parsed.password.trim() === '') {
                                    freeGroups.push(gKey.replace(/_/g, ' ').toUpperCase());
                                }
                            } catch(e) {}
                        }
                    });
                    groupList.innerHTML = freeGroups.map(g => `<option value="${g}">`).join('');
                }
            }

            const typeSelect = document.getElementById('login-user-type');
            const groupSection = document.getElementById('login-group-section');
            if (typeSelect) {
                typeSelect.addEventListener('change', function() {
                    if (this.value === 'grup') {
                        groupSection.style.display = 'block';
                    } else {
                        groupSection.style.display = 'none';
                    }
                });
            }

            const joinBtn = document.getElementById('login-join-btn');
            if (joinBtn) {
                joinBtn.addEventListener('click', function() {
                    const userName = document.getElementById('login-user-name').value.trim();
                    const userPassword = document.getElementById('login-user-password').value.trim();
                    const userType = document.getElementById('login-user-type').value;
                    const groupName = document.getElementById('login-group-name').value.trim();
                    const groupPassword = document.getElementById('login-group-password').value.trim();
                    
                    if (!userName) {
                        alert('❌ Lütfen isminizi girin!');
                        return;
                    }
                    
                    if (userType === 'bireysel') {
                        if (!appData.members.includes(userName)) {
                            appData.members.push(userName);
                        }
                        loggedInMember = userName;
                        localStorage.setItem(`hatim_session_${currentGroup}`, userName);
                        saveGroupData();
                        alert(`✅ ${userName} bireysel olarak giriş yaptı!`);
                        loadGroupData();
                        return;
                    }
                    
                    if (!groupName) {
                        alert('❌ Lütfen grup adı girin!');
                        return;
                    }
                    
                    const groupKey = groupName.toLowerCase().replace(/\s+/g, '_');
                    const existingData = localStorage.getItem(`hatim_group_${groupKey}`);
                    
                    if (existingData) {
                        try {
                            const parsed = JSON.parse(existingData);
                            if (parsed.password && parsed.password.trim() !== '') {
                                if (groupPassword !== parsed.password) {
                                    alert('❌ Hatalı grup şifresi!');
                                    return;
                                }
                            }
                            if (!parsed.members.includes(userName)) {
                                parsed.members.push(userName);
                            }
                            localStorage.setItem(`hatim_group_${groupKey}`, JSON.stringify(parsed));
                            currentGroup = groupKey;
                            loggedInMember = userName;
                            localStorage.setItem(`hatim_session_${groupKey}`, userName);
                            alert(`✅ ${userName}, "${groupKey.replace(/_/g, ' ').toUpperCase()}" grubuna katıldı!`);
                            loadGroupData();
                        } catch(e) {
                            alert('❌ Grup verisi okunamadı.');
                        }
                    } else {
                        const todayStr = new Date().toLocaleDateString("tr-TR");
                        const freshBooks = JSON.parse(JSON.stringify(defaultBooksTemplate));
                        const freshPages = {};
                        const freshHatims = {};
                        const freshHistory = {};
                        freshBooks.forEach(defBook => {
                            freshPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                            freshHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                            freshHistory[defBook.id] = [];
                        });
                        const newGroupData = {
                            members: [userName],
                            password: groupPassword || "",
                            books: freshBooks,
                            bookPages: freshPages,
                            bookHatims: freshHatims,
                            bookHistory: freshHistory,
                            readingLogs: []
                        };
                        localStorage.setItem(`hatim_group_${groupKey}`, JSON.stringify(newGroupData));
                        currentGroup = groupKey;
                        loggedInMember = userName;
                        localStorage.setItem(`hatim_session_${groupKey}`, userName);
                        alert(`✅ "${groupKey.replace(/_/g, ' ').toUpperCase()}" grubu oluşturuldu ve ${userName} katıldı!`);
                        loadGroupData();
                    }
                });
            }

            function updateBulkShareVisibility() {

            document.addEventListener('click', function(e) {
                if (e.target && e.target.id === 'bulk-whatsapp-btn') {
                    if (!loggedInMember) {
                        alert("Lütfen önce isminizi seçin.");
                        return;
                    }
                    let summary = [];
                    appData.books.forEach(book => {
                        let baseArray = appData.bookPages[book.id];
                        let defModes = bookModesDefs[book.id];
                        let primaryKey = book.type === "bab" ? "on_bab" : "yirmi_sayfa";
                        if (!defModes[primaryKey]) primaryKey = Object.keys(defModes)[0];
                        let taken = [];
                        defModes[primaryKey].getItems().forEach(pi => {
                            let st = getRangeStatus(baseArray, pi.start, pi.end);
                            if (st.owner === loggedInMember) taken.push(pi.name);
                        });
                        if (taken.length > 0) summary.push(`• ${book.name}: *${taken.join(", ")}*`);
                    });
                    if (summary.length === 0) {
                        alert("Üzerinizde hisse bulunmuyor.");
                        return;
                    }
                    let msg = `*[${currentGroup.replace(/_/g, ' ').toUpperCase()}] ${loggedInMember} Hisseleri*\n\n` + summary.join("\n");
                    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
                }
            });

                    if (!gDataRaw) return;
                    let gData = JSON.parse(gDataRaw);
                    let memberCount = gData.members ? gData.members.length : 0;
                    totalMembers += memberCount;
                    let groupBooks = 0;
                    let groupTaken = 0;
                    let groupRead = 0;

                            groupBooks += b.totalUnits;
                            totalBooks += b.totalUnits;
                            if (gData.bookPages[b.id]) {

                        let newPwd = prompt("Gruba yeni şifre belirleyin (Kaldırmak için boş bırakın):", currentPwd);
                        if (newPwd !== null) {
                            appData.password = newPwd.trim();
                            saveGroupData();
                            if (appData.password) { alert("Grup şifresi başarıyla tanımlandı."); } else { alert("Grup şifresi kaldırıldı."); }
                            loadGroupData();
                        }
                    });

                    document.getElementById("admin-add-member").addEventListener("click", async () => {
                        let mName = prompt("Eklenecek üye adı:");
                        if (mName && mName.trim()) {
                            let clean = mName.trim();
                            if (!appData.members.includes(clean)) {
                                appData.members.push(clean);
                                saveGroupData();
                                await loadGroupData();
                            }
                        }
                    });

                    document.querySelectorAll(".admin-remove-member").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            let nameToRemove = e.target.getAttribute("data-name");
                            if (confirm(`"${nameToRemove}" adlı üyeyi çıkartmak istiyor musunuz?`)) {
                                appData.members = appData.members.filter(m => m !== nameToRemove);
                                saveGroupData();
                                await loadGroupData();
                            }
                        });
                    });

                    document.querySelectorAll(".admin-edit-member").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            let oldName = e.target.getAttribute("data-name");
                            let editedName = prompt("Yeni ad:", oldName);
                            if (editedName && editedName.trim() && editedName.trim() !== oldName) {
                                let cleanNew = editedName.trim();
                                let idx = appData.members.indexOf(oldName);
                                if (idx !== -1) {
                                    appData.members[idx] = cleanNew;
                                    Object.keys(appData.bookPages).forEach(bId => {
                                        appData.bookPages[bId].forEach(p => {
                                            if (p.owner === oldName) p.owner = cleanNew;
                                        });
                                    });
                                    if (appData.readingLogs) {
                                        appData.readingLogs.forEach(l => {
                                            if (l.member === oldName) l.member = cleanNew;
                                        });
                                    }
                                    saveGroupData();
                                    await loadGroupData();
                                }
                            }
                        });
                    });
                }

                document.getElementById("admin-toggle-btn-custom").addEventListener("click", () => triggerAdminToggle());
                document.getElementById("send-admin-msg-btn").addEventListener("click", () => {
                    let text = document.getElementById("admin-msg-input").value.trim();
                    if (!text) return;
                    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
                });
            }

            async function triggerAdminToggle() {
                if (isAdmin) {
                    isAdmin = false;
                } else {
                    const enteredPassword = prompt("Yönetici şifresi:");
                    if (enteredPassword === ADMIN_PASSWORD) {
                        isAdmin = true;
                    } else if (enteredPassword !== null) {
                        alert("Hatalı şifre!");
                        return;
                    } else {
                        return;
                    }
                }
                await renderDailyInspiration();
                renderBooks();
                renderAnalysisSection();
                renderAdminSectionAtBottom();
                updateAutocompleteLists();
            }

            function getRangeStatus(baseArray, start, end) {
                let subset = baseArray.slice(start, end);
                let allFree = subset.every(p => !p.owner);
                let firstOwner = subset[0].owner;
                let firstIsRead = subset[0].isRead;
                let allSame = subset.every(p => p.owner === firstOwner && p.isRead === firstIsRead && p.owner !== "");
                if (allFree) return { owner: "", isRead: false, statusType: "free" };
                else if (allSame) return { owner: firstOwner, isRead: firstIsRead, statusType: firstIsRead ? "read" : "taken" };
                else {
                    let owners = [...new Set(subset.map(p => p.owner).filter(Boolean))];
                    return { owner: owners.join(", "), isRead: false, statusType: "mixed" };
                }
            }

            function renderAnalysisSection() {
                let analysisContainer = document.getElementById("analysis-section");
                if (!analysisContainer) {
                    analysisContainer = document.createElement("div");
                    analysisContainer.id = "analysis-section";
                    container.appendChild(analysisContainer);
                } else {
                    container.appendChild(analysisContainer);
                }
                analysisContainer.style.cssText = "margin: 20px 0; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg);";

                let totalBooks = appData.books.length;
                let totalTakenUnits = 0, totalReadUnits = 0, totalUnitsAll = 0;
                appData.books.forEach(book => {
                    let baseArray = appData.bookPages[book.id];
                    totalUnitsAll += book.totalUnits;
                    baseArray.forEach(p => {
                        if (p.owner) totalTakenUnits++;
                        if (p.isRead) totalReadUnits++;
                    });
                });
                let percentTaken = totalUnitsAll > 0 ? Math.round((totalTakenUnits / totalUnitsAll) * 100) : 0;
                let percentRead = totalUnitsAll > 0 ? Math.round((totalReadUnits / totalUnitsAll) * 100) : 0;

                analysisContainer.innerHTML = `
                    <h3 style="margin-bottom: 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center;">
                        <span>📈 Genel Grup İlerleme Paneli</span>
                        <span style="font-size: 11px; background: #27ae60; color: #fff; padding: 3px 8px; border-radius: 4px;">Grup: ${currentGroup.replace(/_/g, ' ').toUpperCase()}</span>
                    </h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px;">
                        <div style="padding: 10px; border-radius: 6px; border-left: 4px solid #3498db; border: 1px solid var(--border-color);">
                            <div style="font-size: 11px; opacity: 0.8;">Toplam Eser</div>
                            <div style="font-size: 17px; font-weight: bold;">${totalBooks} Adet</div>
                        </div>
                        <div style="padding: 10px; border-radius: 6px; border-left: 4px solid #f39c12; border: 1px solid var(--border-color);">
                            <div style="font-size: 11px; opacity: 0.8;">Alınan Hisseler</div>
                            <div style="font-size: 17px; font-weight: bold;">${totalTakenUnits} / ${totalUnitsAll} (%${percentTaken})</div>
                        </div>
                        <div style="padding: 10px; border-radius: 6px; border-left: 4px solid #27ae60; border: 1px solid var(--border-color);">
                            <div style="font-size: 11px; opacity: 0.8;">Okunan Hisseler</div>
                            <div style="font-size: 17px; font-weight: bold;">${totalReadUnits} / ${totalUnitsAll} (%${percentRead})</div>
                        </div>
                    </div>
                `;
            }

            function renderBooks() {
                const openBookIds = Array.from(document.querySelectorAll(".book-card.open")).map(el => el.getAttribute("data-book-id"));
                booksGrid.innerHTML = "";

                appData.books.forEach((book) => {
                    let baseArray = appData.bookPages[book.id];
                    let defModes = bookModesDefs[book.id] || createPageModes(book.totalUnits || 100);
                    let modeKeys = Object.keys(defModes);
                    if (!modeKeys.includes(book.currentMode)) book.currentMode = modeKeys[0];
                    let items = defModes[book.currentMode].getItems();

                    let takenCount = 0;
                    baseArray.forEach(p => { if (p.owner) takenCount++; });
                    let percent = book.totalUnits > 0 ? Math.round((takenCount / book.totalUnits) * 100) : 0;

                    let hatimInfo = appData.bookHatims[book.id] || { hatimNo: 1, startDate: new Date().toLocaleDateString("tr-TR"), prayerDone: false };
                    let isOpen = openBookIds.includes(book.id);

                    let card = document.createElement("div");
                    card.className = `book-card ${isOpen ? "open" : ""}`;
                    card.setAttribute("data-book-id", book.id);
                    card.style.cssText = "border: 2px solid var(--gold-primary); border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: var(--card-bg);";

                    let modeButtonsHtml = modeKeys.map(mk => {
                        let mObj = defModes[mk];
                        let isActive = mk === book.currentMode;
                        return `<button class="mode-btn ${isActive ? 'active' : ''}" data-book-id="${book.id}" data-mode="${mk}" style="padding: 6px 12px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border-color); background: ${isActive ? 'var(--gold-primary)' : 'var(--card-bg)'}; color: ${isActive ? '#fff' : 'var(--text-main)'}; cursor: pointer; font-weight: bold;">${mObj.name}</button>`;
                    }).join('');

                    let itemsHtml = items.map(pi => {
                        let st = getRangeStatus(baseArray, pi.start, pi.end);
                        let bgStyle = "background: var(--card-bg); color: var(--text-main);";
                        let statusText = "Boş";

                        if (st.statusType === "free") {
                            bgStyle = "background: rgba(46, 204, 113, 0.08); color: var(--text-main);";
                            statusText = "Boş";
                        } else if (st.statusType === "taken") {
                            bgStyle = "background: rgba(241, 196, 15, 0.15); color: var(--text-main);";
                            statusText = `${st.owner} (Alındı)`;
                        } else if (st.statusType === "read") {
                            bgStyle = "background: rgba(39, 174, 96, 0.2); color: var(--text-main); font-weight: bold;";
                            statusText = `${st.owner} (✓ Okundu)`;
                        } else if (st.statusType === "mixed") {
                            bgStyle = "background: rgba(52, 152, 219, 0.1); color: var(--text-main);";
                            statusText = `Karma: ${st.owner}`;
                        }

                        let isOwner = loggedInMember && st.owner.includes(loggedInMember);
                        let actionButtons = "";

                        if (loggedInMember) {
                            if (st.statusType === "free") {
                                actionButtons = `<button class="take-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 8px 14px; background: #27ae60; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Hisse Al</button>`;
                            } else if (isOwner) {
                                if (st.statusType === "taken") {
                                    actionButtons = `
                                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                            <button class="read-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 8px 12px; background: #2980b9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Okundu İşaretle</button>
                                            <button class="release-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 8px 12px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Hisseden Vazgeç</button>
                                        </div>
                                    `;
                                } else if (st.statusType === "read") {
                                    actionButtons = `
                                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                            <button class="unread-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 8px 12px; background: #e67e22; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Okunmadı Çevir</button>
                                            <button class="release-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 8px 12px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Hisseden Vazgeç</button>
                                        </div>
                                    `;
                                }
                            }
                        }

                        return `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin-bottom: 6px; border-radius: 6px; border: 1px solid var(--border-color); ${bgStyle} flex-wrap: wrap; gap: 8px;">
                                <div>
                                    <div style="font-weight: bold; font-size: 14px;">${pi.name}</div>
                                    <div style="font-size: 12px; opacity: 0.85; margin-top: 2px;">Durum: ${statusText}</div>
                                </div>
                                <div>${actionButtons}</div>
                            </div>
                        `;
                    }).join('');

                    card.innerHTML = `
                        <div class="book-header" style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; flex-wrap: wrap; gap: 10px;">
                            <div>
                                <h3 style="margin: 0; font-size: 16px; color: var(--gold-dark);">${book.name}</h3>
                                <div style="font-size: 11px; opacity: 0.8; margin-top: 3px;">Hatim No: ${hatimInfo.hatimNo} | İlerleme: %${percent} (${takenCount}/${book.totalUnits})</div>
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <button class="read-pdf-btn" data-book-id="${book.id}" data-book-name="${book.name}" style="background: #8e44ad; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">📄 PDF Oku</button>
                                <span style="font-size: 12px; font-weight: bold; color: var(--gold-dark);">${isOpen ? '▲ Gizle' : '▼ Göster'}</span>
                            </div>
                        </div>
                        <div class="book-body" style="display: ${isOpen ? 'block' : 'none'}; padding: 16px; border-top: 1px solid var(--border-color);">
                            <div style="margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">${modeButtonsHtml}</div>
                            <div style="max-height: 350px; overflow-y: auto; padding-right: 4px;">${itemsHtml}</div>
                        </div>
                    `;
                    booksGrid.appendChild(card);
                });

                document.querySelectorAll(".book-header").forEach(header => {
                    header.addEventListener("click", (e) => {
                        if (e.target.closest(".read-pdf-btn")) return;
                        let card = header.closest(".book-card");
                        card.classList.toggle("open");
                        renderBooks();
                    });
                });

                document.querySelectorAll(".read-pdf-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        openPdfInNewTab(btn.getAttribute("data-book-id"), btn.getAttribute("data-book-name"));
                    });
                });

                document.querySelectorAll(".mode-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        let bId = btn.getAttribute("data-book-id");
                        let mKey = btn.getAttribute("data-mode");
                        let bookObj = appData.books.find(b => b.id === bId);
                        if (bookObj) {
                            bookObj.currentMode = mKey;
                            saveGroupData();
                            renderBooks();
                        }
                    });
                });

                document.querySelectorAll(".take-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        if (!loggedInMember) { alert("Lütfen önce isminizi seçin."); return; }
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { baseArray[i].owner = loggedInMember; baseArray[i].isRead = false; }
                        if (!appData.readingLogs) appData.readingLogs = [];
                        let defModes = bookModesDefs[bId];
                        let modeObj = Object.values(defModes).find(m => m.getItems().some(item => item.start === start && item.end === end));
                        let rangeName = modeObj ? modeObj.getItems().find(item => item.start === start && item.end === end).name : `${start+1}-${end}`;
                        appData.readingLogs.push({
                            date: new Date().toLocaleDateString("tr-TR") + " " + new Date().toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'}),
                            timestamp: Date.now(),
                            member: loggedInMember,
                            bookName: appData.books.find(b => b.id === bId).name,
                            range: rangeName,
                            count: end - start
                        });
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                    });
                });

                document.querySelectorAll(".read-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { baseArray[i].isRead = true; }
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                    });
                });

                document.querySelectorAll(".unread-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { baseArray[i].isRead = false; }
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                    });
                });

                document.querySelectorAll(".release-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { baseArray[i].owner = ""; baseArray[i].isRead = false; }
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                    });
                });
            }

            async function loadGroupData() {
                const savedData = localStorage.getItem(`hatim_group_${currentGroup}`);
                appData = savedData ? JSON.parse(savedData) : { members: currentGroup === "grup_1" ? [] : [], password: "" };

                if (!appData.members) appData.members = [];
                if (appData.password === undefined) appData.password = "";
                if (!appData.readingLogs) appData.readingLogs = [];

                const savedSession = localStorage.getItem(`hatim_session_${currentGroup}`);
                loggedInMember = (savedSession && appData.members.includes(savedSession)) ? savedSession : "";

                if (!appData.bookPages) appData.bookPages = {};
                if (!appData.bookHatims) appData.bookHatims = {};
                if (!appData.bookHistory) appData.bookHistory = {};

                const todayStr = new Date().toLocaleDateString("tr-TR");
                defaultBooksTemplate.forEach(defBook => {
                    if (!appData.bookPages[defBook.id]) appData.bookPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    if (!appData.bookHatims[defBook.id]) appData.bookHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[defBook.id]) appData.bookHistory[defBook.id] = [];
                });

                if (!appData.books) {
                    appData.books = JSON.parse(JSON.stringify(defaultBooksTemplate));
                } else {
                    defaultBooksTemplate.forEach(defBook => {
                        let existing = appData.books.find(b => b.id === defBook.id);
                        if (!existing) appData.books.push(JSON.parse(JSON.stringify(defBook)));
                        else {
                            if (!existing.currentMode) existing.currentMode = defBook.defaultMode;
                            if (!existing.totalUnits) existing.totalUnits = defBook.totalUnits;
                        }
                    });
                }

                appData.books.forEach(b => {
                    if (!appData.bookPages[b.id]) {
                        appData.bookPages[b.id] = Array(b.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    } else if (appData.bookPages[b.id].length !== b.totalUnits) {
                        if (appData.bookPages[b.id].length < b.totalUnits) {
                            while (appData.bookPages[b.id].length < b.totalUnits) {
                                appData.bookPages[b.id].push({ owner: "", isRead: false });
                            }
                        } else {
                            appData.bookPages[b.id] = appData.bookPages[b.id].slice(0, b.totalUnits);
                        }
                    }
                    if (!appData.bookHatims[b.id]) appData.bookHatims[b.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[b.id]) appData.bookHistory[b.id] = [];
                });

                rebuildBookModesDefs();
                saveGroupData();
                await renderDailyInspiration();
                renderBooks();
                renderAnalysisSection();
                renderAdminSectionAtBottom();
                updateAutocompleteLists();
                updateBulkShareVisibility();
            }

            function saveGroupData() {
                localStorage.setItem(`hatim_group_${currentGroup}`, JSON.stringify(appData));
            }

            await loadGroupData();
        });
    </script>
</body>
</html>
