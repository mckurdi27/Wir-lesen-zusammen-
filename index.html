<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- ================================================================= -->
    <!-- HEAD BÖLÜMÜ VE META AYARLARI -->
    <!-- ================================================================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ortak Hatim ve Dua Takip Sistemi</title>
</head>
<body>
    <!-- ================================================================= -->
    <!-- ANA İÇERİK KAPSAYICISI -->
    <!-- ================================================================= -->
    <div class="container">
        <div id="books-grid"></div>
    </div>

    <!-- ================================================================= -->
    <!-- JAVASCRIPT UYGULAMA MANTIĞI -->
    <!-- ================================================================= -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            
            /* ========================================================= */
            /* DOM ELEMANLARINI KONTROL ET VE OLUŞTUR                      */
            /* ========================================================= */
            let container = document.querySelector(".container");
            if (!container) {
                container = document.createElement("div");
                container.className = "container";
                document.body.appendChild(container);
            }

            let booksGrid = document.getElementById("books-grid");
            if (!booksGrid) {
                booksGrid = document.createElement("div");
                booksGrid.id = "books-grid";
                container.appendChild(booksGrid);
            }

            /* ========================================================= */
            /* ESKİ VEYA HATALI PANELLERİ TEMİZLEME FONKSİYONU             */
            /* ========================================================= */
            function removeStuckPanel() {
                document.querySelectorAll('div').forEach(div => {
                    if (div && div.textContent && div.textContent.includes("Ortak Hatim ve Dua Takip Sistemi") && !div.id.includes("main-title-ornate-section") && (div.querySelector('select') || div.innerHTML.includes("Yönetici Modu"))) {
                        div.remove();
                    }
                });
            }
            removeStuckPanel();
            setTimeout(removeStuckPanel, 100);

            /* ========================================================= */
            /* ORYANTAL MOTİFLER VE GENEL STİLLERİN ENJEKTE EDİLMESİ      */
            /* ========================================================= */
            function injectOrientalStyles() {
                if (document.getElementById("oriental-motif-styles")) return;
                const styleEl = document.createElement("style");
                styleEl.id = "oriental-motif-styles";
                styleEl.innerHTML = `
                    :root {
                        --bg-primary: #fdfbf7;
                        --card-bg: #ffffff;
                        --gold-primary: #d4af37;
                        --gold-dark: #8a6d3b;
                        --text-main: #3e2723;
                        --border-color: #e3dcd2;
                    }
                    body {
                        background-color: var(--bg-primary);
                        color: var(--text-main);
                        font-family: 'Georgia', serif;
                        margin: 0;
                        padding: 10px;
                    }
                    .container {
                        max-width: 800px;
                        margin: 0 auto;
                    }
                    @media (prefers-color-scheme: dark) {
                        :root {
                            --bg-primary: #0b1329;
                            --card-bg: #131b31;
                            --gold-primary: #f6e05e;
                            --gold-dark: #d4af37;
                            --text-main: #f1f5f9;
                            --border-color: #22304a;
                        }
                        body {
                            background-color: #0b1329 !important;
                            color: #f1f5f9 !important;
                        }
                    }
                    .book-card {
                        border: 2px solid var(--gold-primary) !important;
                        border-radius: 12px !important;
                        overflow: hidden;
                        margin-bottom: 15px;
                        background: var(--card-bg);
                    }
                    .book-header {
                        border-bottom: 2px solid var(--gold-primary);
                        background: linear-gradient(to right, rgba(212,175,55,0.1), transparent);
                    }
                `;
                document.head.appendChild(styleEl);
            }
            injectOrientalStyles();

            /* ========================================================= */
            /* GLOBAL UYGULAMA DEĞİŞKENLERİ VE YAPILANDIRMA              */
            /* ========================================================= */
            let currentGroup = "grup_1";
            let isAdmin = false;
            let appData = null;
            let loggedInMember = "";
            let monthlyInspirationCache = {};
            const ADMIN_PASSWORD = "1234";

            /* ========================================================= */
            /* ESERLER İÇİN PDF DOSYA YOLLARI EŞLEŞTİRMESİ               */
            /* ========================================================= */
            const bookPdfMap = {
                "kuran": "pdf/Kuran-ı Kerim.pdf",
                "cevsen": "pdf/Cevşen.pdf",
                "tevhidname": "pdf/Tevhidname Mealli.pdf",
                "celcelutiye": "pdf/Celcelutiye.pdf",
                "buyuk_cevsen": "pdf/Büyük Cevşen.pdf",
                "ashabi_bedr": "pdf/Ashabı Bedr ve Şühedayı Uhud.pdf",
                "dalail": "pdf/Dalail ul khairat_text.pdf",
                "dua_mecmuasi": "pdf/Dua Mecmuasi Mealli.pdf",
                "dilekce_tr": "pdf/Bir Kırık Dilekçe Tr.pdf",
                "dilekce_ar": "pdf/Bir Kırık Dilekçe Ar.pdf"
            };

            /* ========================================================= */
            /* BUGÜNKÜ HİCRİ TARİHİ HESAPLAMA FONKSİYONU                  */
            /* ========================================================= */
            function bugunkuHicriTarihiAl() {
                const ayAdlari = {
                    "01": "Muharrem", "02": "Sefer", "03": "Rebiülevvel", "04": "Rebiülahir",
                    "05": "Cemaziyelevvel", "06": "Cemaziyelahir", "07": "Recep", "08": "Şaban",
                    "09": "Ramazan", "10": "Şevval", "11": "Zilkade", "12": "Zilhicce"
                };
                try {
                    const formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' });
                    const parts = formatter.formatToParts(new Date());
                    let gun = "1", ay = "3", yil = "1448";
                    for (const part of parts) {
                        if (part.type === 'day') gun = part.value;
                        if (part.type === 'month') ay = part.value;
                        if (part.type === 'year') yil = part.value.replace(/[^0-9]/g, '');
                    }
                    let ayKoduStr = String(ay).padStart(2, '0');
                    let ayAdi = ayAdlari[ayKoduStr] || "Rebiülevvel";
                    return { ayKodu: ayKoduStr, gunNumarasi: parseInt(gun, 10), fullStr: `${gun} ${ayAdi} ${yil}` };
                } catch (hata) {
                    return { ayKodu: "03", gunNumarasi: 1, fullStr: "1 Rebiülevvel 1448" };
                }
            }

            /* ========================================================= */
            /* HİCRİ AY VERİLERİNİ ASENKRON OLARAK ÇEKME FONKSİYONU      */
            /* ========================================================= */
            async function fetchHijriMonthData(ayKodu) {
                if (monthlyInspirationCache[ayKodu]) return monthlyInspirationCache[ayKodu];
                const fileMap = {
                    "01": "js/01-muharrem.js", "02": "js/02-sefer.js", "03": "js/03-rebiülevvel.js",
                    "04": "js/04-rebiülahir.js", "05": "js/05-cemaziyelevvel.js", "06": "js/06-cemaziyelahir.js",
                    "07": "js/07-recep.js", "08": "js/08-saban.js", "09": "js/09-ramazan.js",
                    "10": "js/10-sevval.js", "11": "js/11-zilkade.js", "12": "js/12-zilhicce.js"
                };
                let filePath = fileMap[ayKodu] || "js/03-rebiulevvel.js";
                try {
                    let mod = await import(`./${filePath}`);
                    let data = mod.default || mod.data || mod;
                    monthlyInspirationCache[ayKodu] = data;
                    return data;
                } catch (e) {
                    console.error("JavaScript modülü yükleme hatası:", e);
                    return null;
                }
            }

            /* ========================================================= */
            /* MANEVİ VE DİL İLHAMI VERİLERİNİ HAZIRLAMA                 */
            /* ========================================================= */
            async function getHijriInspiration() {
                const todayMiladiStr = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const hicriInfo = bugunkuHicriTarihiAl();
                let hDay = hicriInfo.gunNumarasi;
                let hMonth = hicriInfo.ayKodu;
                let todayHijriStr = hicriInfo.fullStr;
                let jsonData = await fetchHijriMonthData(hMonth);
                let item = null;
                if (jsonData) {
                    if (Array.isArray(jsonData)) {
                        item = jsonData[hDay - 1] || jsonData[hDay];
                    } else if (typeof jsonData === 'object') {
                        item = jsonData[hDay] || jsonData[String(hDay)] || jsonData[String(hDay).padStart(2, '0')] || jsonData[String(parseInt(hDay, 10))];
                    }
                }
                let verseText = "Bu güne ait ayet verisi bulunamadı.";
                let hadishText = "Bu güne ait hadis verisi bulunamadı.";
                let proverbText = "Bu güne ait atasözü verisi bulunamadı.";
                let quoteText = "Bu güne ait özlü söz verisi bulunamadı.";
                let germanQuote = "Verfügbar nicht.";
                let germanTrans = "Çeviri bulunamadı.";
                if (item) {
                    if (item.ayet) {
                        let meal = typeof item.ayet === 'object' ? (item.ayet.meal || item.ayet.text || "") : String(item.ayet);
                        let kaynak = typeof item.ayet === 'object' ? (item.ayet.kaynak || item.ayet.source || "") : "";
                        verseText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let h = item.hadis || item.hadish;
                    if (h) {
                        let meal = typeof h === 'object' ? (h.meal || h.text || "") : String(h);
                        let kaynak = typeof h === 'object' ? (h.kaynak || h.source || "") : "";
                        hadishText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let a = item.atasozu || item.atasözü;
                    if (a) {
                        let text = typeof a === 'object' ? (a.text || a.meal || "") : String(a);
                        let kaynak = typeof a === 'object' ? (a.kaynak || a.source || "") : "";
                        proverbText = kaynak ? `${text} (${kaynak})` : text;
                    }
                    let o = item.ozlu_soz || item.ozluSoz || item.soz;
                    if (o) {
                        let text = typeof o === 'object' ? (o.text || o.meal || "") : String(o);
                        let kaynak = typeof o === 'object' ? (o.kaynak || o.source || "") : "";
                        quoteText = kaynak ? `${text} (${kaynak})` : text;
                    }
                    if (item.german) {
                        germanQuote = item.german.quote || germanQuote;
                        germanTrans = item.german.translation || germanTrans;
                    }
                }
                return { fullDateStr: todayHijriStr, miladiDateStr: todayMiladiStr, verse: verseText, hadish: hadishText, proverb: proverbText, quote: quoteText, german: { quote: germanQuote, translation: germanTrans } };
            }

            /* ========================================================= */
            /* ANA BAŞLIK BÖLÜMÜNÜ OLUŞTURMA VE RENDER ETME              */
            /* ========================================================= */
            function renderMainTitleHeader() {
                let titleSection = document.getElementById("main-title-ornate-section");
                if (!titleSection) {
                    titleSection = document.createElement("div");
                    titleSection.id = "main-title-ornate-section";
                    container.insertBefore(titleSection, container.firstChild);
                }
                titleSection.style.cssText = `
                    margin-bottom: 20px;
                    padding: 22px;
                    background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd0 100%);
                    border: 2px solid #d4af37;
                    border-top: 6px solid #8a6d3b;
                    border-radius: 12px;
                    box-shadow: 0 4px 15px rgba(138, 109, 59, 0.2);
                    text-align: center;
                `;
                titleSection.innerHTML = `
                    <div style="font-size: 21px; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;">
                        <span>⚜️ 📖</span>
                        <span>Ortak Hatim ve Duada Buluşuyoruz</span>
                        <span>📖 ⚜️</span>
                    </div>
                    <div style="font-size: 13px; opacity: 0.85; font-style: italic;">
                        Grubunuzu seçin, isminizi belirleyin ve manevi iklimde ortak hatim halkamıza katılın.
                    </div>
                `;
            }

            /* ========================================================= */
            /* KABE VE MESCİD-İ NEBEVİ GÖRSELLERİ BÖLÜMÜ                   */
            /* ========================================================= */
            function renderSpiritualImagesSection() {
                let imgSection = document.getElementById("spiritual-images-section");
                if (!imgSection) {
                    imgSection = document.createElement("div");
                    imgSection.id = "spiritual-images-section";
                    const mainTitleSec = document.getElementById("main-title-ornate-section");
                    if (mainTitleSec && mainTitleSec.nextSibling) {
                        container.insertBefore(imgSection, mainTitleSec.nextSibling);
                    } else {
                        container.appendChild(imgSection);
                    }
                }
                imgSection.style.cssText = `
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                    gap: 15px;
                    margin-bottom: 20px;
                `;
                imgSection.innerHTML = `
                    <div style="background: var(--card-bg); border: 2px solid var(--gold-primary); border-radius: 10px; overflow: hidden; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.1);">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Mecca_The_Kaaba_2015.jpg/640px-Mecca_The_Kaaba_2015.jpg" alt="Kabe-i Muazzama" style="width: 100%; height: 180px; object-fit: cover; display: block;">
                        <div style="padding: 10px; font-weight: bold; font-size: 13px; color: var(--gold-dark);">🕋 Kâbe-i Muazzama (Mekke)</div>
                    </div>
                    <div style="background: var(--card-bg); border: 2px solid var(--gold-primary); border-radius: 10px; overflow: hidden; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.1);">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Al-Masjid_an-Nabawi_Dome.jpg/640px-Al-Masjid_an-Nabawi_Dome.jpg" alt="Mescid-i Nebevi" style="width: 100%; height: 180px; object-fit: cover; display: block;">
                        <div style="padding: 10px; font-weight: bold; font-size: 13px; color: var(--gold-dark);">🕌 Mescid-i Nebevi (Medine)</div>
                    </div>
                `;
            }

            /* ========================================================= */
            /* NAMAZ VAKİTLERİ WIDGET BÖLÜMÜ                             */
            /* ========================================================= */
            async function renderPrayerTimesSection() {
                let prayerSection = document.getElementById("prayer-times-section");
                if (!prayerSection) {
                    prayerSection = document.createElement("div");
                    prayerSection.id = "prayer-times-section";
                    const imgSec = document.getElementById("spiritual-images-section");
                    if (imgSec && imgSec.nextSibling) {
                        container.insertBefore(prayerSection, imgSec.nextSibling);
                    } else {
                        container.appendChild(prayerSection);
                    }
                }
                prayerSection.style.cssText = `
                    margin-bottom: 20px;
                    padding: 16px;
                    border: 1px solid var(--border-color);
                    border-left: 4px solid var(--gold-primary);
                    border-radius: 8px;
                    background: var(--card-bg);
                `;
                prayerSection.innerHTML = `
                    <div style="text-align: center; font-weight: bold; font-size: 14px; border-bottom: 1px dashed rgba(150,150,150,0.3); padding-bottom: 8px; margin-bottom: 10px;">
                        ⏳ Günlük Namaz Vakitleri (İstanbul)
                    </div>
                    <div id="prayer-times-content" style="text-align: center; font-size: 13px; opacity: 0.9;">
                        Vakitler yükleniyor...
                    </div>
                `;

                try {
                    // Ücretsiz AlAdhan API ile İstanbul için bugünkü namaz vakitlerini çekme (veya konum bazlı)
                    const todayDateStr = new Date().toISOString().split('T')[0].split('-').reverse().join('-');
                    const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=Istanbul&country=Turkey&method=13`);
                    const data = await response.json();
                    if (data && data.data && data.data.timings) {
                        const t = data.data.timings;
                        document.getElementById("prayer-times-content").innerHTML = `
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-top: 6px;">
                                <div style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;"><strong>İmsak:</strong><br>${t.Fajr}</div>
                                <div style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;"><strong>Güneş:</strong><br>${t.Sunrise}</div>
                                <div style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;"><strong>Öğle:</strong><br>${t.Dhuhr}</div>
                                <div style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;"><strong>İkindi:</strong><br>${t.Asr}</div>
                                <div style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;"><strong>Akşam:</strong><br>${t.Maghrib}</div>
                                <div style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;"><strong>Yatsı:</strong><br>${t.Isha}</div>
                            </div>
                        `;
                    }
                } catch (e) {
                    document.getElementById("prayer-times-content").innerHTML = "Namaz vakitleri şu anda alınamadı.";
                }
            }

            /* ========================================================= */
            /* GÜNLÜK İLHAM KÖŞESİNİ RENDER ETME FONKSİYONU              */
            /* ========================================================= */
            async function renderDailyInspiration() {
                const inspirationData = await getHijriInspiration();
                let inspirationContainer = document.getElementById("daily-inspiration-section");
                if (!inspirationContainer) {
                    inspirationContainer = document.createElement("div");
                    inspirationContainer.id = "daily-inspiration-section";
                    const prayerSec = document.getElementById("prayer-times-section");
                    if (prayerSec && prayerSec.nextSibling) {
                        container.insertBefore(inspirationContainer, prayerSec.nextSibling);
                    } else {
                        container.appendChild(inspirationContainer);
                    }
                }
                inspirationContainer.style.cssText = `
                    margin-bottom: 20px;
                    padding: 16px;
                    border: 1px solid var(--border-color);
                    border-left: 4px solid #27ae60;
                    border-radius: 8px;
                    background: var(--card-bg);
                `;
                inspirationContainer.innerHTML = `
                    <div style="text-align: center; font-weight: bold; font-size: 14px; border-bottom: 1px dashed rgba(150,150,150,0.3); padding-bottom: 8px; margin-bottom: 10px;">
                        🌙 Manevi ve Dil İlhamı Köşesi
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                        <span style="font-size: 12px; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2);">📅 Miladi: ${inspirationData.miladiDateStr}</span>
                        <span style="font-size: 12px; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(150,150,150,0.2);">🌙 Hicri: ${inspirationData.fullDateStr}</span>
                    </div>
                    <div style="font-size: 13px; line-height: 1.6;">
                        <p style="margin-bottom: 6px;">📖 <strong>Ayet:</strong> ${inspirationData.verse}</p>
                        <p style="margin-bottom: 6px;">📜 <strong>Hadis:</strong> ${inspirationData.hadish}</p>
                        <p style="margin-bottom: 6px;">💬 <strong>Atasözü:</strong> ${inspirationData.proverb}</p>
                        <p style="margin-bottom: 6px;">✨ <strong>Özlü Sözü:</strong> ${inspirationData.quote}</p>
                        <p style="margin-bottom: 2px;">🇩🇪 <strong>Tägliche Weisheit:</strong> <em>"${inspirationData.german.quote}"</em> <span style="opacity: 0.8;">(${inspirationData.german.translation})</span></p>
                    </div>
                `;
            }

            /* ========================================================= */
            /* SAYFA MODLARI OLUŞTURUCU (SAYFA TABANLI ESERLER İÇİN)     */
            /* ========================================================= */
            function createPageModes(totalPages) {
                return {
                    yirmi_sayfa: { name: "20 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 20); for (let i = 0; i < count; i++) { let start = i * 20, end = Math.min((i + 1) * 20, totalPages); items.push({ id: i + 1, name: `${i + 1}. Cüz / Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    on_sayfa: { name: "10 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 10); for (let i = 0; i < count; i++) { let start = i * 10, end = Math.min((i + 1) * 10, totalPages); items.push({ id: i + 1, name: `Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    bes_sayfa: { name: "5 Sayfa", getItems: () => { let items = [], count = Math.ceil(totalPages / 5); for (let i = 0; i < count; i++) { let start = i * 5, end = Math.min((i + 1) * 5, totalPages); items.push({ id: i + 1, name: `Sayfa ${start + 1}-${end}`, start, end }); } return items; }},
                    bir_sayfa: { name: "1 Sayfa", getItems: () => { let items = []; for (let i = 0; i < totalPages; i++) items.push({ id: i + 1, name: `${i + 1}. Sayfa`, start: i, end: i + 1 }); return items; }}
                };
            }

            /* ========================================================= */
            /* BAB MODLARI OLUŞTURUCU (BAB TABANLI ESERLER İÇİN)         */
            /* ========================================================= */
            function createBabModes(totalBabs) {
                return {
                    on_bab: { name: "10 Bab", getItems: () => { let items = [], count = Math.ceil(totalBabs / 10); for (let i = 0; i < count; i++) { let start = i * 10, end = Math.min((i + 1) * 10, totalBabs); items.push({ id: i + 1, name: `${start + 1}-${end}. Bablar`, start, end }); } return items; }},
                    bes_bab: { name: "5 Bab", getItems: () => { let items = [], count = Math.ceil(totalBabs / 5); for (let i = 0; i < count; i++) { let start = i * 5, end = Math.min((i + 1) * 5, totalBabs); items.push({ id: i + 1, name: `${start + 1}-${end}. Bablar`, start, end }); } return items; }},
                    bab: { name: "1 Bab", getItems: () => { let items = []; for (let i = 0; i < totalBabs; i++) items.push({ id: i + 1, name: `${i + 1}. Bab`, start: i, end: i + 1 }); return items; }}
                };
            }

            /* ========================================================= */
            /* VARSAYILAN ESERLER ŞABLONU                                */
            /* ========================================================= */
            const defaultBooksTemplate = [
                { id: "kuran", name: "1. Kur'ân-ı Kerîm", totalUnits: 604, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "cevsen", name: "2. Cevşen", totalUnits: 100, type: "bab", defaultMode: "on_bab" },
                { id: "tevhidname", name: "3. Tevhidnâme", totalUnits: 20, type: "bab", defaultMode: "on_bab" },
                { id: "celcelutiye", name: "4. Celcelûtiye", totalUnits: 30, type: "bab", defaultMode: "on_bab" },
                { id: "buyuk_cevsen", name: "5. Büyük Cevşen", totalUnits: 250, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "ashabi_bedr", name: "6. Ashâb-ı Bedr ve Şühedâ-yı Uhud", totalUnits: 32, type: "page", defaultMode: "on_sayfa" },
                { id: "dalail", name: "7. Delâilü'l-Hayrât", totalUnits: 160, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "dua_mecmuasi", name: "8. Dua Mecmuası Mealli", totalUnits: 200, type: "page", defaultMode: "yirmi_sayfa" },
                { id: "dilekce_tr", name: "9. Bir Kırık Dilekçe (Türkçe)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" },
                { id: "dilekce_ar", name: "10. Bir Kırık Dilekçe (Arapça)", totalUnits: 100, type: "page", defaultMode: "on_sayfa" }
            ];

            const bookModesDefs = {};
            defaultBooksTemplate.forEach(b => {
                bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
            });

            function rebuildBookModesDefs() {
                if (appData && appData.books) {
                    appData.books.forEach(b => {
                        bookModesDefs[b.id] = b.type === "bab" ? createBabModes(b.totalUnits) : createPageModes(b.totalUnits);
                    });
                }
            }

            /* ========================================================= */
            /* TÜM GRUP ANAHTARLARINI LİSTELEME FONKSİYONU               */
            /* ========================================================= */
            function getAllGroupKeys() {
                let keys = [];
                let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    if (key && key.startsWith("hatim_group_")) {
                        let gName = key.replace("hatim_group_", "");
                        let d = localStorage.getItem(key);
                        let isProtected = false;
                        if (d) {
                            try {
                                let parsed = JSON.parse(d);
                                if (parsed.password && parsed.password.trim() !== "") isProtected = true;
                            } catch(e){}
                        }
                        if (!isProtected || unlockedProtected.includes(gName) || gName === currentGroup) {
                            keys.push(gName);
                        }
                    }
                }
                if (keys.length === 0) keys.push("grup_1");
                else keys.sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
                return keys;
            }

            /* ========================================================= */
            /* GRUP VERİLERİNİ YÜKLEME VE DOĞRULAMA FONKSİYONU           */
            /* ========================================================= */
            async function loadGroupData() {
                removeStuckPanel();
                const savedData = localStorage.getItem(`hatim_group_${currentGroup}`);
                appData = savedData ? JSON.parse(savedData) : { members: currentGroup === "grup_1" ? ["Ahmet", "Mehmet", "Ayşe"] : [], password: "" };

                if (appData.password && !isAdmin) {
                    let unlockedProtected = JSON.parse(localStorage.getItem("unlocked_protected_groups") || "[]");
                    if (!unlockedProtected.includes(currentGroup)) {
                        let enteredPwd = prompt(`"${currentGroup.replace(/_/g, ' ').toUpperCase()}" grubu şifrelidir. Lütfen şifreyi girin:`);
                        if (enteredPwd === appData.password) {
                            unlockedProtected.push(currentGroup);
                            localStorage.setItem("unlocked_protected_groups", JSON.stringify(unlockedProtected));
                        } else {
                            alert("Hatalı veya boş şifre! Şifreyi bilmediğiniz için bu gruba erişilemiyor.");
                            let allGroups = getAllGroupKeys();
                            let fallback = allGroups.find(g => {
                                let d = localStorage.getItem(`hatim_group_${g}`);
                                if (!d) return true;
                                let parsed = JSON.parse(d);
                                return !parsed.password;
                            }) || "grup_1";
                            currentGroup = fallback;
                            const savedDataFallback = localStorage.getItem(`hatim_group_${currentGroup}`);
                            appData = savedDataFallback ? JSON.parse(savedDataFallback) : { members: currentGroup === "grup_1" ? ["Ahmet", "Mehmet", "Ayşe"] : [], password: "" };
                        }
                    }
                }

                if (!appData.members) appData.members = [];
                if (appData.password === undefined) appData.password = "";
                if (!appData.readingLogs) appData.readingLogs = [];

                const savedSession = localStorage.getItem(`hatim_session_${currentGroup}`);
                loggedInMember = (savedSession && appData.members.includes(savedSession)) ? savedSession : "";

                if (!appData.bookPages) appData.bookPages = {};
                if (!appData.bookHatims) appData.bookHatims = {};
                if (!appData.bookHistory) appData.bookHistory = {};

                const todayStr = new Date().toLocaleDateString("tr-TR");
                defaultBooksTemplate.forEach(defBook => {
                    if (!appData.bookPages[defBook.id]) appData.bookPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    if (!appData.bookHatims[defBook.id]) appData.bookHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[defBook.id]) appData.bookHistory[defBook.id] = [];
                });

                if (!appData.books) {
                    appData.books = JSON.parse(JSON.stringify(defaultBooksTemplate));
                } else {
                    defaultBooksTemplate.forEach(defBook => {
                        let existing = appData.books.find(b => b.id === defBook.id);
                        if (!existing) appData.books.push(JSON.parse(JSON.stringify(defBook)));
                        else {
                            if (!existing.currentMode) existing.currentMode = defBook.defaultMode;
                            if (!existing.totalUnits) existing.totalUnits = defBook.totalUnits;
                        }
                    });
                }

                appData.books.forEach(b => {
                    if (!appData.bookPages[b.id]) {
                        appData.bookPages[b.id] = Array(b.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    } else if (appData.bookPages[b.id].length !== b.totalUnits) {
                        if (appData.bookPages[b.id].length < b.totalUnits) {
                            while (appData.bookPages[b.id].length < b.totalUnits) {
                                appData.bookPages[b.id].push({ owner: "", isRead: false });
                            }
                        } else {
                            appData.bookPages[b.id] = appData.bookPages[b.id].slice(0, b.totalUnits);
                        }
                    }
                    if (!appData.bookHatims[b.id]) appData.bookHatims[b.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[b.id]) appData.bookHistory[b.id] = [];
                });

                rebuildBookModesDefs();
                saveGroupData();
                renderMainTitleHeader();
                renderSpiritualImagesSection();
                await renderPrayerTimesSection();
                await renderDailyInspiration();
                renderUserControls();
                renderBooks();
                renderAnalysisSection();
                renderAdminSectionAtBottom();
            }

            function saveGroupData() {
                localStorage.setItem(`hatim_group_${currentGroup}`, JSON.stringify(appData));
            }

                        if (!targetDataRaw) {

                        try {

            async function triggerAdminToggle() {
                if (isAdmin) {

            function getRangeStatus(baseArray, start, end) {
                let subset = baseArray.slice(start, end);
                let allFree = subset.every(p => !p.owner);
                let firstOwner = subset[0].owner;
                let firstIsRead = subset[0].isRead;
                let allSame = subset.every(p => p.owner === firstOwner && p.isRead === firstIsRead && p.owner !== "");

                if (allFree) return { owner: "", isRead: false, statusType: "free" };
                else if (allSame) return { owner: firstOwner, isRead: firstIsRead, statusType: firstIsRead ? "read" : "taken" };
                else {
                    let owners = [...new Set(subset.map(p => p.owner).filter(Boolean))];
                    return { owner: owners.join(", "), isRead: false, statusType: "mixed" };
                }
            }

                booksGrid.innerHTML = "";

                    let baseArray = appData.bookPages[book.id];
                    let defModes = bookModesDefs[book.id] || createPageModes(book.totalUnits || 100);
                    let modeKeys = Object.keys(defModes);
                    if (!modeKeys.includes(book.currentMode)) book.currentMode = modeKeys[0];
                    let items = defModes[book.currentMode].getItems();

                    const cardEl = document.createElement("div");
                    cardEl.className = "book-card";
                    cardEl.innerHTML = `
                        <div class="book-header" style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                            <span style="font-weight: bold; font-size: 15px;">${book.name}</span>

                        </div>
                        <div class="book-body" style="padding: 14px; display: none;">
                            <div style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px;" id="list-${bookIndex}"></div>
                        </div>
                    `;
                    booksGrid.appendChild(cardEl);

                    cardEl.querySelector(".book-header").addEventListener("click", () => {
                        const body = cardEl.querySelector(".book-body");
                        body.style.display = body.style.display === "block" ? "none" : "block";
                    });

                    const listContainer = cardEl.querySelector(`#list-${bookIndex}`);
                    items.forEach((item) => {
                        let row = document.createElement("div");
                        let st = getRangeStatus(baseArray, item.start, item.end);
                        row.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border-color); font-size: 13px;";
                        row.innerHTML = `<span>${item.name}</span> <span>${st.owner ? 'Alan: ' + st.owner : 'Boş'}</span>`;
                        listContainer.appendChild(row);
                    });
                });
            }

            await loadGroupData();
        });
    </script>
</body>
</html>
