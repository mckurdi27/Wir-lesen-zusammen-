<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ortak Hatim ve Dua Takip Sistemi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-primary: #fdfbf7;
            --card-bg: #ffffff;
            --gold-primary: #d4af37;
            --gold-dark: #8a6d3b;
            --text-main: #3e2723;
            --border-color: #e3dcd2;
            --color-taken: #e74c3c;
            --color-read: #27ae60;
            --color-free: #f39c12;
            --touch-target: 48px;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 10px;
            font-size: 16px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button, .clickable {
            min-height: var(--touch-target);
            min-width: var(--touch-target);
            padding: 10px 16px;
            touch-action: manipulation;
            border-radius: 8px;
            font-size: 14px;
        }
        .book-card {
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: var(--card-bg);
        }
        .book-header {
            border-bottom: 2px solid var(--gold-primary);
            background: linear-gradient(to right, rgba(212,175,55,0.1), transparent);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-wrap: wrap;
            gap: 10px;
        }
        .book-body {
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }
        .status-free { background: rgba(243, 156, 18, 0.15) !important; border-left: 4px solid #f39c12; }
        .status-taken { background: rgba(231, 76, 60, 0.12) !important; border-left: 4px solid #e74c3c; }
        .status-read { background: rgba(39, 174, 96, 0.18) !important; border-left: 4px solid #27ae60; font-weight: bold; }
        .status-mixed { background: rgba(52, 152, 219, 0.1) !important; border-left: 4px solid #3498db; }

        @media (max-width: 640px) {
            .container { padding: 0 5px; }
            .row-3col { grid-template-columns: 1fr !important; gap: 8px !important; }
            .book-body { padding: 10px; }
            .book-header { flex-direction: column; align-items: stretch; text-align: center; }
            .mode-btn, .take-range-btn, .read-range-btn, .release-range-btn, .unread-range-btn {
                font-size: 13px !important;
                padding: 10px 14px !important;
                min-height: 44px;
            }
            #simple-login-panel { padding: 12px; }
            #main-title-ornate-section img { height: 120px !important; }
            #main-title-ornate-section > div { flex-direction: column; align-items: center; }
            .admin-panel-grid { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 480px) {
            body { padding: 5px; font-size: 14px; }
            button { font-size: 13px; padding: 10px 12px; min-height: 44px; }
            .book-header h3 { font-size: 14px; }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0b1329;
                --card-bg: #131b31;
                --gold-primary: #f6e05e;
                --gold-dark: #d4af37;
                --text-main: #f1f5f9;
                --border-color: #22304a;
                --color-taken: #ff6b6b;
                --color-read: #51cf66;
                --color-free: #fcc419;
            }
            body { background-color: #0b1329 !important; color: #f1f5f9 !important; }
        }

        .user-active {
            background: linear-gradient(135deg, rgba(39,174,96,0.1), rgba(39,174,96,0.05));
            border: 2px solid #27ae60;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .user-active .name {
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
        }
        .user-active .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .analysis-card {
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .analysis-card .number {
            font-size: 24px;
            font-weight: bold;
            margin-top: 4px;
        }

        .admin-panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .admin-section {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .admin-section h4 {

            font-size: 14px;
        }

        .admin-section.book-section { background: rgba(46,204,113,0.06); border: 1px solid #27ae60; }
        .admin-section.bulk-section { background: rgba(155,89,182,0.06); border: 1px solid #8e44ad; }
        @media (max-width: 640px) {
            .admin-panel-grid { grid-template-columns: 1fr !important; }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d2d2d;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #2980b9; }
        
        .d-tab-btn.active {
            background: var(--gold-primary) !important;
            color: #fff !important;
        }
        .d-tab-content {
            display: block;
        }
        .d-tab-content[style*="display: none"] {
            display: none !important;
        }
    </style>
</head>

        <script>
        async function fetchPrayerTimes() {
            const city = document.getElementById('citySelect').value;
            const resultDiv = document.getElementById('prayerTimesResult');
            resultDiv.innerHTML = "Vakitler yükleniyor...";
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=&method=13`);
                const data = await response.json();
                if(data && data.data && data.data.timings) {
                    const t = data.data.timings;
                    resultDiv.innerHTML = `İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}`;
                } else {
                    resultDiv.innerHTML = "Vakitler alınamadı.";
                }
            } catch (error) {
                resultDiv.innerHTML = "Bağlantı hatası.";
            }
        }
        async function fetchPrayerTimesByGPS() {
            const resultDiv = document.getElementById('prayerTimesResult');
            if (!navigator.geolocation) { resultDiv.innerHTML = "Tarayıcınız konum desteklemiyor."; return; }
            resultDiv.innerHTML = "Konum alınıyor...";
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=13`);
                    const data = await response.json();
                    if(data && data.data && data.data.timings) {
                        const t = data.data.timings;
                        resultDiv.innerHTML = `İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}`;
                    } else {
                        resultDiv.innerHTML = "Konuma göre vakitler alınamadı.";
                    }
                } catch (error) {
                    resultDiv.innerHTML = "Bağlantı hatası.";
                }
            }, (error) => {
                resultDiv.innerHTML = "Konum izni reddedildi.";
            });
        }
        document.addEventListener("DOMContentLoaded", fetchPrayerTimes);
        </script>

            // TARİH VE İLHAM FONKSİYONLARI
            function bugunkuHicriTarihiAl() {
                const ayAdlari = {
                    "01": "Muharrem", "02": "Sefer", "03": "Rebiülevvel", "04": "Rebiülahir",
                    "05": "Cemaziyelevvel", "06": "Cemaziyelahir", "07": "Recep", "08": "Şaban",
                    "09": "Ramazan", "10": "Şevval", "11": "Zilkade", "12": "Zilhicce"
                };
                try {
                    const formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric' });
                    const parts = formatter.formatToParts(new Date());
                    let gun = "1", ay = "3", yil = "1448";
                    for (const part of parts) {
                        if (part.type === 'day') gun = part.value;
                        if (part.type === 'month') ay = part.value;
                        if (part.type === 'year') yil = part.value.replace(/[^0-9]/g, '');
                    }
                    let ayKoduStr = String(ay).padStart(2, '0');
                    let ayAdi = ayAdlari[ayKoduStr] || "Rebiülevvel";
                    return { ayKodu: ayKoduStr, gunNumarasi: parseInt(gun, 10), fullStr: `${gun} ${ayAdi} ${yil}` };
                } catch (hata) {
                    return { ayKodu: "03", gunNumarasi: 1, fullStr: "1 Rebiülevvel 1448" };
                }
            }

            async function fetchHijriMonthData(ayKodu) {
                if (monthlyInspirationCache[ayKodu]) return monthlyInspirationCache[ayKodu];
                const fileMap = {
                    "01": "json/01-muharrem.json",
                    "02": "json/02-sefer.json",
                    "03": "json/03-rebiülevvel.json",
                    "04": "json/04-rebiülahir.json",
                    "05": "json/05-cemaziyelevvel.json",
                    "06": "json/06-cemaziyelahir.json",
                    "07": "json/07-recep.json",
                    "08": "json/08-saban.json",
                    "09": "json/09-ramazan.json",
                    "10": "json/10-sevval.json",
                    "11": "json/11-zilkade.json",
                    "12": "json/12-zilhicce.json"
                };
                let filePath = fileMap[ayKodu] || "json/03-rebiülevvel.json";
                try {
                    const response = await fetch(filePath);
                    if (!response.ok) throw new Error('Dosya bulunamadı');
                    const data = await response.json();
                    monthlyInspirationCache[ayKodu] = data;
                    return data;
                } catch (e) {
                    console.error('JSON yüklenemedi:', e);
                    return null;
                }
            }

            async function getHijriInspiration() {
                const now = new Date();
                const gun = now.getDate();
                const ayAdlari = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
                const ayAdi = ayAdlari[now.getMonth()];
                const yil = now.getFullYear();
                const todayMiladiStr = `${gun} ${ayAdi} ${yil}`;
                const hicriInfo = bugunkuHicriTarihiAl();
                let hDay = hicriInfo.gunNumarasi;
                let hMonth = hicriInfo.ayKodu;
                let todayHijriStr = hicriInfo.fullStr;
                let jsonData = await fetchHijriMonthData(hMonth);
                let item = null;
                if (jsonData) {
                    if (Array.isArray(jsonData)) {
                        item = jsonData[hDay - 1] || jsonData[hDay];
                    } else if (typeof jsonData === 'object') {
                        item = jsonData[hDay] || jsonData[String(hDay)] || jsonData[String(hDay).padStart(2, '0')] || jsonData[String(parseInt(hDay, 10))];
                    }
                }
                let verseText = "Bu güne ait ayet verisi bulunamadı.";
                let hadishText = "Bu güne ait hadis verisi bulunamadı.";
                if (item) {
                    if (item.ayet) {
                        let meal = typeof item.ayet === 'object' ? (item.ayet.meal || item.ayet.text || "") : String(item.ayet);
                        let kaynak = typeof item.ayet === 'object' ? (item.ayet.kaynak || item.ayet.source || "") : "";
                        verseText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                    let h = item.hadis || item.hadish;
                    if (h) {
                        let meal = typeof h === 'object' ? (h.meal || h.text || "") : String(h);
                        let kaynak = typeof h === 'object' ? (h.kaynak || h.source || "") : "";
                        hadishText = kaynak ? `${meal} (${kaynak})` : meal;
                    }
                }
                return { fullDateStr: todayHijriStr, miladiDateStr: todayMiladiStr, verse: verseText, hadish: hadishText };
            }

                    let result = {
                        name: memberName,
                        groups: [],
                        books: [],
                        totalTaken: 0,
                        totalRead: 0,
                        completedBooks: 0,
                        readingLogs: []
                    };
                    
                    let groups = groupName ? [groupName] : allGroupKeys;
                    
                    groups.forEach(gKey => {
                        const data = localStorage.getItem(`hatim_group_${gKey}`);
                        if (!data) return;
                        try {
                            const parsed = JSON.parse(data);
                            if (!parsed.members || !parsed.members.includes(memberName)) return;
                            
                            result.groups.push(gKey);
                            
                            if (parsed.books && parsed.bookPages) {
                                parsed.books.forEach(b => {
                                    let taken = 0, read = 0;
                                    let unitDetails = [];
                                    if (parsed.bookPages[b.id]) {
                                        parsed.bookPages[b.id].forEach((p, idx) => {
                                            if (p.owner === memberName) {
                                                taken++;
                                                unitDetails.push({
                                                    unit: idx + 1,
                                                    owner: p.owner,
                                                    isRead: p.isRead,
                                                    readDate: p.readDate || null,
                                                    range: `${idx+1}. bölüm`
                                                });
                                                if (p.isRead) {
                                                    read++;
                                                    result.readingLogs.push({
                                                        date: p.readDate || 'Tarih yok',
                                                        time: p.readTime || '--:--',
                                                        bookName: b.name,
                                                        unit: idx + 1,
                                                        range: `${idx+1}. bölüm`,
                                                        group: gKey
                                                    });
                                                }
                                            }
                                        });
                                    }
                                    if (taken > 0) {
                                        result.books.push({
                                            name: b.name,
                                            total: b.totalUnits,
                                            taken: taken,
                                            read: read,
                                            group: gKey,
                                            readPercent: taken > 0 ? Math.round((read / taken) * 100) : 0,
                                            completed: taken === b.totalUnits && read === b.totalUnits,
                                            units: unitDetails
                                        });
                                        result.totalTaken += taken;
                                        result.totalRead += read;
                                    }
                                });
                            }
                        } catch(e) {}
                    });
                    
                    result.completedBooks = result.books.filter(b => b.completed).length;
                    result.books.sort((a, b) => b.taken - a.taken);
                    result.readingLogs.sort((a, b) => (a.date > b.date) ? -1 : 1);
                    
                    return result;

            // getRangeStatus
            function getRangeStatus(baseArray, start, end) {
                let subset = baseArray.slice(start, end);
                let allFree = subset.every(p => !p.owner);
                let firstOwner = subset[0].owner;
                let firstIsRead = subset[0].isRead;
                let allSame = subset.every(p => p.owner === firstOwner && p.isRead === firstIsRead && p.owner !== "");
                if (allFree) return { owner: "", isRead: false, statusType: "free" };
                else if (allSame) return { owner: firstOwner, isRead: firstIsRead, statusType: firstIsRead ? "read" : "taken" };
                else {
                    let owners = [...new Set(subset.map(p => p.owner).filter(Boolean))];
                    return { owner: owners.join(", "), isRead: false, statusType: "mixed" };
                }
            }

            // renderBooks
            function renderBooks() {
                const openBookIds = Array.from(document.querySelectorAll(".book-card.open")).map(el => el.getAttribute("data-book-id"));
                booksGrid.innerHTML = "";

                appData.books.forEach((book) => {
                    let baseArray = appData.bookPages[book.id];
                    let defModes = bookModesDefs[book.id] || createPageModes(book.totalUnits || 30);
                    let modeKeys = Object.keys(defModes);
                    if (!modeKeys.includes(book.currentMode)) book.currentMode = modeKeys[0];
                    let items = defModes[book.currentMode].getItems();

                    let takenCount = 0;
                    baseArray.forEach(p => { if (p.owner) takenCount++; });
                    let percent = book.totalUnits > 0 ? Math.round((takenCount / book.totalUnits) * 100) : 0;

                    let hatimInfo = appData.bookHatims[book.id] || { hatimNo: 1, startDate: new Date().toLocaleDateString("tr-TR"), prayerDone: false };
                    let isOpen = openBookIds.includes(book.id);

                    let card = document.createElement("div");
                    card.className = `book-card ${isOpen ? "open" : ""}`;
                    card.setAttribute("data-book-id", book.id);
                    card.style.cssText = "border: 2px solid var(--gold-primary); border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: var(--card-bg);";

                    let modeButtonsHtml = modeKeys.map(mk => {
                        let mObj = defModes[mk];
                        let isActive = mk === book.currentMode;
                        return `<button class="mode-btn ${isActive ? 'active' : ''}" data-book-id="${book.id}" data-mode="${mk}" style="padding: 10px 16px; font-size: 13px; border-radius: 6px; border: 1px solid var(--border-color); background: ${isActive ? 'var(--gold-primary)' : 'var(--card-bg)'}; color: ${isActive ? '#fff' : 'var(--text-main)'}; cursor: pointer; font-weight: bold; min-height: 44px; touch-action: manipulation;">${mObj.name}</button>`;
                    }).join('');

                    let itemsHtml = items.map((pi, index) => {
                        let st = getRangeStatus(baseArray, pi.start, pi.end);
                        let statusClass = "status-free";
                        let statusText = "🟡 Boş";

                        if (st.statusType === "taken") {
                            statusClass = "status-taken";
                            statusText = `🔴 ${st.owner} (Alındı)`;
                        } else if (st.statusType === "read") {
                            statusClass = "status-read";
                            statusText = `🟢 ${st.owner} (✓ Okundu)`;
                        } else if (st.statusType === "mixed") {
                            statusClass = "status-mixed";
                            statusText = `🔵 Karma: ${st.owner}`;
                        }

                        let isOwner = loggedInMember && st.owner.includes(loggedInMember);
                        let actionButtons = "";

                        let pageNumber = 1;
                        if (bookSectionPages[book.id] && bookSectionPages[book.id].getPage) {
                            pageNumber = bookSectionPages[book.id].getPage(index);
                        } else {
                            pageNumber = index + 1;
                        }

                        let pdfBtn = `<button class="pdf-page-btn" data-book-id="${book.id}" data-page="${pageNumber}" style="padding: 8px 14px; background: #8e44ad; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; min-height: 44px; touch-action: manipulation;">📄 PDF ${pageNumber}</button>`;

                        if (loggedInMember) {
                            if (st.statusType === "free") {
                                actionButtons = `
                                    <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                                        ${pdfBtn}
                                        <button class="take-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 10px 18px; background: #f39c12; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; min-height: 44px; touch-action: manipulation;">Hisse Al</button>
                                    </div>
                                `;
                            } else if (isOwner) {
                                if (st.statusType === "taken") {
                                    actionButtons = `
                                        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                                            ${pdfBtn}
                                            <button class="read-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 10px 18px; background: #27ae60; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; min-height: 44px; touch-action: manipulation;">✅ Okundu</button>
                                            <button class="release-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 10px 18px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; min-height: 44px; touch-action: manipulation;">❌ Vazgeç</button>
                                        </div>
                                    `;
                                } else if (st.statusType === "read") {
                                    actionButtons = `
                                        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                                            ${pdfBtn}
                                            <button class="unread-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 10px 18px; background: #e67e22; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; min-height: 44px; touch-action: manipulation;">↩️ Okunmadı</button>
                                            <button class="release-range-btn" data-book-id="${book.id}" data-start="${pi.start}" data-end="${pi.end}" style="padding: 10px 18px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; min-height: 44px; touch-action: manipulation;">❌ Vazgeç</button>
                                        </div>
                                    `;
                                }
                            } else {
                                actionButtons = `<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">${pdfBtn}</div>`;
                            }
                        } else {
                            actionButtons = `<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">${pdfBtn}</div>`;
                        }

                        return `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; margin-bottom: 6px; border-radius: 8px; border: 1px solid var(--border-color); ${statusClass} flex-wrap: wrap; gap: 10px;">
                                <div>
                                    <div style="font-weight: bold; font-size: 15px;">${pi.name}</div>
                                    <div style="font-size: 13px; opacity: 0.85; margin-top: 2px;">${statusText}</div>
                                </div>
                                <div>${actionButtons}</div>
                            </div>
                        `;
                    }).join('');

                    let headerPdfBtn = `<button class="pdf-book-btn" data-book-id="${book.id}" style="padding: 8px 16px; background: #8e44ad; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; min-height: 44px; touch-action: manipulation;">📄 PDF</button>`;

                    card.innerHTML = `
                        <div class="book-header">
                            <div>
                                <h3 style="margin: 0; font-size: 17px; color: var(--gold-dark);">${book.name}</h3>
                                <div style="font-size: 12px; opacity: 0.8; margin-top: 3px;">🔁 Hatim No: ${hatimInfo.hatimNo} | 📊 İlerleme: %${percent} (${takenCount}/${book.totalUnits})</div>
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                                ${headerPdfBtn}
                                <span style="font-size: 14px; font-weight: bold; color: var(--gold-dark); cursor: pointer;">${isOpen ? '▲ Gizle' : '▼ Göster'}</span>
                            </div>
                        </div>
                        <div class="book-body" style="display: ${isOpen ? 'block' : 'none'};">
                            <div style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">${modeButtonsHtml}</div>
                            <div style="max-height: 400px; overflow-y: auto; padding-right: 4px;">${itemsHtml}</div>
                        </div>
                    `;

                    booksGrid.appendChild(card);
                });

                document.querySelectorAll(".book-header").forEach(header => {
                    header.addEventListener("click", (e) => {
                        if (e.target.closest(".pdf-book-btn") || e.target.closest(".pdf-page-btn") || e.target.closest("button")) return;
                        let card = header.closest(".book-card");
                        card.classList.toggle("open");
                        renderBooks();
                    });
                });

                document.querySelectorAll(".pdf-book-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        let bookId = btn.getAttribute("data-book-id");
                        let page = 1;
                        if (bookSectionPages[bookId] && bookSectionPages[bookId].getPage) {
                            page = bookSectionPages[bookId].getPage(0);
                        }
                        openPdfToPage(bookId, page);
                    });
                });

                document.querySelectorAll(".pdf-page-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        let bookId = btn.getAttribute("data-book-id");
                        let page = parseInt(btn.getAttribute("data-page"), 10);
                        openPdfToPage(bookId, page);
                    });
                });

                document.querySelectorAll(".mode-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        let bId = btn.getAttribute("data-book-id");
                        let mKey = btn.getAttribute("data-mode");
                        let bookObj = appData.books.find(b => b.id === bId);
                        if (bookObj) {
                            bookObj.currentMode = mKey;
                            saveGroupData();
                            renderBooks();
                        }
                    });
                });

                document.querySelectorAll(".take-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        if (!loggedInMember) { showToast('Lütfen önce isminizi seçin.', 'error'); return; }
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { baseArray[i].owner = loggedInMember; baseArray[i].isRead = false; }
                        if (!appData.readingLogs) appData.readingLogs = [];
                        let defModes = bookModesDefs[bId];
                        let modeObj = Object.values(defModes).find(m => m.getItems().some(item => item.start === start && item.end === end));
                        let rangeName = modeObj ? modeObj.getItems().find(item => item.start === start && item.end === end).name : `${start+1}-${end}`;
                        appData.readingLogs.push({
                            date: new Date().toLocaleDateString("tr-TR") + " " + new Date().toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'}),
                            timestamp: Date.now(),
                            member: loggedInMember,
                            bookName: appData.books.find(b => b.id === bId).name,
                            range: rangeName,
                            count: end - start
                        });
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                        showToast(`✅ ${rangeName} hissesi alındı!`, 'success');
                    });
                });

                document.querySelectorAll(".read-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        let now = new Date().toLocaleDateString("tr-TR");
                        let time = new Date().toLocaleTimeString("tr-TR", {hour: '2-digit', minute:'2-digit'});
                        for (let i = start; i < end; i++) { 
                            baseArray[i].isRead = true;
                            baseArray[i].readDate = now;
                            baseArray[i].readTime = time;
                        }
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                        showToast(`✅ Bölüm okundu olarak işaretlendi!`, 'success');
                    });
                });

                document.querySelectorAll(".unread-range-btn").forEach(btn => {

                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { 
                            baseArray[i].isRead = false;
                            baseArray[i].readDate = undefined;
                            baseArray[i].readTime = undefined;
                        }
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                        showToast(`↩️ Bölüm okunmadı olarak işaretlendi.`, 'info');
                    });
                });

                document.querySelectorAll(".release-range-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        let bId = btn.getAttribute("data-book-id");
                        let start = parseInt(btn.getAttribute("data-start"), 10);
                        let end = parseInt(btn.getAttribute("data-end"), 10);
                        let baseArray = appData.bookPages[bId];
                        for (let i = start; i < end; i++) { 
                            baseArray[i].owner = ""; 
                            baseArray[i].isRead = false;
                            baseArray[i].readDate = undefined;
                            baseArray[i].readTime = undefined;
                        }
                        saveGroupData();
                        renderBooks();
                        renderAnalysisSection();
                        showToast(`❌ Hisseden vazgeçildi.`, 'error');
                    });
                });
            }

            function renderAnalysisSection() {

                }

                let totalBooks = appData.books.length;
                let totalTakenUnits = 0, totalReadUnits = 0, totalUnitsAll = 0;
                appData.books.forEach(book => {
                    let baseArray = appData.bookPages[book.id];
                    totalUnitsAll += book.totalUnits;
                    baseArray.forEach(p => {
                        if (p.owner) totalTakenUnits++;
                        if (p.isRead) totalReadUnits++;
                    });
                });
                let percentTaken = totalUnitsAll > 0 ? Math.round((totalTakenUnits / totalUnitsAll) * 100) : 0;
                let percentRead = totalUnitsAll > 0 ? Math.round((totalReadUnits / totalUnitsAll) * 100) : 0;

                analysisContainer.innerHTML = `
                    <h3 style="margin-bottom: 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                        <span>📈 Grup İlerleme</span>

                        </div>
                        <div class="analysis-card" style="border-left: 4px solid #27ae60;">
                            <div style="font-size: 12px; opacity: 0.7;">Okunan</div>
                            <div class="number">${totalReadUnits} / ${totalUnitsAll}</div>
                            <div style="font-size: 13px; color: #27ae60;">%${percentRead}</div>
                        </div>
                    </div>
                `;

            async function loadGroupData() {
                const savedData = localStorage.getItem(`hatim_group_${currentGroup}`);
                appData = savedData ? JSON.parse(savedData) : { members: currentGroup === "grup_1" ? [] : [], password: "" };

                if (!appData.members) appData.members = [];
                if (appData.password === undefined) appData.password = "";
                if (!appData.readingLogs) appData.readingLogs = [];

                const savedSession = localStorage.getItem(`hatim_session_${currentGroup}`);
                loggedInMember = (savedSession && appData.members.includes(savedSession)) ? savedSession : "";

                if (!appData.bookPages) appData.bookPages = {};
                if (!appData.bookHatims) appData.bookHatims = {};
                if (!appData.bookHistory) appData.bookHistory = {};

                const todayStr = new Date().toLocaleDateString("tr-TR");
                defaultBooksTemplate.forEach(defBook => {
                    if (!appData.bookPages[defBook.id]) appData.bookPages[defBook.id] = Array(defBook.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    if (!appData.bookHatims[defBook.id]) appData.bookHatims[defBook.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[defBook.id]) appData.bookHistory[defBook.id] = [];
                });

                if (!appData.books) {
                    appData.books = JSON.parse(JSON.stringify(defaultBooksTemplate));
                } else {
                    defaultBooksTemplate.forEach(defBook => {
                        let existing = appData.books.find(b => b.id === defBook.id);
                        if (!existing) appData.books.push(JSON.parse(JSON.stringify(defBook)));
                        else {
                            if (!existing.currentMode) existing.currentMode = defBook.defaultMode;
                            if (!existing.totalUnits) existing.totalUnits = defBook.totalUnits;
                        }
                    });
                }

                appData.books.forEach(b => {
                    if (!appData.bookPages[b.id]) {
                        appData.bookPages[b.id] = Array(b.totalUnits).fill(null).map(() => ({ owner: "", isRead: false }));
                    } else if (appData.bookPages[b.id].length !== b.totalUnits) {
                        if (appData.bookPages[b.id].length < b.totalUnits) {
                            while (appData.bookPages[b.id].length < b.totalUnits) {
                                appData.bookPages[b.id].push({ owner: "", isRead: false });
                            }
                        } else {
                            appData.bookPages[b.id] = appData.bookPages[b.id].slice(0, b.totalUnits);
                        }
                    }
                    if (!appData.bookHatims[b.id]) appData.bookHatims[b.id] = { hatimNo: 1, startDate: todayStr, prayerDone: false };
                    if (!appData.bookHistory[b.id]) appData.bookHistory[b.id] = [];
                });

                rebuildBookModesDefs();
                saveGroupData();
                await renderDailyInspiration();
                renderBooks();
                renderAnalysisSection();
                renderAdminSectionAtBottom();
                updateAutocompleteLists();
                updateUserInterface();
            }

            function saveGroupData() {
                localStorage.setItem(`hatim_group_${currentGroup}`, JSON.stringify(appData));
            }

            await loadGroupData();
        });
    </script>
</body>
</html>
