        byBook[s.book_id].taken++;
        if (s.is_read) byBook[s.book_id].read++;
        if (s.read_date) byBook[s.book_id].dates.push(s.read_date);
        if (s.read_date) byBook[s.book_id].readDates.push(s.read_date + (s.read_time ? ' ' + s.read_time : ''));
        if (s.take_date) byBook[s.book_id].takeDates.push(s.take_date + (s.take_time ? ' ' + s.take_time : ''));
      });
      var bookRows = Object.keys(byBook).map(function (bid) {
        var b = null;
        for (var j=0;j<books.length;j++){ if (books[j].id === bid) { b = books[j]; break; } }
        if (!b) b = { id: bid, name: bid, total_units: 0 };
        var d = byBook[bid];
        return { id: b.id, name: b.name, taken: d.taken, read: d.read, totalUnits: b.total_units || 0, completed: d.read >= d.taken, dates: d.dates, takeDates: d.takeDates, readDates: d.readDates };
      });
      var groupKey = null;
      mems.forEach(function (m) { if (m.group_key) groupKey = m.group_key; });
      return { name: name, password: mems[0].password || "", groupKey: groupKey, books: bookRows };
    });
  };
  window._sbUpdatePassword = function (name, newPwd) {
    return rest.select("members", "?select=id,name").then(function (allM) {
      var target = null;
      (allM || []).forEach(function (m) { if (m.name === name) target = m; });
      if (!target) throw new Error("\u00dcye bulunamad\u0131: " + name);
      return api("/members?id=eq." + target.id, { method: "PATCH", headers: { "Prefer": "return=representation" }, body: JSON.stringify({ password: newPwd }) });
    });
  };
  window._sbUpdateName = function (oldName, newName) {
    return rest.select("members", "?select=id,name").then(function (allM) {
      var target = null;
      (allM || []).forEach(function (m) { if (m.name === oldName) target = m; });
      if (!target) throw new Error("\u00dcye bulunamad\u0131: " + oldName);
      return api("/members?id=eq." + target.id, { method: "PATCH", headers: { "Prefer": "return=representation" }, body: JSON.stringify({ name: newName }) });
    });
  };
  window._sbRenameOwner = function (oldName, newName) {
    // Hisse sahipliklerini (owner) eski isimden yeni isme taşı: members adı güncellendiği için
    // shares.member_id referansları aynı kalır. Burada yalnızca cache'teki owner etiketlerini senkron tutarız.
    return rest.select("members", "?select=id,name").then(function (allM) {
      var target = null;
      (allM || []).forEach(function (m) { if (m.name === oldName) target = m; });
      if (target) {
        // owner bilgisi asıl olarak shares.member_id üzerinden çözülür, isim güncellendiğinde otomatik düzelir.
        return Promise.resolve({ ok: true });
      }
      return Promise.resolve({ ok: true });
    });
  };
  window._sbPullAll = function () { return pullAll(); };

  localStorage.setItem = function (key, value) {
    origSetItem(key, value);
    try {
      if (!_initDone || !_userTouched) return; // yenileme/geri yükleme sırasında bayat local veri Supabase'e push edilmesin // açılış/geri yükleme sırasında Supabase'e bayat veri push edilmesin
      if (key && key.indexOf("hatim_group_") === 0 && key !== "hatim_bireysel_pool") {
        var g; try { g = JSON.parse(value); } catch (e) { return; }
        if (!g) return;
        var gkey = key.replace("hatim_group_", "");
        if (isIndividualGroup(g, gkey)) pushIndividual(g, gkey); else pushGroup(gkey, g);
      } else if (key === "hatim_bireysel_pool") {
        var p; try { p = JSON.parse(value); } catch (e) { return; }
        if (p) pushPool(p);
      }
    } catch (e) {}
  };

  function refreshUI() {
    try { if (typeof loadGroupData === "function") loadGroupData(); if (typeof updateUserInterface === "function") updateUserInterface(); if (typeof renderAdminSectionAtBottom === "function") renderAdminSectionAtBottom(); if (typeof updateAutocompleteLists === "function") updateAutocompleteLists(); } catch (e) {}
  }

  function doInit() {
    // Sayfa açılışında: yalnızca Supabase'ten çek (push etme). Bayat local veri kaynağı ezmesin.
    pullAll().then(function () { refreshUI(); });
    // Yönetici butonu bağlaması: renderAdminSectionAtBottom çökse de çalışsın
    setTimeout(function () { _initDone = true; }, 1800); // restore penceresi bittikten sonra push aktif
    // Yönetici modunu hatırla: 'Beni hatırla' işaretliyse şifre sormadan aç
    try {
      if (localStorage.getItem('hatim_admin_remember') === '1' && typeof window._sbIsAdmin==='function' && !window._sbIsAdmin()) {
        window._sbSetAdmin(true);
        setTimeout(function () {
          if (typeof window.renderAdminSectionAtBottom==='function') window.renderAdminSectionAtBottom();
          if (typeof window.showToast==='function') window.showToast('🔓 Yönetici modu açıldı.', 'info');
        }, 400);
      }
      var _ar = document.getElementById('admin-remember');
      if (_ar) _ar.checked = (localStorage.getItem('hatim_admin_remember') === '1');
    } catch(e){}
  }

  // DOMContentLoaded'de değil, HEmen çalıştır (köprü body sonunda -> DOM hazır).
  var t = setInterval(function () {
    if (document.readyState === "complete" || document.readyState === "interactive") {
      clearInterval(t);
      doInit();
    }
  }, 50);
  setTimeout(function () { doInit(); }, 500); // güvence: interval kaçarsa
  // v8: gerçek zamanlı polling — iki tarayıcı da açıkken birbirini görsün
  setInterval(function () {
    if (!_myPush) pullAll().then(function () {
      // Polling: veriyi guncelle ama admin panel HTML'ini yeniden cizme (acilir liste secimleri kaybolmasin)
      try { if (typeof loadGroupData === 'function') loadGroupData(); if (typeof updateUserInterface === 'function') updateUserInterface(); if (typeof updateAutocompleteLists === 'function') updateAutocompleteLists(); } catch(e){}
    });
  }, 3000);

})();

</script>
