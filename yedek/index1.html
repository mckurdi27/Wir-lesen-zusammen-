<!DOCTYPE html>
<html lang="tr">
<head>
<!-- ----- 1) <head> : meta, baslik, manifest ----- -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ortak Hatim ve Dua Takip Sistemi</title>
    <meta name="theme-color" content="#d4af37">
    <link rel="manifest" href="../manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hatim Takip">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../img/icon-512.png">

<!-- ----- 2) <style> : ANA CSS ----- -->
    <style>
        :root {
            --bg-primary: #fdfbf7;
            --card-bg: #ffffff;
            --gold-primary: #d4af37;
            --gold-dark: #8a6d3b;
            --text-main: #3e2723;
            --border-color: #e3dcd2;
            --color-taken: #e74c3c;
            --color-read: #27ae60;
            --color-free: #f39c12;
            --touch-target: 48px;
        }
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            padding: 10px;
            font-size: 16px;
            width: 100%;
        }
        img, table { max-width: 100%; }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button, .clickable {
            min-height: var(--touch-target);
            min-width: var(--touch-target);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            touch-action: manipulation;
        }
        .hdr-aksa { display: none; }

        /* ===== KARANLIK TEMA ===== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0b1329;
                --card-bg: #14203c;
                --gold-primary: #d4af37;
                --gold-dark: #b8912a;
                --text-main: #f1f5f9;
                --border-color: #22304a;
                --color-taken: #ff6b6b;
                --color-read: #51cf66;
                --color-free: #fcc419;
            }
            body { background-color: #0b1329 !important; color: #f1f5f9 !important; }
            #main-title-ornate-section { background: var(--card-bg) !important; border-color: var(--gold-dark) !important; border-top-color: var(--gold-dark) !important; }
            #main-title-ornate-section .hdr-mid div { color: var(--text-main) !important; }
            #main-title-ornate-section .hdr-mid .hdr-vakit-box { background: rgba(255,255,255,0.08) !important; }
            #prayerTimesResult { color: #f1f5f9 !important; }
        }

        /* ===== MOBIL (telefon) ===== */
        @media (max-width: 640px) {
            body { padding: 6px; font-size: 15px; }
            .container { padding: 0 5px; }
            #main-title-ornate-section { padding: 8px 10px !important; }
            #main-title-ornate-section > div {
                display: flex !important; flex-direction: row !important;
                flex-wrap: wrap !important; justify-content: center !important;
                align-items: flex-start !important; gap: 6px !important;
            }
            #main-title-ornate-section .hdr-img { flex: 0 0 30% !important; width: 30% !important; }
            #main-title-ornate-section .hdr-img img {
                height: auto !important; max-height: 100px !important; object-fit: contain !important;
            }
            #main-title-ornate-section .hdr-left { order: 1; }
            #main-title-ornate-section .hdr-aksa { order: 2; display: block !important; }
            #main-title-ornate-section .hdr-right { order: 3; }
            #main-title-ornate-section .hdr-mid {
                flex: 1 1 100% !important; min-width: 100% !important; order: 4; margin-top: 8px;
            }
        }
    </style>
</head>

<!-- ===================== <body> ===================== -->
<body>
<!-- ----- <body><.container> basi ----- -->
    <div class="container">

<!-- ----- BOLUM A : UST BASLIK + GORSEL ALANI (main-title) ----- -->
        <div id="main-title-ornate-section" style="margin-bottom: 2px; padding: 10px 15px; background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd0 100%); border: 2px solid #d4af37; border-top: 6px solid #8a6d3b; border-radius: 12px; box-shadow: 0 4px 15px rgba(138, 109, 59, 0.2);">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                <div class="hdr-img hdr-left" style="flex: 0 0 148px; text-align: center;">
                    <img src="../img/Nebevi.jpg" alt="" style="width: 100%; height: 220px; object-fit: cover; border-radius: 4px; border: 1px solid #d4af37; display: block;">
                </div>
                <div class="hdr-mid" style="flex: 1 1 auto; min-width: 220px; text-align: center;">
                    <div style="font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #3e2723;">
                        <span>Ortak Hatim<br>ve<br>Dualarda Buluşuyoruz<br></span>
                    </div>
                    <div style="font-size: 12px; opacity: 0.9; font-style: italic; margin-bottom: 8px; max-width: 340px; margin-left: auto; margin-right: auto; line-height: 1.45;">
                        Grubunuzu seçin, İsminizi belirleyin ve<br>manevi iklimde ortak hatim halkamıza katılın.
                    </div>
                    <div class="hdr-vakit-box" style="background: rgba(255,255,255,0.85); padding: 4px 6px; border-radius: 6px; border: 1px solid #d4af37; max-width: 220px; margin: 0 auto;">
                        <div style="margin-bottom: 4px; display: flex; gap: 8px; justify-content: center; align-items: center;">
                            <select id="citySelect" onchange="fetchPrayerTimes()" style="padding: 3px 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; min-height: 28px;">
                                <option value="Berlin">Berlin</option>
                                <option value="Istanbul">İstanbul</option>
                                <option value="Ankara">Ankara</option>
                                <option value="Izmir">İzmir</option>
                                <option value="Frankfurt">Frankfurt</option>
                                <option value="Makkah">Mekke</option>
                                <option value="Madinah">Medine</option>
                                <option value="London">Londra</option>
                                <option value="Paris">Paris</option>
                                <option value="Amsterdam">Amsterdam</option>
                                <option value="Vienna">Viyana</option>
                                <option value="New York">New York</option>
                            </select>
                            <button onclick="fetchPrayerTimesByGPS()" style="padding: 2px 6px; border-radius: 4px; background: #27ae60; color: white; border: none; cursor: pointer; font-size: 10px; font-weight: bold; min-height: 26px;">📍 GPS</button>
                        </div>
                        <div id="prayerTimesResult" style="font-size: 12px; color: #333; line-height: 1.4;">Vakitler yükleniyor...</div>
                    </div>
                </div>
                <div class="hdr-img hdr-right" style="flex: 0 0 148px; text-align: center;">
                    <img src="../img/Kabe.jpg" alt="" style="width: 100%; height: 220px; object-fit: cover; border-radius: 2px; border: 1px solid #d4af37; display: block;">
                </div>
                <div class="hdr-img hdr-aksa" style="flex: 0 0 148px; text-align: center;">
                    <img src="../img/Aksa.jpg" alt="" style="width: 100%; height: 220px; object-fit: cover; border-radius: 4px; border: 1px solid #d4af37; display: block;">
                </div>
            </div>
        </div>

    </div>

<!-- ----- NAMAZ VAKITLERI ----- -->
    <script>
        async function fetchPrayerTimes() {
            const city = document.getElementById('citySelect').value;
            const resultDiv = document.getElementById('prayerTimesResult');
            resultDiv.innerHTML = "Vakitler yükleniyor...";
            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=&method=13`);
                const data = await response.json();
                if (data && data.data && data.data.timings) {
                    const t = data.data.timings;
                    resultDiv.innerHTML = `İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}`;
                } else {
                    resultDiv.innerHTML = "Vakitler alınamadı.";
                }
            } catch (error) {
                resultDiv.innerHTML = "Bağlantı hatası.";
            }
        }
        async function fetchPrayerTimesByGPS() {
            const resultDiv = document.getElementById('prayerTimesResult');
            if (!navigator.geolocation) { resultDiv.innerHTML = "Tarayıcınız konum desteklemiyor."; return; }
            resultDiv.innerHTML = "Konum alınıyor...";
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=13`);
                    const data = await response.json();
                    if (data && data.data && data.data.timings) {
                        const t = data.data.timings;
                        resultDiv.innerHTML = `İmsak: ${t.Imsak} | Güneş: ${t.Sunrise} | Öğle: ${t.Dhuhr}<br>İkindi: ${t.Asr} | Akşam: ${t.Maghrib} | Yatsı: ${t.Isha}`;
                    } else {
                        resultDiv.innerHTML = "Konuma göre vakitler alınamadı.";
                    }
                } catch (error) {
                    resultDiv.innerHTML = "Bağlantı hatası.";
                }
            }, (error) => {
                resultDiv.innerHTML = "Konum izni reddedildi.";
            });
        }
        document.addEventListener("DOMContentLoaded", fetchPrayerTimes);
    </script>

</body>
</html>
